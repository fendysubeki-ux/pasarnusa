<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Produk Admin - PasarNusa</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>

<h1>🛍 Kelola Produk</h1>

<p>

Kelola seluruh produk marketplace PasarNusa.

</p>

</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;">

<a
href="dashboard-admin.html"
class="btn-secondary">

⬅ Dashboard

</a>

<button
onclick="location.reload()"
class="btn-primary">

🔄 Refresh

</button>

</div>

</div>

</section>

<section class="dashboard">

<h2>📊 Statistik Produk</h2>

<div class="dashboard-grid">

<div class="dashboard-card">

<h3 id="totalProduk">0</h3>

<p>Total Produk</p>

</div>

<div class="dashboard-card">

<h3 id="produkAktif">0</h3>

<p>Produk Aktif</p>

</div>

<div class="dashboard-card">

<h3 id="produkNonaktif">0</h3>

<p>Produk Nonaktif</p>

</div>

<div class="dashboard-card">

<h3 id="stokHabis">0</h3>

<p>Stok Habis</p>

</div>

</div>

</section>

<section class="dashboard">

<div style="display:flex;gap:15px;flex-wrap:wrap;">

<input
id="searchProduk"
class="search-box"
type="text"
placeholder="Cari produk...">

<select id="filterStatus">

<option value="Semua">

Semua Status

</option>

<option value="aktif">

Aktif

</option>

<option value="nonaktif">

Nonaktif

</option>

</select>

</div>

</section>

<section class="dashboard">

<div
id="produkContainer"
class="dashboard-grid">

<div class="dashboard-card">

Memuat produk...

</div>

</div>

</section>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc,
deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig={

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href="login.html";

throw new Error("Belum login");

}

const adminSnap=
await getDoc(
doc(
db,
"users",
auth.currentUser.uid
)
);

if(
!adminSnap.exists()||
adminSnap.data().role!=="admin"
){

alert("Akses khusus Admin");

window.location.href="index.html";

throw new Error("Bukan Admin");

}

const container=
document.getElementById(
"produkContainer"
);

let semuaProduk=[];

async function loadProduk(){

container.innerHTML=
"<p>Memuat produk...</p>";

const snapshot=
await getDocs(
collection(db,"produk")
);

semuaProduk=[];

let total=0;
let aktif=0;
let nonaktif=0;
let stokKosong=0;

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

total++;

const status=
String(
data.status||"aktif"
).toLowerCase();

if(status==="aktif"){

aktif++;

}else{

nonaktif++;

}

if(
Number(data.stok||0)<=0
){

stokKosong++;

}

semuaProduk.push({

id:docSnap.id,

...data

});

});

document.getElementById(
"totalProduk"
).innerText=total;

document.getElementById(
"produkAktif"
).innerText=aktif;

document.getElementById(
"produkNonaktif"
).innerText=nonaktif;

document.getElementById(
"stokHabis"
).innerText=stokKosong;

renderProduk();

}
function renderProduk(){

const keyword=
document.getElementById(
"searchProduk"
).value.toLowerCase();

const filter=
document.getElementById(
"filterStatus"
).value.toLowerCase();

container.innerHTML="";

const hasil=
semuaProduk.filter((produk)=>{

const nama=
String(
produk.namaProduk||
produk.nama||
""
).toLowerCase();

const status=
String(
produk.status||
"aktif"
).toLowerCase();

const cocokNama=
nama.includes(keyword);

const cocokStatus=
filter==="semua"
||
status===filter;

return cocokNama && cocokStatus;

});

if(hasil.length===0){

container.innerHTML=`

<div class="dashboard-card">

<h3>
Produk tidak ditemukan
</h3>

<p>
Tidak ada produk yang sesuai.
</p>

</div>

`;

return;

}

hasil.forEach((produk)=>{

const warna=
String(produk.status).toLowerCase()==="aktif"
?
"#16a34a"
:
"#dc2626";

const status=
String(produk.status).toLowerCase()==="aktif"
?
"Aktif"
:
"Nonaktif";

container.innerHTML+=`

<div class="dashboard-card">

<img
src="${produk.fotoProduk||produk.gambar||'https://placehold.co/400x300?text=Produk'}"
style="
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
margin-bottom:12px;
">

<h3>

${produk.namaProduk||"-"}

</h3>

<p>

🏪 ${produk.namaToko||"-"}

</p>

<p>

💰 Rp ${Number(
produk.harga||0
).toLocaleString("id-ID")}

</p>

<p>

📦 Stok :
${produk.stok||0}

</p>

<p>

<span style="
background:${warna};
color:#fff;
padding:5px 10px;
border-radius:8px;
">

${status}

</span>

</p>

<div style="
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
">

<a
href="detail-produk-admin.html?id=${produk.id}"
class="btn-secondary">

👁 Detail

</a>

<button
class="btn-primary"
onclick="ubahStatusProduk('${produk.id}','aktif')">

Aktifkan

</button>

<button
class="btn-secondary"
onclick="ubahStatusProduk('${produk.id}','nonaktif')">

Nonaktifkan

</button>

<button
class="btn-secondary"
onclick="hapusProduk('${produk.id}')">

🗑 Hapus

</button>

</div>

</div>

`;

});

}
window.ubahStatusProduk = async(id,status)=>{

try{

await updateDoc(
doc(db,"produk",id),
{
status:status
}
);

alert(
"Status produk berhasil diperbarui."
);

await loadProduk();

}
catch(error){

console.error(error);

alert(error.message);

}

};

window.hapusProduk = async(id)=>{

if(
!confirm(
"Yakin ingin menghapus produk ini?"
)
){

return;

}

try{

await deleteDoc(
doc(db,"produk",id)
);

alert(
"Produk berhasil dihapus."
);

await loadProduk();

}
catch(error){

console.error(error);

alert(error.message);

}

};

document
.getElementById("searchProduk")
.addEventListener(
"input",
renderProduk
);

document
.getElementById("filterStatus")
.addEventListener(
"change",
renderProduk
);

loadProduk();

</script>

</body>

</html>
