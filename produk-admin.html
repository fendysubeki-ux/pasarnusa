<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Produk Admin - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><section class="dashboard"><div class="dashboard-header"><div>
<h1>🛍 Kelola Produk</h1>
<p>Kelola seluruh produk marketplace PasarNusa</p>
</div><a href="admin.html" class="btn-secondary">
⬅ Dashboard Admin
</a></div><div class="dashboard-grid"><div class="dashboard-card">
<h3 id="totalProduk">0</h3>
<p>Total Produk</p>
</div><div class="dashboard-card">
<h3 id="produkAktif">0</h3>
<p>Produk Aktif</p>
</div><div class="dashboard-card">
<h3 id="produkNonaktif">0</h3>
<p>Produk Nonaktif</p>
</div><div class="dashboard-card">
<h3 id="stokHabis">0</h3>
<p>Stok Habis</p>
</div></div><div class="form-card"><input
type="text"
id="searchProduk"
placeholder="Cari nama produk atau UMKM...">

<select id="filterStatus"><option value="Semua">
Semua Status
</option><option value="Aktif">
Aktif
</option><option value="Nonaktif">
Nonaktif
</option></select></div><div
id="produkContainer"
class="dashboard-grid"><div class="dashboard-card">
<p>Memuat produk...</p>
</div></div></section><script type="module">

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
deleteDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container =
document.getElementById("produkContainer");

let semuaProduk = [];

async function loadProduk(){

try{

const snapshot =
await getDocs(
collection(db,"produk")
);

semuaProduk = [];

let aktif = 0;
let nonaktif = 0;
let habis = 0;
let totalNilai = 0;

snapshot.forEach((item)=>{

const data = item.data();

semuaProduk.push({
id:item.id,
...data
});

if(data.status === "Nonaktif"){
nonaktif++;
}else{
aktif++;
}

if(Number(data.stok || 0) <= 0){
habis++;
}

totalNilai +=
Number(data.harga || 0) *
Number(data.stok || 0);

});

semuaProduk.reverse();

document.getElementById("totalProduk").innerText =
semuaProduk.length;

document.getElementById("produkAktif").innerText =
aktif;

document.getElementById("produkNonaktif").innerText =
nonaktif;

document.getElementById("stokHabis").innerText =
habis;

renderProduk();

}catch(error){

console.error(error);

container.innerHTML = `
<div class="dashboard-card">
<h3>Error</h3>
<p>${error.message}</p>
</div>
`;

}

}

function renderProduk(){

const keyword =
document.getElementById("searchProduk")
.value
.toLowerCase();

const filter =
document.getElementById("filterStatus")
.value;

container.innerHTML = "";

const hasil =
semuaProduk.filter((produk)=>{

const cocokNama =
(produk.namaProduk || "")
.toLowerCase()
.includes(keyword);

const cocokUmkm =
(produk.namaUmkm || "")
.toLowerCase()
.includes(keyword);

const cocokStatus =
filter === "Semua"
||
(produk.status || "Aktif")
=== filter;

return (
(cocokNama || cocokUmkm)
&& cocokStatus
);

});

if(hasil.length === 0){

container.innerHTML = `
<div class="dashboard-card">
<h3>Tidak Ada Produk</h3>
<p>Produk tidak ditemukan</p>
</div>
`;

return;

}

hasil.forEach((produk)=>{

container.innerHTML += `

<div class="dashboard-card">

<img
src="${produk.gambar?.[0] || 'https://picsum.photos/400'}"
style="
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
">

<h3>${produk.namaProduk}</h3>

<p>🏪 ${produk.namaUmkm || "-"}</p>

<p>
💰 Rp ${Number(
produk.harga || 0
).toLocaleString("id-ID")}
</p>

<p>
📦 Stok:
${produk.stok || 0}
</p>

${
Number(produk.stok || 0) <= 0
?
`<span class="category">
STOK HABIS
</span>`
:
""
}

<p>
🔥 Terjual:
${produk.terjual || 0}
</p>

<p>
Status:
<b>
${produk.status || "Aktif"}
</b>
</p>

<div class="action-buttons">

<button
onclick="toggleStatus('${produk.id}','${produk.status || "Aktif"}')"
class="btn-secondary">

${(produk.status || "Aktif") === "Aktif"
? "Nonaktifkan"
: "Aktifkan"}

</button>

<button
onclick="hapusProduk('${produk.id}')"
class="delete-btn">

Hapus

</button>

</div>

</div>

`;

});

}

window.toggleStatus =
async(id,status)=>{

await updateDoc(
doc(db,"produk",id),
{
status:
status === "Aktif"
? "Nonaktif"
: "Aktif"
}
);

loadProduk();

};

window.hapusProduk =
async(id)=>{

const yakin =
confirm(
"Yakin ingin menghapus produk?"
);

if(!yakin) return;

await deleteDoc(
doc(db,"produk",id)
);

loadProduk();

};

document
.getElementById("searchProduk")
.addEventListener(
"input",
renderProduk
);

document
.getElementById("filterStatus")
.addEventListener(
"change",
renderProduk
);

loadProduk();

</script>

</script></body>
</html>
