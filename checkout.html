<!DOCTYPE html><html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><section class="checkout-section"><div class="form-card"><h1>🛒 Checkout Pesanan</h1><input
type="text"
id="namaPembeli"
placeholder="Nama Lengkap">

<input
type="tel"
id="whatsappPembeli"
placeholder="Nomor WhatsApp">

<textarea
id="alamatPembeli"
placeholder="Alamat Lengkap">
</textarea><select id="kotaTujuan"><option value="">
Pilih Kota Tujuan
</option><option value="Tulungagung">
Tulungagung
</option><option value="Blitar">
Blitar
</option><option value="Kediri">
Kediri
</option><option value="Trenggalek">
Trenggalek
</option></select></div><div class="cart-card"><h3>🎟 Voucher</h3><input
type="text"
id="kodeVoucher"
placeholder="Masukkan kode voucher">

<button
id="cekVoucher"
class="btn-secondary">

Gunakan Voucher

</button><p id="voucherInfo">
Belum menggunakan voucher
</p></div><div class="cart-card"><h3>📦 Ringkasan Belanja</h3><p id="subtotalInfo">
Subtotal : Rp 0
</p><p id="ongkirInfo">
Ongkir : Rp 0
</p><p id="diskonInfo">
Diskon : Rp 0
</p><hr><h2 id="totalBayar">
Total : Rp 0
</h2></div><div class="dashboard-card"><h3>Pembagian Pendapatan</h3><p>
UMKM :
<b id="pendapatanUmkm">
Rp 0
</b>
</p><p>
Affiliate :
<b id="komisiAffiliate">
Rp 0
</b>
</p><p>
Platform :
<b id="pendapatanPlatform">
Rp 0
</b>
</p></div><button
id="checkoutBtn"
class="btn-primary">

Buat Pesanan

</button></section><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
doc,
getDoc,
updateDoc,
increment,
getDocs,
query,
where
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

await auth.authStateReady();

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

if(cart.length === 0){

alert("Keranjang kosong");

window.location.href =
"cart.html";

}

let ongkir = 0;
let diskon = 0;
let voucherDipakai = null;

const subtotal =
cart.reduce(
(total,item)=>
total +
(item.harga * item.qty),
0
);

const persenUmkm = 90;
const persenAffiliate = 5;
const persenPlatform = 5;

function updateTotal(){

document.getElementById(
"subtotalInfo"
).innerText =
"Subtotal : Rp " +
subtotal.toLocaleString("id-ID");

document.getElementById(
"ongkirInfo"
).innerText =
"Ongkir : Rp " +
ongkir.toLocaleString("id-ID");

document.getElementById(
"diskonInfo"
).innerText =
"Diskon : Rp " +
diskon.toLocaleString("id-ID");

document.getElementById(
"totalBayar"
).innerText =
"Total : Rp " +
(
subtotal +
ongkir -
diskon
).toLocaleString("id-ID");

document.getElementById(
"pendapatanUmkm"
).innerText =
"Rp " +
Math.round(
subtotal *
(persenUmkm/100)
).toLocaleString("id-ID");

document.getElementById(
"komisiAffiliate"
).innerText =
"Rp " +
Math.round(
subtotal *
(persenAffiliate/100)
).toLocaleString("id-ID");

document.getElementById(
"pendapatanPlatform"
).innerText =
"Rp " +
Math.round(
subtotal *
(persenPlatform/100)
).toLocaleString("id-ID");

}

updateTotal();

document
.getElementById("kotaTujuan")
.addEventListener(
"change",
(e)=>{

switch(e.target.value){

case "Tulungagung":
ongkir = 5000;
break;

case "Blitar":
ongkir = 10000;
break;

case "Kediri":
ongkir = 12000;
break;

case "Trenggalek":
ongkir = 15000;
break;

default:
ongkir = 0;

}

updateTotal();

}
);

document
.getElementById("cekVoucher")
.addEventListener(
"click",
async()=>{

const kode =
document.getElementById(
"kodeVoucher"
).value.trim();

if(!kode) return;

const voucher =
await getDocs(
query(
collection(db,"voucher"),
where("kode","==",kode),
where("aktif","==",true)
)
);

if(voucher.empty){

alert("Voucher tidak ditemukan");

return;

}

const data =
voucher.docs[0].data();

diskon =
Math.floor(
subtotal *
(data.diskon / 100)
);

voucherDipakai =
data.kode;

document.getElementById(
"voucherInfo"
).innerText =
"Voucher aktif : " +
data.kode;

updateTotal();

}
);

document
.getElementById("checkoutBtn")
.addEventListener(
"click",
async()=>{

if(!auth.currentUser){

window.location.href =
"login.html";

return;

}

const btn =
document.getElementById(
"checkoutBtn"
);

btn.disabled = true;
btn.innerText = "Memproses...";

try{
if(
!document.getElementById("namaPembeli").value ||
!document.getElementById("whatsappPembeli").value ||
!document.getElementById("alamatPembeli").value
){
alert("Lengkapi data pembeli");
return;
}
await addDoc(
collection(db,"pesanan"),
{

uidPembeli:
auth.currentUser.uid,

namaPembeli:
document.getElementById("namaPembeli").value,

whatsapp:
document.getElementById("whatsappPembeli").value,

alamat:
document.getElementById("alamatPembeli").value,

items:cart,

subtotal:subtotal,

ongkir:ongkir,

diskon:diskon,

voucher:voucherDipakai,

total:
subtotal + ongkir - diskon,

totalBayar:
subtotal + ongkir - diskon,

affiliate:
localStorage.getItem(
"affiliate"
),

status:"menunggu",

createdAt:
new Date()

}
);

localStorage.removeItem("cart");

alert(
"Pesanan berhasil dibuat"
);

window.location.href =
"pesanan-saya.html";

}
catch(error){

console.error(error);

alert(
"Gagal membuat pesanan"
);

}
finally{

btn.disabled = false;
btn.innerText = "Buat Pesanan";

}

}
);

</script></body>
</html>
