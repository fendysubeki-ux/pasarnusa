<!DOCTYPE html><html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><section class="checkout-section"><div class="form-card"><h1>🛒 Checkout Pesanan</h1><input
type="text"
id="namaPembeli"
placeholder="Nama Lengkap">

<input
type="tel"
id="whatsappPembeli"
placeholder="Nomor WhatsApp">

<textarea
id="alamatPembeli"
placeholder="Alamat Lengkap">
</textarea><select id="kotaTujuan"><option value="">
Pilih Kota Tujuan
</option><option value="Tulungagung">
Tulungagung
</option><option value="Blitar">
Blitar
</option><option value="Kediri">
Kediri
</option><option value="Trenggalek">
Trenggalek
</option></select></div><div class="cart-card"><h3>🎟 Voucher</h3><input
type="text"
id="kodeVoucher"
placeholder="Masukkan kode voucher">

<button
id="cekVoucher"
class="btn-secondary">

Gunakan Voucher

</button><p id="voucherInfo">
Belum menggunakan voucher
</p></div><div class="cart-card"><h3>📦 Ringkasan Belanja</h3><p id="subtotalInfo">
Subtotal : Rp 0
</p><p id="ongkirInfo">
Ongkir : Rp 0
</p><p id="diskonInfo">
Diskon : Rp 0
</p><hr><h2 id="totalBayar">
Total : Rp 0
</h2></div><div class="dashboard-card"><h3>💰 Pembagian Pendapatan</h3><p>
UMKM :
<b id="pendapatanUmkm">
Rp 0
</b>
</p><p>
Affiliate :
<b id="komisiAffiliate">
Rp 0
</b>
</p><p>
Platform :
<b id="pendapatanPlatform">
Rp 0
</b>
</p></div><button
id="checkoutBtn"
class="btn-primary">

Buat Pesanan

</button><br><br>

<a
href="cart.html"
class="btn-secondary">

⬅ Kembali ke Keranjang

</a>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

await auth.authStateReady();

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

if(cart.length === 0){

alert("Keranjang kosong");

window.location.href =
"cart.html";

}

let ongkir = 0;
let diskon = 0;
let voucherDipakai = null;

const subtotal =
cart.reduce(
(total,item)=>
total +
(
Number(item.harga || 0) *
Number(item.qty || 1)
),
0
);

function updateTotal(){

const total =
subtotal +
ongkir -
diskon;

document.getElementById(
"subtotalInfo"
).innerText =
"Subtotal : Rp " +
subtotal.toLocaleString("id-ID");

document.getElementById(
"ongkirInfo"
).innerText =
"Ongkir : Rp " +
ongkir.toLocaleString("id-ID");

document.getElementById(
"diskonInfo"
).innerText =
"Diskon : Rp " +
diskon.toLocaleString("id-ID");

document.getElementById(
"totalBayar"
).innerText =
"Total : Rp " +
total.toLocaleString("id-ID");

document.getElementById(
"pendapatanUmkm"
).innerText =
"Rp " +
Math.round(
subtotal * 0.90
).toLocaleString("id-ID");

document.getElementById(
"komisiAffiliate"
).innerText =
"Rp " +
Math.round(
subtotal * 0.05
).toLocaleString("id-ID");

document.getElementById(
"pendapatanPlatform"
).innerText =
"Rp " +
Math.round(
subtotal * 0.05
).toLocaleString("id-ID");

}

updateTotal();

document
.getElementById("kotaTujuan")
.addEventListener(
"change",
(e)=>{

switch(e.target.value){

case "Tulungagung":
ongkir = 5000;
break;

case "Blitar":
ongkir = 10000;
break;

case "Kediri":
ongkir = 12000;
break;

case "Trenggalek":
ongkir = 15000;
break;

default:
ongkir = 0;

}

updateTotal();

}
);

document
.getElementById("cekVoucher")
.addEventListener(
"click",
async()=>{

const kode =
document.getElementById(
"kodeVoucher"
).value.trim();

if(!kode) return;

const voucherSnap =
await getDocs(

query(
collection(db,"voucher"),
where("kode","==",kode),
where("aktif","==",true)
)

);

if(voucherSnap.empty){

alert(
"Voucher tidak ditemukan"
);

return;

}

const voucher =
voucherSnap.docs[0].data();

diskon =
Math.floor(
subtotal *
(Number(voucher.diskon || 0) / 100)
);

voucherDipakai =
voucher.kode;

document.getElementById(
"voucherInfo"
).innerText =
"Voucher aktif : " +
voucher.kode;

updateTotal();

alert(
"Voucher berhasil digunakan"
);

}
);

document
.getElementById("checkoutBtn")
.addEventListener(
"click",
async()=>{

const btn =
document.getElementById(
"checkoutBtn"
);

try{

if(!auth.currentUser){

window.location.href =
"login.html";

return;

}

const nama =
document.getElementById(
"namaPembeli"
).value.trim();

const whatsapp =
document.getElementById(
"whatsappPembeli"
).value.trim();

const alamat =
document.getElementById(
"alamatPembeli"
).value.trim();

const kota =
document.getElementById(
"kotaTujuan"
).value;

if(
!nama ||
!whatsapp ||
!alamat
){

alert(
"Lengkapi data pembeli"
);

return;

}

if(
!/^(08|628)[0-9]{8,13}$/.test(whatsapp)
){

alert(
"Nomor WhatsApp tidak valid"
);

return;

}

if(!kota){

alert(
"Pilih kota tujuan"
);

return;

}

btn.disabled = true;

btn.innerText =
"Membuat Pesanan...";

const total =
Math.max(
0,
subtotal + ongkir - diskon
);

const affiliateUid =
localStorage.getItem("affiliate") || "";
const komisiAffiliate =
affiliateUid
? Math.round(subtotal * 0.05)
: 0;

const pendapatanPlatform =
affiliateUid
? Math.round(subtotal * 0.05)
: Math.round(subtotal * 0.10);
const docRef =
await addDoc(
collection(db,"pesanan"),
{

uidPembeli:
auth.currentUser.uid,

uidUmkm:
cart[0]?.uid || "",

produk:
cart[0]?.namaProduk || "-",

produkId:
cart[0]?.id || "",

namaPembeli:nama,

whatsapp:whatsapp,

alamat:alamat,

kota:kota,

items:cart,

jumlahItem:
cart.reduce(
(total,item)=>
total +
Number(item.qty || 1),
0
),

subtotal:
subtotal,

ongkir:
ongkir,

diskon:
diskon,

voucher:
voucherDipakai,

affiliateUid:
affiliateUid,

pendapatanUmkm:
Math.round(
subtotal * 0.90
),
komisiAffiliate:
komisiAffiliate,

pendapatanPlatform:
pendapatanPlatform,
status:
"Belum Bayar",

statusUmkm:
"Pesanan Baru",

statusPembayaran:
"Belum Bayar",

total:
total,

totalBayar:
total,

createdAt:
serverTimestamp()

}
);

localStorage.removeItem(
"cart"
);

alert(
"Pesanan berhasil dibuat"
);

window.location.href =
"upload-bukti.html?id=" +
docRef.id;

}
catch(error){

console.error(error);

alert(
error.message
);

btn.disabled = false;

btn.innerText =
"Buat Pesanan";

}

}
);

</script></section></body>
</html>
