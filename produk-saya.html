<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produk Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="products">

<h1>Produk Saya</h1>

<div id="produkSaya" class="product-grid">

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain: "pasarnusa-18aa0.firebaseapp.com",
projectId: "pasarnusa-18aa0",
storageBucket: "pasarnusa-18aa0.firebasestorage.app",
messagingSenderId: "866998011671",
appId: "1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const container =
document.getElementById("produkSaya");

const querySnapshot =
await getDocs(collection(db,"produk"));

querySnapshot.forEach((item)=>{

const produk = item.data();

if(produk.uid === auth.currentUser?.uid){

container.innerHTML += `

<div class="product-card">

<h3>${produk.namaProduk}</h3>

<p>
Rp ${Number(produk.harga).toLocaleString("id-ID")}
</p>

<p>${produk.deskripsi}</p>

<a href="edit-produk.html?id=${item.id}"
class="btn-primary">
Edit
</a>

<button
onclick="hapusProduk('${item.id}')"
class="btn-secondary">
Hapus
</button>

</div>

`;

}

});

window.hapusProduk = async(id)=>{

if(confirm("Hapus produk?")){

await deleteDoc(doc(db,"produk",id));

location.reload();

}

};

</script>

</body>
</html>
