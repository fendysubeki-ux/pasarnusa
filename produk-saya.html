<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produk Saya - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="my-products">

<div class="shop-header">

<h1>📦 Produk Saya</h1>

<p>
Kelola seluruh produk UMKM Anda
</p>

<div class="hero-action">

<a
href="tambah-produk.html"
class="btn-primary">

+ Tambah Produk

</a>

<a
href="dashboard-penjual.html"
class="btn-secondary">

Dashboard

</a>

</div>

</div>

<div class="stats-grid">

<div class="stat">
<h2 id="totalProduk">0</h2>
<p>Total Produk</p>
</div>

<div class="stat">
<h2 id="produkAktif">0</h2>
<p>Produk Aktif</p>
</div>

<div class="stat">
<h2 id="totalTerjual">0</h2>
<p>Total Terjual</p>
</div>

<div class="stat">
<h2 id="totalStok">0</h2>
<p>Total Stok</p>
</div>

</div>

<div class="search-box">

<input
type="text"
id="searchProduk"
placeholder="Cari produk...">

</div>

<div id="produkSaya"
class="product-grid">

<p>Memuat produk...</p>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_AUTH_DOMAIN",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_STORAGE_BUCKET",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

}

const container =
document.getElementById(
"produkSaya"
);

let totalProduk = 0;
let totalStok = 0;
let totalTerjual = 0;
let produkAktif = 0;

try{

const snapshot =
await getDocs(

query(
collection(db,"produk"),
where(
"uid",
"==",
auth.currentUser.uid
)
)

);

container.innerHTML = "";

snapshot.forEach((item)=>{

const produk =
item.data();

totalProduk++;

totalStok +=
Number(
produk.stok || 0
);

totalTerjual +=
Number(
produk.terjual || 0
);

if(
produk.status === "Aktif"
){

produkAktif++;

}

container.innerHTML += `

<div
class="product-card searchable">

<img
src="${
produk.gambar?.[0] ||
"https://picsum.photos/400/300"
}">

<div class="product-info">

<span class="category">

${produk.kategori || "Produk"}

</span>

<h3>

${produk.namaProduk}

</h3>

<p class="price">

Rp ${Number(
produk.harga || 0
).toLocaleString("id-ID")}

</p>

<p>
📦 Stok:
${produk.stok || 0}
</p>

<p>
⭐ ${produk.rating || 0}
</p>

<p>
🔥 Terjual:
${produk.terjual || 0}
</p>

<p>

<span class="status-produk">

${produk.status || "Aktif"}

</span>

</p>

<div class="action-buttons">

<a
href="produk-detail.html?id=${item.id}"
class="btn-secondary">

Lihat

</a>

<a
href="edit-produk.html?id=${item.id}"
class="btn-primary">

Edit

</a>

<button
onclick="hapusProduk('${item.id}')"
class="delete-btn">

Hapus

</button>

</div>

</div>

</div>

`;

});

if(totalProduk === 0){

container.innerHTML = `

<div class="dashboard-card">

<h3>
Belum Ada Produk
</h3>

<p>
Tambahkan produk pertama Anda.
</p>

</div>

`;

}

document.getElementById(
"totalProduk"
).innerText =
totalProduk;

document.getElementById(
"produkAktif"
).innerText =
produkAktif;

document.getElementById(
"totalTerjual"
).innerText =
totalTerjual;

document.getElementById(
"totalStok"
).innerText =
totalStok;

}catch(error){

container.innerHTML =

"<p>Gagal memuat produk.</p>";

}

window.hapusProduk =
async(id)=>{

const yakin =
confirm(
"Hapus produk ini?"
);

if(!yakin) return;

await deleteDoc(
doc(db,"produk",id)
);

alert(
"Produk berhasil dihapus"
);

location.reload();

};

document
.getElementById("searchProduk")
.addEventListener(
"input",
(e)=>{

const keyword =
e.target.value
.toLowerCase();

document
.querySelectorAll(
".searchable"
)
.forEach((card)=>{

card.style.display =

card.innerText
.toLowerCase()
.includes(keyword)

? "block"
: "none";

});

});

</script>

</body>
</html>
