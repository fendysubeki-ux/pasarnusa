<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Affiliate - PasarNusa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="affiliate-dashboard">

<h1>Dashboard Affiliate</h1>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3>Total Penjualan</h3>
<h1 id="totalPenjualanFirebase">0</h1>
</div>

<div class="dashboard-card">
<h3>Total Komisi</h3>
<h1 id="totalKomisiFirebase">
Rp 0
</h1>
</div>

<div class="dashboard-card">
<h3>Total Klik</h3>
<h1 id="totalKlikFirebase">0</h1>
</div>

</div>

<div class="affiliate-link-box">

<h2>Link Affiliate Saya</h2>

<input
type="text"
id="affiliateLink">

<button onclick="copyAffiliate()">
Salin Link
</button>

</div>
<div class="affiliate-link-box">

<h2>Statistik Affiliate</h2>

<p>Total Klik Hari Ini: 45</p>

<p>Total Klik Bulan Ini: 1.540</p>

<p>Konversi Penjualan: 5%</p>

</div>
<a href="komisi.html"
class="btn-primary">

Lihat Riwayat Komisi

</a>
</section>

<script src="script.js"></script>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain: "pasarnusa-18aa0.firebaseapp.com",
projectId: "pasarnusa-18aa0",
storageBucket: "pasarnusa-18aa0.firebasestorage.app",
messagingSenderId: "866998011671",
appId: "1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

}

const affiliateId =
auth.currentUser.uid;

const klik =
await getDocs(
collection(db,"affiliate_clicks")
);

let totalKlik = 0;

klik.forEach((item)=>{

const data = item.data();

if(
data.affiliate === affiliateId
){

totalKlik++;

}

});

document.getElementById(
"totalKlikFirebase"
).innerText =
totalKlik;

const pesanan =
await getDocs(
collection(db,"pesanan")
);

let totalKomisi = 0;
let totalPenjualan = 0;

pesanan.forEach((item)=>{

const data = item.data();

if(
data.affiliate === affiliateId
){

totalPenjualan++;

totalKomisi +=
Number(
data.komisiAffiliate || 0
);

}

});

document.getElementById(
"totalKomisiFirebase"
).innerText =
"Rp " +
totalKomisi.toLocaleString("id-ID");

document.getElementById(
"totalPenjualanFirebase"
).innerText =
totalPenjualan;

document.getElementById(
"affiliateLink"
).value =
window.location.origin +
"/index.html?ref=" +
affiliateId;

</script>
</body>
</html>
