<!DOCTYPE html><html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Daftar UMKM - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><meta name="description" content="Daftar UMKM PasarNusa">
<meta name="theme-color" content="#16a34a"></head><body><div class="register-card"><h1>🏪 Daftar UMKM</h1><p style="text-align:center;margin-bottom:20px;">
Daftarkan usaha Anda dan mulai berjualan di PasarNusa.
</p><input
type="text"
id="namaUmkm"
placeholder="Nama UMKM">

<input
type="text"
id="namaPemilik"
placeholder="Nama Pemilik">

<input
type="tel"
id="whatsapp"
placeholder="Nomor WhatsApp">

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password (Minimal 6 Karakter)">

<input
type="text"
id="kategori"
placeholder="Kategori UMKM">

<textarea
id="deskripsi"
placeholder="Deskripsi UMKM">
</textarea><button
id="btnDaftar"
class="btn-primary">

Daftar UMKM

</button><p style="text-align:center;margin-top:20px;">Sudah punya akun?

<a href="login.html">
Login
</a></p><p style="text-align:center;margin-top:10px;"><a href="index.html">
⬅ Kembali ke Beranda
</a></p></div><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth,
createUserWithEmailAndPassword,
signOut
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

async function daftarUMKM(){

const btn =
document.getElementById("btnDaftar");

const namaUmkm =
document.getElementById("namaUmkm")
.value.trim();

const namaPemilik =
document.getElementById("namaPemilik")
.value.trim();

const whatsapp =
document.getElementById("whatsapp")
.value.trim();

const email =
document.getElementById("email")
.value.trim();

const password =
document.getElementById("password")
.value;

const kategori =
document.getElementById("kategori")
.value.trim();

const deskripsi =
document.getElementById("deskripsi")
.value.trim();

if(
!namaUmkm ||
!namaPemilik ||
!whatsapp ||
!email ||
!password ||
!kategori
){

alert(
"Lengkapi semua data terlebih dahulu"
);

return;

}

if(password.length < 6){

alert(
"Password minimal 6 karakter"
);

return;

}

if(
!/^08[0-9]{8,13}$/.test(whatsapp)
){

alert(
"Nomor WhatsApp harus diawali 08"
);

return;

}

try{

btn.disabled = true;

btn.innerText =
"Mendaftarkan...";

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

const uid =
userCredential.user.uid;

await setDoc(
doc(db,"users",uid),
{
uid,
nama:namaUmkm,
namaUmkm,
namaPemilik,
email,
whatsapp,
kategori,
deskripsi,

role:"umkm",

status:"aktif",

createdAt:
serverTimestamp()
}
);

await setDoc(
doc(db,"umkm",uid),
{
uid,

namaUmkm,
namaPemilik,
whatsapp,
kategori,
deskripsi,

status:"aktif",

membership:"free",

membershipExpired:null,

ratingToko:0,

totalReviewToko:0,

isVerified:true,

createdAt:
serverTimestamp()
}
);

alert(
"Pendaftaran UMKM berhasil"
);

await signOut(auth);

window.location.href =
"login.html";

}
catch(error){

console.error(error);

let pesan =
"Pendaftaran gagal";

if(
error.code ===
"auth/email-already-in-use"
){

pesan =
"Email sudah digunakan";

}

if(
error.code ===
"auth/invalid-email"
){

pesan =
"Format email tidak valid";

}

if(
error.code ===
"auth/weak-password"
){

pesan =
"Password terlalu lemah";

}

alert(pesan);

}
finally{

btn.disabled = false;

btn.innerText =
"Daftar UMKM";

}

}

document
.getElementById("btnDaftar")
.addEventListener(
"click",
daftarUMKM
);

document
.addEventListener(
"keypress",
(e)=>{

if(e.key === "Enter"){

daftarUMKM();

}

}
);

</script></body>
</html>
