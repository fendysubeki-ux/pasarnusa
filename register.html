<!DOCTYPE html>
<html>
<head>
<title>Daftar UMKM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="register-card">

<h2>Daftar UMKM</h2>

<input type="text" id="namaUmkm" placeholder="Nama UMKM">

<input type="text" id="namaPemilik" placeholder="Nama Pemilik">

<input type="text" id="whatsapp" placeholder="WhatsApp">
<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">
<input type="text" id="kategori" placeholder="Kategori">

<textarea id="deskripsi" placeholder="Deskripsi"></textarea>

<button id="btnDaftar">Daftar</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
import {
getAuth,
createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain: "pasarnusa-18aa0.firebaseapp.com",
projectId: "pasarnusa-18aa0",
storageBucket: "pasarnusa-18aa0.firebasestorage.app",
messagingSenderId: "866998011671",
appId: "1:866998011671:web:5555115feb82741ab55952",
measurementId: "G-Q861Y1J3RJ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("btnDaftar")
.addEventListener("click", async ()=>{
alert("Tombol berhasil diklik");
const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

await addDoc(collection(db,"umkm"),{

uid: userCredential.user.uid,

namaUmkm:
document.getElementById("namaUmkm").value,

namaPemilik:
document.getElementById("namaPemilik").value,

whatsapp:
document.getElementById("whatsapp").value,

kategori:
document.getElementById("kategori").value,

deskripsi:
document.getElementById("deskripsi").value

});

alert("Akun berhasil dibuat");

}catch(error){

alert(error.message);

}

});

</script>

</body>
</html>
