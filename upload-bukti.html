<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Upload Bukti Pembayaran - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><section class="dashboard"><h1>💳 Upload Bukti Pembayaran</h1><p>
Upload bukti transfer untuk pesanan Anda.
</p><div class="form-card"><div class="dashboard-card"><h3>Informasi Pembayaran</h3><p><b>Bank:</b> BCA</p><p><b>No Rekening:</b> 1234567890</p><p><b>Atas Nama:</b> PT PasarNusa Indonesia</p></div><div class="dashboard-card"><p>
Nomor Pesanan :
<b id="nomorPesanan">-</b>
</p><p>
Total Bayar :
<b id="totalBayar">Rp 0</b>
</p><p>
Status :
<span class="category">
Menunggu Pembayaran
</span>
</p></div><label>Upload Bukti Transfer</label>

<input
type="file"
id="buktiTransfer"
accept="image/*">

<img
id="previewBukti"
style="
display:none;
width:100%;
max-width:400px;
margin-top:15px;
border-radius:12px;
">

<p
id="infoFile"
class="category">Belum ada file dipilih

</p><button
id="uploadBtn"
class="btn-primary">

📤 Upload Bukti

</button><br><br>

<a
href="pesanan-saya.html"
class="btn-secondary">

⬅ Kembali

</a></div></section><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
updateDoc,
addDoc,
collection
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const CLOUD_NAME =
"dq8gha9lv";

const UPLOAD_PRESET =
"pasarnusa";

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);
import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const auth =
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

throw new Error(
"Belum login"
);

}
const params =
new URLSearchParams(
window.location.search
);

const pesananId =
params.get("id");

if(!pesananId){

alert(
"ID Pesanan tidak ditemukan"
);

window.location.href =
"pesanan-saya.html";

throw new Error(
"ID kosong"
);

}

const pesananRef =
doc(
db,
"pesanan",
pesananId
);

const pesananSnap =
await getDoc(
pesananRef
);

if(!pesananSnap.exists()){

alert(
"Pesanan tidak ditemukan"
);

window.location.href =
"pesanan-saya.html";

throw new Error(
"Pesanan tidak ditemukan"
);

}

const pesanan =
pesananSnap.data();
if(
pesanan.status ===
"Menunggu Verifikasi"
){

alert(
"Pesanan sudah mengirim bukti pembayaran"
);

window.location.href =
"pesanan-saya.html";

throw new Error(
"Sudah upload"
);

}
if(

pesanan.uidPembeli !==
auth.currentUser.uid

){

alert(
"Akses ditolak"
);

window.location.href =
"pesanan-saya.html";

throw new Error(
"Bukan pemilik pesanan"
);

}
document.getElementById(
"nomorPesanan"
).innerText =
pesananId.substring(0,8);

document.getElementById(
"totalBayar"
).innerText =
"Rp " +
Number(
pesanan.totalBayar || 0
).toLocaleString("id-ID");

const input =
document.getElementById(
"buktiTransfer"
);

input.addEventListener(
"change",
(e)=>{

const file =
e.target.files[0];
if(
file.size >
2 * 1024 * 1024
){

alert(
"Maksimal ukuran file 2 MB"
);

return;

}
if(!file) return;

document.getElementById(
"infoFile"
).innerText =
file.name;

const preview =
document.getElementById(
"previewBukti"
);

preview.src =
URL.createObjectURL(file);

preview.style.display =
"block";

}
);

document
.getElementById("uploadBtn")
.addEventListener(
"click",
async()=>{

const file =
input.files[0];

if(!file){

alert(
"Pilih bukti transfer"
);

return;

}

const btn =
document.getElementById(
"uploadBtn"
);

btn.disabled = true;

btn.innerText =
"Mengupload...";

try{

const formData =
new FormData();

formData.append(
"file",
file
);

formData.append(
"upload_preset",
UPLOAD_PRESET
);

const response =
await fetch(
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
{
method:"POST",
body:formData
}
);

const result =
await response.json();

if(!result.secure_url){

throw new Error(
"Gagal upload gambar"
);

}

await updateDoc(
pesananRef,
{

buktiTransfer:
result.secure_url,

status:
"Menunggu Verifikasi",

statusPembayaran:
"Menunggu Verifikasi"

}
);

if(pesanan.uidPembeli){

await addDoc(
collection(
db,
"notifikasi"
),
{

uid:
pesanan.uidPembeli,

judul:
"Pembayaran Dikirim",

pesan:
"Bukti transfer berhasil dikirim dan menunggu verifikasi.",

dibaca:false,

createdAt:
new Date()

}
);

}

alert(
"Bukti transfer berhasil dikirim"
);

window.location.href =
"pesanan-saya.html";

}
catch(error){

alert(
error.message
);

}
finally{

btn.disabled = false;

btn.innerText =
"📤 Upload Bukti";

}

}
);

</script></body>
</html>
