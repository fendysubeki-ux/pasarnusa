<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Kecamatan - PasarNusa</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="hero">

<img

id="bannerKecamatan"

src="https://placehold.co/1200x400"

style="
width:100%;
height:260px;
object-fit:cover;
border-radius:20px;
">

</section>

<section class="dashboard">

<h1 id="namaKecamatan">

Memuat...

</h1>

<p id="lokasiKecamatan">

Kabupaten

</p>

</section>

<section class="dashboard">

<div class="dashboard-grid">

<div class="dashboard-card">

<h3 id="jumlahDesa">

0

</h3>

<p>Desa</p>

</div>

<div class="dashboard-card">

<h3 id="jumlahUmkm">

0

</h3>

<p>UMKM</p>

</div>

<div class="dashboard-card">

<h3 id="jumlahProduk">

0

</h3>

<p>Produk</p>

</div>

<div class="dashboard-card">

<h3 id="produkUnggulan">

0

</h3>

<p>Unggulan</p>

</div>

</div>

</section>

<section class="dashboard">

<h2>

📖 Tentang Kecamatan

</h2>

<div class="dashboard-card">

<p id="deskripsiKecamatan">

Memuat informasi...

</p>

</div>

</section>

<section class="dashboard">

<h2>

🏘 Daftar Desa

</h2>

<div

id="desaContainer"

class="dashboard-grid">

<div class="dashboard-card">

Memuat desa...

</div>

</div>

</section>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const params=
new URLSearchParams(
window.location.search
);

const namaKecamatan=
params.get("kecamatan");

const desaContainer=
document.getElementById(
"desaContainer"
);

let semuaDesa=[];

async function loadKecamatan(){

const kecamatanSnap=
await getDocs(
collection(db,"kecamatan")
);

kecamatanSnap.forEach((doc)=>{

const data=
doc.data();

if(
data.nama!==namaKecamatan
){

return;

}

document.getElementById(
"namaKecamatan"
).innerText=
data.nama;

document.getElementById(
"lokasiKecamatan"
).innerText=
`${data.kabupaten}, ${data.provinsi}`;

document.getElementById(
"deskripsiKecamatan"
).innerText=
data.deskripsi||"-";

document.getElementById(
"bannerKecamatan"
).src=
data.banner||
"https://placehold.co/1200x400";

});

await loadDesa();

}
async function loadDesa(){

const desaSnap=
await getDocs(
collection(db,"desa")
);

const produkSnap=
await getDocs(
collection(db,"produk")
);

semuaDesa=[];

let jumlahDesa=0;

let jumlahProduk=0;

let jumlahUnggulan=0;

const umkmSet=
new Set();

desaSnap.forEach((docSnap)=>{

const data=
docSnap.data();

if(
data.kecamatan!==namaKecamatan
){

return;

}

jumlahDesa++;

semuaDesa.push({

id:docSnap.id,

...data

});

});

produkSnap.forEach((docSnap)=>{

const data=
docSnap.data();

if(
data.kecamatan!==namaKecamatan
){

return;

}

jumlahProduk++;

if(data.uidUmkm){

umkmSet.add(
data.uidUmkm
);

}

if(data.unggulan===true){

jumlahUnggulan++;

}

});

document.getElementById(
"jumlahDesa"
).innerText=
jumlahDesa;

document.getElementById(
"jumlahUmkm"
).innerText=
umkmSet.size;

document.getElementById(
"jumlahProduk"
).innerText=
jumlahProduk;

document.getElementById(
"produkUnggulan"
).innerText=
jumlahUnggulan;

renderDesa();

}
function renderDesa(){

desaContainer.innerHTML="";

if(
semuaDesa.length===0
){

desaContainer.innerHTML=`

<div class="dashboard-card">

<h3>

Belum Ada Desa

</h3>

<p>

Belum ada desa yang ditambahkan.

</p>

</div>

`;

return;

}

semuaDesa.forEach((desa)=>{

desaContainer.innerHTML+=`

<div class="dashboard-card">

<img
src="${desa.banner||'https://placehold.co/600x300'}"
style="
width:100%;
height:180px;
object-fit:cover;
border-radius:15px;
">

<h3>

🏘 ${desa.nama}

</h3>

<p>

${desa.deskripsi||"-"}

</p>

<a
href="desa.html?desa=${encodeURIComponent(desa.nama)}"
class="btn-primary">

Lihat Desa

</a>

</div>

`;

});

}

loadKecamatan();

</script>

</body>

</html>
