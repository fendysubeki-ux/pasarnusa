<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Riwayat Produk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

.toolbar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin:20px 0;
}

.toolbar input,
.toolbar select{
flex:1;
min-width:180px;
padding:12px;
border:1px solid #ddd;
border-radius:12px;
font-family:inherit;
}

.empty-state{
text-align:center;
padding:50px 20px;
}

.action-buttons{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

.action-buttons>*{
flex:1;
}

.delete-btn{
background:#ef4444;
color:white;
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
}

</style>

</head>
<body>

<section class="dashboard">

<h1>🕒 Riwayat Produk</h1>

<p>
Produk yang pernah Anda lihat
</p>

<div class="dashboard-grid">

<div class="dashboard-card">

<h3 id="totalProduk">
0
</h3>

<p>Produk Dilihat</p>

</div>

<div class="dashboard-card">

<h3 id="produkTerakhir">
-
</h3>

<p>Terakhir Dilihat</p>

</div>

<div class="dashboard-card">

<h3 id="totalNilai">
Rp 0
</h3>

<p>Total Nilai Produk</p>

</div>

</div>

<div class="toolbar">

<input
type="text"
id="searchInput"
placeholder="Cari produk...">

<select id="kategoriFilter">

<option value="">
Semua Kategori
</option>

</select>

<select id="sortFilter">

<option value="terbaru">
Terbaru
</option>

<option value="terlama">
Terlama
</option>

<option value="hargaTinggi">
Harga Tertinggi
</option>

<option value="hargaRendah">
Harga Terendah
</option>

</select>

<button
id="hapusSemua"
class="btn-secondary">

🗑 Hapus Semua

</button>

</div>

<div
id="riwayatContainer"
class="product-grid">

<p>Memuat data...</p>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const container =
document.getElementById(
"riwayatContainer"
);

let riwayatProduk =
JSON.parse(
localStorage.getItem(
"riwayatProduk"
)
) || [];

let semuaProduk = [];

async function loadData(){

if(riwayatProduk.length === 0){

container.innerHTML = `

<div class="empty-state">

<h2>
Belum Ada Riwayat Produk
</h2>

<p>
Produk yang pernah Anda lihat akan muncul di sini.
</p>

<a
href="index.html"
class="btn-primary">

Jelajahi Produk

</a>

</div>

`;

return;

}

const snapshot =
await getDocs(
collection(db,"produk")
);

const kategoriSet =
new Set();

const produkMap = {};

snapshot.forEach((doc)=>{

const data = doc.data();

produkMap[doc.id] = {
id:doc.id,
...data
};

if(data.kategori){

kategoriSet.add(
data.kategori
);

}

});

document.getElementById(
"kategoriFilter"
).innerHTML +=

[...kategoriSet]
.map(
(kategori)=>`

<option value="${kategori}">
${kategori}
</option>

`
)
.join("");

riwayatProduk.forEach((item)=>{

const id =
typeof item === "object"
? item.id
: item;

if(produkMap[id]){

semuaProduk.push({
...produkMap[id],
tanggal:
item.tanggal ||
Date.now()
});

}

});

updateStatistik();

renderProduk();

}

function updateStatistik(){

document.getElementById(
"totalProduk"
).innerText =
semuaProduk.length;

document.getElementById(
"produkTerakhir"
).innerText =
semuaProduk[0]?.namaProduk ||
"-";

let totalNilai = 0;

semuaProduk.forEach((item)=>{

totalNilai +=
Number(item.harga || 0);

});

document.getElementById(
"totalNilai"
).innerText =
"Rp " +
totalNilai.toLocaleString(
"id-ID"
);

}

function renderProduk(){

let data =
[...semuaProduk];

const keyword =
document.getElementById(
"searchInput"
).value.toLowerCase();

const kategori =
document.getElementById(
"kategoriFilter"
).value;

const sort =
document.getElementById(
"sortFilter"
).value;

if(keyword){

data =
data.filter(
(item)=>
(item.namaProduk || "")
.toLowerCase()
.includes(keyword)
);

}

if(kategori){

data =
data.filter(
(item)=>
item.kategori === kategori
);

}

if(sort === "hargaTinggi"){

data.sort(
(a,b)=>
(b.harga||0)-
(a.harga||0)
);

}

if(sort === "hargaRendah"){

data.sort(
(a,b)=>
(a.harga||0)-
(b.harga||0)
);

}

if(sort === "terbaru"){

data.sort(
(a,b)=>
(b.tanggal||0)-
(a.tanggal||0)
);

}

if(sort === "terlama"){

data.sort(
(a,b)=>
(a.tanggal||0)-
(b.tanggal||0)
);

}

container.innerHTML = "";

if(data.length === 0){

container.innerHTML = `

<div class="dashboard-card">

<h3>
Produk Tidak Ditemukan
</h3>

</div>

`;

return;

}

data.forEach((produk)=>{

container.innerHTML += `

<div class="product-card">

<img
src="${
produk.gambar?.[0] ||
'https://picsum.photos/400/300'
}"
class="product-image">

<div class="product-info">

<span class="category">

${produk.kategori || 'Produk'}

</span>

<h3>

${produk.namaProduk}

</h3>

<p class="price">

Rp ${Number(
produk.harga || 0
).toLocaleString("id-ID")}

</p>

<p>

⭐ ${produk.rating || 0}

</p>

<p>

📦 Stok:
${produk.stok || 0}

</p>

<div class="action-buttons">

<a
href="produk-detail.html?id=${produk.id}"
class="btn-primary">

Detail

</a>

<button
onclick="favoritProduk('${produk.id}')"
class="btn-secondary">

❤️

</button>

<button
onclick="tambahKeranjang('${produk.id}')"
class="btn-secondary">

🛒

</button>

<button
onclick="hapusProduk('${produk.id}')"
class="delete-btn">

🗑

</button>

</div>

</div>

</div>

`;

});

}

window.hapusProduk =
function(id){

riwayatProduk =
riwayatProduk.filter((item)=>{

return (
typeof item === "object"
? item.id !== id
: item !== id
);

});

localStorage.setItem(
"riwayatProduk",
JSON.stringify(riwayatProduk)
);

location.reload();

};

window.favoritProduk =
function(id){

let favorit =
JSON.parse(
localStorage.getItem(
"favorit"
)
) || [];

if(!favorit.includes(id)){

favorit.push(id);

localStorage.setItem(
"favorit",
JSON.stringify(favorit)
);

alert(
"Ditambahkan ke favorit"
);

}

};

window.tambahKeranjang =
function(id){

let keranjang =
JSON.parse(
localStorage.getItem(
"keranjang"
)
) || [];

keranjang.push({
id:id,
qty:1
});

localStorage.setItem(
"keranjang",
JSON.stringify(keranjang)
);

alert(
"Ditambahkan ke keranjang"
);

};

document
.getElementById(
"hapusSemua"
)
.addEventListener(
"click",
()=>{

if(
confirm(
"Hapus semua riwayat?"
)
){

localStorage.removeItem(
"riwayatProduk"
);

location.reload();

}

}
);

document
.getElementById(
"searchInput"
)
.addEventListener(
"input",
renderProduk
);

document
.getElementById(
"kategoriFilter"
)
.addEventListener(
"change",
renderProduk
);

document
.getElementById(
"sortFilter"
)
.addEventListener(
"change",
renderProduk
);

loadData();

</script>

</body>
</html>
