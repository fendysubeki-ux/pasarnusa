<!DOCTYPE html><html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Statistik UMKM - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><section class="dashboard"><div class="dashboard-header"><div>
<h1>📈 Statistik UMKM</h1>
<p>Analisis performa toko Anda</p>
</div><a href="dashboard-umkm.html"
class="btn-secondary">
⬅️ Dashboard
</a>

</div><div class="dashboard-grid"><div class="dashboard-card">
<h3 id="totalProduk">0</h3>
<p>Total Produk</p>
</div><div class="dashboard-card">
<h3 id="totalTerjual">0</h3>
<p>Total Terjual</p>
</div><div class="dashboard-card">
<h3 id="totalPesanan">0</h3>
<p>Total Pesanan</p>
</div><div class="dashboard-card">
<h3 id="pendapatan">Rp 0</h3>
<p>Total Pendapatan</p>
</div><div class="dashboard-card">
<h3 id="ratingToko">0</h3>
<p>⭐ Rating Toko</p>
</div><div class="dashboard-card">
<h3 id="followers">0</h3>
<p>Followers</p>
</div></div><h2>🏆 Produk Terlaris</h2><div
id="produkTerlaris"
class="dashboard-grid"><div class="dashboard-card">
Memuat data...
</div></div><h2>⚠️ Produk Stok Menipis</h2><div
id="stokMenipis"
class="dashboard-grid"><div class="dashboard-card">
Memuat data...
</div></div><h2>📊 Ringkasan Toko</h2><div
id="ringkasan"
class="dashboard-grid"><div class="dashboard-card">
Memuat data...
</div></div></section><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

}

const uid =
auth.currentUser.uid;

try{

const tokoSnap =
await getDoc(
doc(db,"umkm",uid)
);

if(tokoSnap.exists()){

const toko =
tokoSnap.data();

document.getElementById(
"ratingToko"
).innerText =
toko.ratingToko || 0;

document.getElementById(
"followers"
).innerText =
toko.followers || 0;

}

const produkSnapshot =
await getDocs(
query(
collection(db,"produk"),
where("uid","==",uid)
)
);

let totalProduk = 0;
let totalTerjual = 0;

let produkList = [];

let stokHTML = "";

produkSnapshot.forEach((item)=>{

const produk =
item.data();

totalProduk++;

totalTerjual +=
Number(
produk.terjual || 0
);

produkList.push(produk);

if(
Number(produk.stok || 0)
<= 5
){

stokHTML += `

<div class="dashboard-card">

<h3>
${produk.namaProduk}
</h3>

<p>
Stok:
${produk.stok}
</p>

</div>

`;

}

});

document.getElementById(
"totalProduk"
).innerText =
totalProduk;

document.getElementById(
"totalTerjual"
).innerText =
totalTerjual;

const pesananSnapshot =
await getDocs(
collection(db,"pesanan")
);

let totalPesanan = 0;
let pendapatan = 0;

pesananSnapshot.forEach((item)=>{

const pesanan =
item.data();

const adaProdukSaya =
(pesanan.items || [])
.some(
(i)=>i.uid === uid
);

if(!adaProdukSaya)
return;

totalPesanan++;

pendapatan +=
Number(
pesanan.totalBayar || 0
);

});

document.getElementById(
"totalPesanan"
).innerText =
totalPesanan;

document.getElementById(
"pendapatan"
).innerText =
"Rp " +
pendapatan.toLocaleString(
"id-ID"
);

produkList.sort(
(a,b)=>
Number(b.terjual || 0)
-
Number(a.terjual || 0)
);

let terlarisHTML = "";

produkList
.slice(0,5)
.forEach((produk,index)=>{

terlarisHTML += `

<div class="dashboard-card">

<h3>
#${index+1}
</h3>

<p>
${produk.namaProduk}
</p>

<p>
🔥 ${produk.terjual || 0}
</p>

</div>

`;

});

document.getElementById(
"produkTerlaris"
).innerHTML =
terlarisHTML ||
`
<div class="dashboard-card">
Belum ada penjualan
</div>
`;

document.getElementById(
"stokMenipis"
).innerHTML =
stokHTML ||
`
<div class="dashboard-card">
Semua stok aman
</div>
`;

document.getElementById(
"ringkasan"
).innerHTML = `

<div class="dashboard-card">
<h3>📦 Pesanan</h3>
<p>${totalPesanan}</p>
</div>

<div class="dashboard-card">
<h3>🛍 Produk</h3>
<p>${totalProduk}</p>
</div>

<div class="dashboard-card">
<h3>💰 Pendapatan</h3>
<p>
Rp ${pendapatan.toLocaleString("id-ID")}
</p>
</div>

`;

}catch(error){

console.error(error);

alert(
"Gagal memuat statistik"
);

}

</script></body>
</html>
