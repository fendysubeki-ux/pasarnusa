<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Provinsi - PasarNusa</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

<meta name="theme-color"
content="#16a34a">

</head>

<body>

<section class="hero">

<img
id="bannerProvinsi"
src="https://placehold.co/1200x400"
style="
width:100%;
height:260px;
object-fit:cover;
border-radius:20px;
">

</section>

<section class="dashboard">

<h1 id="namaProvinsi">

Memuat...

</h1>

<p>

Indonesia

</p>

</section>

<section class="dashboard">

<div class="dashboard-grid">

<div class="dashboard-card">

<h3 id="jumlahKabupaten">

0

</h3>

<p>Kabupaten/Kota</p>

</div>

<div class="dashboard-card">

<h3 id="jumlahKecamatan">

0

</h3>

<p>Kecamatan</p>

</div>

<div class="dashboard-card">

<h3 id="jumlahDesa">

0

</h3>

<p>Desa</p>

</div>

<div class="dashboard-card">

<h3 id="jumlahProduk">

0

</h3>

<p>Produk</p>

</div>

</div>

</section>

<section class="dashboard">

<h2>

📖 Tentang Provinsi

</h2>

<div class="dashboard-card">

<p id="deskripsiProvinsi">

Memuat informasi...

</p>

</div>

</section>

<section class="dashboard">

<h2>

🏛 Kabupaten / Kota

</h2>

<div
id="kabupatenContainer"
class="dashboard-grid">

<div class="dashboard-card">

Memuat data...

</div>

</div>

</section>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const params=
new URLSearchParams(
window.location.search
);

const namaProvinsi=
params.get("provinsi");

const kabupatenContainer=
document.getElementById(
"kabupatenContainer"
);

let semuaKabupaten=[];

async function loadProvinsi(){

const provinsiSnap=
await getDocs(
collection(db,"provinsi")
);

provinsiSnap.forEach((doc)=>{

const data=
doc.data();

if(
data.nama!==namaProvinsi
){

return;

}

document.getElementById(
"namaProvinsi"
).innerText=
data.nama;

document.getElementById(
"deskripsiProvinsi"
).innerText=
data.deskripsi||"-";

document.getElementById(
"bannerProvinsi"
).src=
data.banner||
"https://placehold.co/1200x400";

});

await loadStatistik();

}
async function loadStatistik(){

const [

kabupatenSnap,
kecamatanSnap,
desaSnap,
produkSnap

]=await Promise.all([

getDocs(collection(db,"kabupaten")),

getDocs(collection(db,"kecamatan")),

getDocs(collection(db,"desa")),

getDocs(collection(db,"produk"))

]);

semuaKabupaten=[];

let jumlahKabupaten=0;

let jumlahKecamatan=0;

let jumlahDesa=0;

let jumlahProduk=0;

kabupatenSnap.forEach((docSnap)=>{

const data=
docSnap.data();

if(
data.provinsi!==namaProvinsi
){

return;

}

jumlahKabupaten++;

semuaKabupaten.push({

id:docSnap.id,

...data

});

});

kecamatanSnap.forEach((docSnap)=>{

const data=
docSnap.data();

if(
data.provinsi===namaProvinsi
){

jumlahKecamatan++;

}

});

desaSnap.forEach((docSnap)=>{

const data=
docSnap.data();

if(
data.provinsi===namaProvinsi
){

jumlahDesa++;

}

});

produkSnap.forEach((docSnap)=>{

const data=
docSnap.data();

if(
data.provinsi===namaProvinsi
){

jumlahProduk++;

}

});

document.getElementById(
"jumlahKabupaten"
).innerText=
jumlahKabupaten;

document.getElementById(
"jumlahKecamatan"
).innerText=
jumlahKecamatan;

document.getElementById(
"jumlahDesa"
).innerText=
jumlahDesa;

document.getElementById(
"jumlahProduk"
).innerText=
jumlahProduk;

renderKabupaten();

}
function renderKabupaten(){

kabupatenContainer.innerHTML="";

if(
semuaKabupaten.length===0
){

kabupatenContainer.innerHTML=`

<div class="dashboard-card">

<h3>

Belum Ada Kabupaten

</h3>

<p>

Belum ada data kabupaten.

</p>

</div>

`;

return;

}

semuaKabupaten.forEach((item)=>{

kabupatenContainer.innerHTML+=`

<div class="dashboard-card">

<img
src="${item.banner||'https://placehold.co/600x300'}"
style="
width:100%;
height:180px;
object-fit:cover;
border-radius:15px;
">

<h3>

🏛 ${item.nama}

</h3>

<p>

${item.deskripsi||"-"}

</p>

<a
href="kabupaten.html?kabupaten=${encodeURIComponent(item.nama)}"
class="btn-primary">

Lihat Kabupaten

</a>

</div>

`;

});

}

loadProvinsi();

</script>

</body>

</html>
