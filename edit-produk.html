<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Produk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="product-form">

<h1>Edit Produk</h1>

<div class="form-card">

<input
type="text"
id="namaProduk"
placeholder="Nama Produk">

<input
type="number"
id="hargaProduk"
placeholder="Harga Produk">

<input
type="number"
id="stokProduk"
placeholder="Stok Produk">

<input
type="text"
id="kategoriProduk"
placeholder="Kategori">

<textarea
id="deskripsiProduk"
placeholder="Deskripsi Produk">
</textarea>
<img
id="previewGambar"
style="
width:100%;
max-width:300px;
border-radius:15px;
margin:auto;
display:block;
box-shadow:0 10px 25px rgba(0,0,0,.1);
">

<input
type="file"
id="gambarProduk"
accept="image/*"
multiple>
<button id="updateProduk">
Update Produk
</button>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain: "pasarnusa-18aa0.firebaseapp.com",
projectId: "pasarnusa-18aa0",
storageBucket: "pasarnusa-18aa0.firebasestorage.app",
messagingSenderId: "866998011671",
appId: "1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage =
getStorage(app);
const params =
new URLSearchParams(window.location.search);

const id = params.get("id");

const snap =
await getDoc(doc(db,"produk",id));

const produk = snap.data();
document
.getElementById("gambarProduk")
.addEventListener("change",(e)=>{

const file =
e.target.files[0];

if(file){

document.getElementById(
"previewGambar"
).src =
URL.createObjectURL(file);

}

});
document.getElementById(
"previewGambar"
).src =
produk.gambar?.[0] ||
produk.gambar ||
"https://picsum.photos/300";
document.getElementById("namaProduk").value =
produk.namaProduk;

document.getElementById("hargaProduk").value =
produk.harga;

document.getElementById("stokProduk").value =
produk.stok;

document.getElementById("kategoriProduk").value =
produk.kategori;

document.getElementById("deskripsiProduk").value =
produk.deskripsi;

document.getElementById("updateProduk")
.addEventListener("click", async()=>{

let imageUrl =
produk.gambar?.[0] ||
produk.gambar ||
"";

const file =
document.getElementById(
"gambarProduk"
).files[0];

if(file){

const storageRef =
ref(
storage,
"produk/" +
Date.now() +
"_" +
file.name
);

await uploadBytes(
storageRef,
file
);

imageUrl =
await getDownloadURL(
storageRef
);

}

await updateDoc(
doc(db,"produk",id),
{

namaProduk:
document.getElementById("namaProduk").value,

harga:
document.getElementById("hargaProduk").value,

stok:
document.getElementById("stokProduk").value,

kategori:
document.getElementById("kategoriProduk").value,

deskripsi:
document.getElementById("deskripsiProduk").value,

gambar:
[imageUrl]

}
);

alert("Produk berhasil diupdate");

window.location.href =
"dashboard-produk.html";

});

</script>

</body>
</html>
