<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil UMKM - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>
<h1 id="namaToko">Memuat Toko...</h1>
<p id="deskripsiToko">Memuat informasi toko...</p>
</div>

<a href="produk.html" class="btn-secondary">
⬅️ Kembali
</a>

</div>

<div style="text-align:center;margin-bottom:25px;">

<img
id="logoToko"
src="https://picsum.photos/200"
alt="Logo Toko"
style="
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
">

</div>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3 id="ratingToko">0</h3>
<p>Rating Toko</p>
</div>

<div class="dashboard-card">
<h3 id="totalProduk">0</h3>
<p>Total Produk</p>
</div>

<div class="dashboard-card">
<h3 id="totalReview">0</h3>
<p>Total Review</p>
</div>

<div class="dashboard-card">
<h3 id="totalTerjual">0</h3>
<p>Total Terjual</p>
</div>

</div>

</section>

<section class="dashboard">

<h2>ℹ️ Informasi UMKM</h2>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3>📍 Alamat</h3>
<p id="alamatToko">-</p>
</div>

<div class="dashboard-card">
<h3>📱 WhatsApp</h3>
<p id="nomorToko">-</p>
</div>

<div class="dashboard-card">
<h3>🏦 Bank</h3>
<p id="namaBank">-</p>
</div>

<div class="dashboard-card">
<h3>💳 Rekening</h3>
<p id="nomorRekening">-</p>
</div>

<div class="dashboard-card">
<h3>👤 Atas Nama</h3>
<p id="atasNama">-</p>
</div>

<div class="dashboard-card">
<h3>📅 Bergabung</h3>
<p id="tanggalGabung">-</p>
</div>

</div>

<div style="margin-top:20px">

<a
id="waToko"
href="#"
target="_blank"
class="btn-primary">

💬 Hubungi UMKM

</a>

</div>

</section>

<section class="products">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
gap:15px;
flex-wrap:wrap;
">

<h2>🛍 Produk UMKM</h2>

<input
type="text"
id="searchProduk"
placeholder="Cari produk..."
class="search-box">

</div>

<div
id="produkContainer"
class="product-grid">

<div class="dashboard-card">

<p>Memuat produk...</p>

</div>

</div>

</section>

<script type="module" src="profil-umkm.js"></script>

</body>
</html>
