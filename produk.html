<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produk UMKM - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="products">

<div style="text-align:center;margin-bottom:30px;">

<h1>🛍️ Produk UMKM Indonesia</h1>

<p>
Temukan berbagai produk UMKM berkualitas dari seluruh Indonesia.
</p>

</div>

<input
type="text"
id="searchInput"
placeholder="🔍 Cari produk..."
class="search-box">

<div class="kategori-filter">

<button onclick="filterProduk('all')" class="btn-primary">
Semua
</button>

<button onclick="filterProduk('makanan')" class="btn-secondary">
Makanan
</button>

<button onclick="filterProduk('minuman')" class="btn-secondary">
Minuman
</button>

<button onclick="filterProduk('fashion')" class="btn-secondary">
Fashion
</button>

<button onclick="filterProduk('kerajinan')" class="btn-secondary">
Kerajinan
</button>

</div>

<div
id="productGrid"
class="product-grid">

<div class="dashboard-card">

<h3>Memuat Produk...</h3>

<p>
Mohon tunggu sebentar
</p>

</div>

</div>

</section>

<script src="script.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"
};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const productGrid =
document.getElementById(
"productGrid"
);

async function loadProduk(){

try{

const snapshot =
await getDocs(
collection(db,"produk")
);

productGrid.innerHTML = "";

let jumlahProduk = 0;

snapshot.forEach((item)=>{

const produk =
item.data();

if(
produk.status !== "Aktif"
){
return;
}

if(
Number(produk.stok || 0) <= 0
){
return;
}

jumlahProduk++;

productGrid.innerHTML += `

<div
class="product-card searchable"
data-category="${
(produk.kategori || "")
.toLowerCase()
}">

<img
src="${
produk.gambar?.[0] ||
"https://picsum.photos/400/300"
}"
alt="${
produk.namaProduk || "Produk"
}">

<div class="product-info">

<span class="category">
${produk.kategori || "UMKM"}
</span>

<h3>
${String(produk.namaProduk || "")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")}
</h3>

${
Number(produk.terjual || 0) >= 10
?
'<span class="category">🔥 Terlaris</span>'
:
''
}

${
Number(produk.stok || 0) <= 5
?
'<span class="category">⚠️ Stok Terbatas</span>'
:
''
}

<p class="price">
Rp ${Number(
produk.harga || 0
).toLocaleString("id-ID")}
</p>

<p>
📦 Stok:
${produk.stok || 0}
</p>

<p>
⭐ ${produk.rating || 0}
</p>

<p>
🔥 Terjual:
${produk.terjual || 0}
</p>

<p>
${
String(
produk.deskripsi || ""
).slice(0,80)
}
...
</p>

<p class="category">
🏪 ${
produk.namaToko ||
produk.namaUmkm ||
"UMKM"
}
</p>

<div
style="
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
">

<a
href="produk-detail.html?id=${item.id}"
class="btn-primary">

Lihat Detail

</a>

<a
href="profil-umkm.html?uid=${produk.uid}"
class="btn-secondary">

Lihat UMKM

</a>

</div>

</div>

</div>

`;

});

if(jumlahProduk === 0){

productGrid.innerHTML = `

<div class="dashboard-card">

<h3>
Belum Ada Produk
</h3>

<p>
Produk UMKM akan tampil di sini.
</p>

</div>

`;

}

}
catch(error){

console.error(error);

productGrid.innerHTML = `

<div class="dashboard-card">

<h3>
Gagal Memuat Produk
</h3>

<p>
${error.message}
</p>

</div>

`;

}

}

loadProduk();

document
.getElementById("searchInput")
.addEventListener(
"input",
(e)=>{

const keyword =
e.target.value
.toLowerCase();

document
.querySelectorAll(".searchable")
.forEach((card)=>{

card.style.display =

card.innerText
.toLowerCase()
.includes(keyword)

? "block"
: "none";

});

});

window.filterProduk =
function(kategori){

document
.querySelectorAll(".searchable")
.forEach((card)=>{

if(
kategori === "all"
){

card.style.display =
"block";

}else{

card.style.display =

card.dataset.category === kategori
? "block"
: "none";

}

});

};

</script>

</body>
</html>
