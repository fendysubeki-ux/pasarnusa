<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Produk - PasarNusa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="product-detail">

<div class="detail-image">

<img id="gambarProduk">

<div id="galleryProduk"
class="gallery-produk">
</div>

</div>

<div class="detail-info">

<span class="category" id="kategoriProduk">
Loading...
</span>

<h1 id="namaProduk">
Loading...
</h1>
<p>

🏪

<a
id="linkToko"
href="#">

Lihat Toko

</a>

</p>
<h2 id="hargaProduk">
Loading...
</h2><p id="stokProduk">
Loading Stok...
</p><p id="ratingInfo">
Loading Rating...
</p>
<p>
🔥 Terjual:
<span id="terjualProduk">0</span>
</p>
<p id="deskripsiProduk">
Loading...
</p>


<div class="cart-card">

<h3>Ulasan Pembeli</h3>
<div id="reviewContainer">

</div>
<input
type="text"
id="namaReviewer"
placeholder="Nama Anda">

<textarea
id="isiReview"
maxlength="500"
placeholder="Tulis ulasan">
</textarea>

<select id="ratingProduk">

<option value="5">
⭐⭐⭐⭐⭐
</option>

<option value="4">
⭐⭐⭐⭐
</option>

<option value="3">
⭐⭐⭐
</option>

<option value="2">
⭐⭐
</option>

<option value="1">
⭐
</option>

</select>

<button
id="kirimReview"
class="btn-primary">

Kirim Ulasan

</button>

</div>

</div>
<div class="action-buttons">

<button
id="btnFavorit"
class="btn-secondary">

❤️ Simpan ke Favorit

</button>
<button
id="shareProduk"
class="btn-secondary">

📤 Bagikan

</button>
<a
id="chatFirebase"
class="btn-secondary">

💬 Chat Penjual

</a>

<a
id="chatWA"
target="_blank"
class="btn-secondary">

📱 WhatsApp

</a>

<button
id="addToCart"
class="btn-primary">

Masukkan Keranjang

</button>
<button
id="buyNow"
class="btn-primary">

⚡ Beli Sekarang

</button>
</div>

<button class="btn-secondary"
onclick="copyAffiliate()">
Salin Link Affiliate
</button>

</div>

</div>

<div class="affiliate-box">

<label>
Link Affiliate:
</label>

<input
type="text"
id="affiliateLink"
readonly>

</div>

</div>

</section>
<section class="products">

<h2>Produk Terkait</h2>

<div
id="produkTerkait"
class="product-grid">
</div>

</section>
<script src="script.js"></script>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
collection,
getDocs,
query,
where,
addDoc,
updateDoc,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
getAuth
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain: "pasarnusa-18aa0.firebaseapp.com",
projectId: "pasarnusa-18aa0",
storageBucket: "pasarnusa-18aa0.firebasestorage.app",
messagingSenderId: "866998011671",
appId: "1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
await auth.authStateReady();
const params =
new URLSearchParams(window.location.search);
const id =
params.get("id");
let riwayatProduk =
JSON.parse(
localStorage.getItem(
"riwayatProduk"
)
) || [];

riwayatProduk =
riwayatProduk.filter(
(item)=>item !== id
);

riwayatProduk.unshift(id);

riwayatProduk =
riwayatProduk.slice(0,30);

localStorage.setItem(
"riwayatProduk",
JSON.stringify(
riwayatProduk
)
);
if(!id){

window.location.href =
"index.html";

return;

}
const refAffiliate =
params.get("ref");
const snap =
await getDoc(doc(db,"produk",id));

if(!snap.exists()){

alert("Produk tidak ditemukan");

window.location.href =
"index.html";

return;
}

const produk = snap.data();
if(!produk.namaProduk){

alert("Data produk rusak");

window.location.href =
"index.html";

return;

}
if(
  refAffiliate &&
  refAffiliate !== produk.uid &&
  !localStorage.getItem("affiliate")
){
  localStorage.setItem(
    "affiliate",
    refAffiliate
  );
}

document.getElementById(
"affiliateLink"
).value =
window.location.origin +
window.location.pathname +
"?id=" +
id +
"&ref=" +
encodeURIComponent(
produk.uid || "affiliate"
);
document.getElementById(
"gambarProduk"
).src =
produk.gambar?.[0] ||
"https://picsum.photos/600/400";
const gallery =
document.getElementById(
"galleryProduk"
);

(produk.gambar || [])
.forEach((img)=>{

gallery.innerHTML += `

<img
src="${img}"
style="
width:80px;
height:80px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
margin:5px;
"

onclick="
document.getElementById('gambarProduk').src='${img}'
">

`;

});
document.getElementById(
"gambarProduk"
).onerror = () => {

document.getElementById(
"gambarProduk"
).src =
"https://picsum.photos/600/400";

};
document.getElementById("namaProduk").innerText =
produk.namaProduk;
document.getElementById(
"linkToko"
).href =
"toko.html?uid=" +
produk.uid;
document.getElementById("hargaProduk").innerText =
"Rp " + Number(produk.harga).toLocaleString("id-ID");
document.getElementById(
"stokProduk"
).innerText =
Number(produk.stok) > 0
? "📦 Stok tersedia: " + produk.stok
: "❌ Stok Habis";
if(
Number(produk.stok) > 0 &&
Number(produk.stok) <= 5
){
document.getElementById(
"stokProduk"
).innerText +=
" 🔥 Hampir Habis";
}
let bolehReview = false;

if(auth.currentUser){

const cekPesanan =
await getDocs(
query(
collection(db,"pesanan"),
where(
"uidPembeli",
"==",
auth.currentUser.uid
)
)
);

cekPesanan.forEach((item)=>{

const data = item.data();

if(
String(data.status).toLowerCase()
=== "selesai"
){

(data.items || []).forEach((produkPesanan)=>{

if(produkPesanan.id === id){

bolehReview = true;

}

});

}

});

}

if(!bolehReview){

document.getElementById(
"kirimReview"
).disabled = true;

document.getElementById(
"kirimReview"
).innerText =
"Belum Bisa Review";

}
if(Number(produk.stok) <= 0){

document.getElementById(
"addToCart"
).disabled = true;

}
document.getElementById("kategoriProduk").innerText =
produk.kategori;

document.getElementById("deskripsiProduk").innerText =
produk.deskripsi;
document.getElementById(
"terjualProduk"
).innerText =
produk.terjual || 0;
document.getElementById(
"chatWA"
).href =
"https://wa.me/" +
produk.whatsapp +
"?text=" +
encodeURIComponent(
"Saya tertarik dengan produk " +
produk.namaProduk
);
document.getElementById(
"chatFirebase"
).href =
"chat.html?room=" +
produk.uid +
"_" +
id;
const reviewData = await getDocs(
query(
collection(db,"review"),
where("produkId","==",id),
orderBy("tanggal","desc")
)
);
document.getElementById(
"ratingInfo"
).innerText =
"⭐ " +
(produk.rating || 0) +
" (" +
(produk.totalReview || 0) +
" ulasan)";

const reviewContainer =
document.getElementById(
"reviewContainer"
);

if(reviewData.empty){

reviewContainer.innerHTML =
"<p>Belum ada ulasan.</p>";

}else{

reviewContainer.innerHTML = "";

}
function escapeHtml(text){

const div =
document.createElement("div");

div.innerText = text;

return div.innerHTML;

}
reviewData.forEach((item)=>{

const review =
item.data();

reviewContainer.innerHTML += `

<div class="cart-card">

<b>${review.nama || "Pembeli"}</b>
<p>
${"⭐".repeat(review.rating)}
</p>

<p>
${escapeHtml(
review.review || ""
)}
</p>

<small>
${review.tanggal ?
new Date(review.tanggal.seconds * 1000)
.toLocaleDateString("id-ID")
: ""}
</small>

</div>

`;

});

document
.getElementById("btnFavorit")
.addEventListener("click",()=>{

let favorit =
JSON.parse(
localStorage.getItem("favorit")
) || [];

if(
!favorit.some(item => item.id === id)
){

favorit.push({
id:id,
namaProduk: produk.namaProduk,
harga: produk.harga,
gambar: produk.gambar?.[0]
});

}

localStorage.setItem(
"favorit",
JSON.stringify(favorit)
);

alert(
"Produk ditambahkan ke favorit"
);

});
document
.getElementById("kirimReview")
.addEventListener("click", async()=>{

if(!auth.currentUser){

alert("Silakan login terlebih dahulu");

return;

}

if(Number(produk.stok) <= 0){

alert("Stok produk habis");

return;

}

if(
document.getElementById("namaReviewer")
.value.trim() === ""
){

alert("Nama tidak boleh kosong");

return;

}

if(
document.getElementById("isiReview")
.value.trim() === ""
){

alert("Ulasan tidak boleh kosong");

return;

}

const cekReview = await getDocs(
query(
collection(db,"review"),
where("produkId","==",id),
where(
"uidPembeli",
"==",
auth.currentUser.uid
)
)
)
);

if(!cekReview.empty){

alert("Anda sudah memberikan ulasan");

return;

}
if(
document.getElementById("isiReview")
.value.length > 500
){

alert(
"Maksimal 500 karakter"
);

return;

}
try{

document.getElementById(
"kirimReview"
).disabled = true;

document.getElementById(
"kirimReview"
).innerText =
"Mengirim...";

await addDoc(
collection(db,"review"),
{
produkId:id,

uidPembeli:
auth.currentUser.uid,

nama:
document.getElementById("namaReviewer")
.value.trim(),

review:
document.getElementById("isiReview")
.value.trim(),

rating:Number(
document.getElementById("ratingProduk").value
),

tanggal:new Date()
}
);

const produkRef =
doc(db,"produk",id);

const totalReview =
Number(produk.totalReview || 0);

const ratingLama =
Number(produk.rating || 0);

const ratingBaru =
Number(
document.getElementById("ratingProduk").value
);

const rataRating =
(
(ratingLama * totalReview)
+
ratingBaru
)
/
(totalReview + 1);

await updateDoc(
produkRef,
{
rating:Number(
rataRating.toFixed(1)
),

totalReview:
totalReview + 1
}
);

alert(
"Review berhasil dikirim"
);

location.reload();

}catch(error){

console.error(error);

alert(
"Gagal mengirim review"
);

}finally{

document.getElementById(
"kirimReview"
).disabled = false;

document.getElementById(
"kirimReview"
).innerText =
"Kirim Ulasan";

}
});
document
.getElementById("addToCart")
.addEventListener("click",()=>{

let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

const existing =
cart.find(item => item.id === id);

if(existing){

if(existing.qty >= produk.stok){

alert("Jumlah melebihi stok");

return;

}

existing.qty =
Math.min(
existing.qty + 1,
produk.stok
);

}else{
if(produk.stok <= 0){

alert("Stok habis");

return;

}
cart.push({
id:id,
uid: produk.uid,
whatsapp: produk.whatsapp,
qty:1,
namaProduk:produk.namaProduk,
harga:produk.harga,
gambar:produk.gambar?.[0],
stok:produk.stok
});

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

alert("Produk masuk keranjang");

window.location.href =
"cart.html";

});
document
.getElementById("buyNow")
.addEventListener("click",()=>{

localStorage.setItem(
"cart",
JSON.stringify([
{
id:id,
uid: produk.uid,
whatsapp: produk.whatsapp,
namaProduk: produk.namaProduk,
harga: produk.harga,
qty:1,
gambar: produk.gambar?.[0]
}
])
);

window.location.href =
"checkout.html";

});
document
.getElementById("shareProduk")
.addEventListener(
"click",
async()=>{

try{

if(navigator.share){

await navigator.share({
title: produk.namaProduk,
url: window.location.href
});

}else{

await navigator.clipboard.writeText(
window.location.href
);

alert("Link disalin");

}

}catch(error){

console.error(error);

}

});
const terkait =
await getDocs(
query(
collection(db,"produk"),
where(
"kategori",
"==",
produk.kategori
)
)
);

const terkaitContainer =
document.getElementById(
"produkTerkait"
);

terkait.forEach((item)=>{

if(item.id === id) return;

const data = item.data();

terkaitContainer.innerHTML += `

<div class="product-card">

<img
src="${
data.gambar?.[0] ||
'https://picsum.photos/400/300'
}">

<div class="product-info">

<h3>
${data.namaProduk}
</h3>

<p class="price">
Rp ${Number(
data.harga || 0
).toLocaleString("id-ID")}
</p>

<a
href="produk-detail.html?id=${item.id}"
class="btn-primary">

Lihat Detail

</a>

</div>

</div>

`;

});
window.copyAffiliate = async function(){

const link =
document.getElementById("affiliateLink");

try{

await navigator.clipboard.writeText(
link.value
);

alert(
"Link affiliate berhasil disalin"
);

}catch{

alert(
"Gagal menyalin link"
);

}
};
</script>
</body>
</html>
