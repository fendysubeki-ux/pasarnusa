<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Produk - PasarNusa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="product-detail">

<div class="detail-image">

<img
id="gambarProduk"
src=""
alt="Produk">
<div id="galleryProduk"
class="gallery-produk">
</div>

</div>

<div class="detail-info">

<span class="category" id="kategoriProduk">
Loading...
</span>

<h1 id="namaProduk">
Loading...
</h1>
<p>

🏪

<a
id="linkToko"
href="#">

Lihat Toko

</a>

</p>
<h2 id="hargaProduk">
Loading...
</h2><p id="stokProduk">
Loading Stok...
</p><p id="ratingInfo">
Loading Rating...
</p>
<p>
🔥 Terjual:
<span id="terjualProduk">0</span>
</p>
<p id="deskripsiProduk">
Loading...
</p>


<div class="cart-card">

<h3>Ulasan Pembeli</h3>
<div id="reviewContainer">

</div>
<input
type="text"
id="namaReviewer"
placeholder="Nama Anda">

<textarea
id="isiReview"
maxlength="500"
placeholder="Tulis ulasan">
</textarea>

<select id="ratingProduk">

<option value="5">
⭐⭐⭐⭐⭐
</option>

<option value="4">
⭐⭐⭐⭐
</option>

<option value="3">
⭐⭐⭐
</option>

<option value="2">
⭐⭐
</option>

<option value="1">
⭐
</option>

</select>

<button
id="kirimReview"
class="btn-primary">

Kirim Ulasan

</button>

</div>

</div>
<div class="action-buttons">

<button
id="btnFavorit"
class="btn-secondary">

❤️ Simpan ke Favorit

</button>
<button
id="shareProduk"
class="btn-secondary">

📤 Bagikan

</button>
<a
href="#"
id="chatFirebase"
class="btn-secondary">
💬 Chat Segera Hadir
</a>

<a
id="chatWA"
target="_blank"
class="btn-secondary">

📱 WhatsApp

</a>

<button
id="addToCart"
class="btn-primary">

Masukkan Keranjang

</button>
<button
id="buyNow"
class="btn-primary">

⚡ Beli Sekarang

</button>
</div>

<button class="btn-secondary"
onclick="copyAffiliate()">
Salin Link Affiliate
</button>

</div>

<div class="affiliate-box">

<label>
Link Affiliate:
</label>

<input
type="text"
id="affiliateLink"
readonly>

</div>

</div>

</section>
<section class="products">

<h2>Produk Terkait</h2>

<div
id="produkTerkait"
class="product-grid">
</div>

</section>
<script src="script.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
collection,
getDocs,
addDoc,
updateDoc,
increment
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

try{

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id");

if(!id){

window.location.href =
"index.html";

throw new Error(
"ID produk tidak ditemukan"
);

}

const snap =
await getDoc(
doc(db,"produk",id)
);

if(!snap.exists()){

throw new Error(
"Produk tidak ditemukan"
);

}

const produk =
snap.data();

document.getElementById(
"namaProduk"
).innerText =
produk.namaProduk || "-";

document.getElementById(
"kategoriProduk"
).innerText =
produk.kategori || "-";

document.getElementById(
"hargaProduk"
).innerText =
"Rp " +
Number(
produk.harga || 0
).toLocaleString("id-ID");

document.getElementById(
"stokProduk"
).innerText =
"📦 Stok: " +
(produk.stok || 0);

document.getElementById(
"terjualProduk"
).innerText =
produk.terjual || 0;

document.getElementById(
"ratingInfo"
).innerText =
"⭐ " +
(produk.rating || 0) +
" (" +
(produk.totalReview || 0) +
" ulasan)";

document.getElementById(
"deskripsiProduk"
).innerText =
produk.deskripsi || "-";

document.getElementById(
"gambarProduk"
).src =
produk.gambar?.[0]
||
"https://picsum.photos/600/400";

const gallery =
document.getElementById(
"galleryProduk"
);

gallery.innerHTML = "";

(produk.gambar || [])
.forEach((img)=>{

gallery.innerHTML += `

<img
src="${img}"
style="
width:80px;
height:80px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
margin:5px;
"
onclick="
document.getElementById('gambarProduk').src='${img}'
">

`;

});

document.getElementById(
"affiliateLink"
).value =

window.location.origin +
window.location.pathname +
"?id=" +
id +
"&ref=" +
(
localStorage.getItem("uid")
|| ""
);

window.copyAffiliate =
function(){

navigator.clipboard.writeText(
document.getElementById(
"affiliateLink"
).value
);

alert(
"Link affiliate disalin"
);

};

document.getElementById(
"shareProduk"
).addEventListener(
"click",
()=>{

navigator.clipboard.writeText(
window.location.href
);

alert(
"Link produk berhasil disalin"
);

}
);

document.getElementById(
"btnFavorit"
).addEventListener(
"click",
()=>{

let favorit =
JSON.parse(
localStorage.getItem(
"favorit"
)
) || [];

if(
!favorit.find(
(item)=>item.id===id
)
){

favorit.push({
id:id,
namaProduk:
produk.namaProduk,
harga:
produk.harga,
gambar:
produk.gambar?.[0]
});

localStorage.setItem(
"favorit",
JSON.stringify(
favorit
)
);

alert(
"Produk ditambahkan ke favorit"
);

}else{

alert(
"Produk sudah ada di favorit"
);

}

}
);

document.getElementById(
"addToCart"
).addEventListener(
"click",
()=>{

let cart =
JSON.parse(
localStorage.getItem(
"cart"
)
) || [];

const existing =
cart.find(
(item)=>item.id===id
);

if(existing){

existing.qty++;

}else{

cart.push({

id:id,

uid:
produk.uid || "",

namaProduk:
produk.namaProduk,

harga:
produk.harga,

gambar:
produk.gambar?.[0],

kategori:
produk.kategori || "",

qty:1

});

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

alert(
"Produk masuk keranjang"
);

}
);

document.getElementById(
"buyNow"
).addEventListener(
"click",
()=>{

localStorage.setItem(
"cart",
JSON.stringify([
{

id:id,

uid:
produk.uid || "",

namaProduk:
produk.namaProduk,

harga:
produk.harga,

gambar:
produk.gambar?.[0],

kategori:
produk.kategori || "",

qty:1

}
])
);

window.location.href =
"checkout.html";

}
);

document.getElementById(
"chatWA"
).href =

"https://wa.me/" +
(
produk.whatsapp || ""
);

document.getElementById(
"linkToko"
).href =
"toko.html?uid=" +
(
produk.uid || ""
);

}catch(error){

console.error(error);

document.body.innerHTML = `

<div class="register-card">

<h2>Error</h2>

<p>
${error.message}
</p>

<a
href="index.html"
class="btn-primary">

Kembali

</a>

</div>

`;

}

</script>

</body>
</html>
