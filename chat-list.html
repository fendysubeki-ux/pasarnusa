<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesan Masuk - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>
<body>

<section class="dashboard">

<h1>💬 Pesan Masuk</h1>

<p>
Seluruh percakapan pembeli dan UMKM.
</p>

<div id="chatRooms" class="dashboard-grid">

<div class="dashboard-card">
Memuat percakapan...
</div>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_AUTH_DOMAIN",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_STORAGE_BUCKET",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

}

const uid =
auth.currentUser.uid;

const container =
document.getElementById(
"chatRooms"
);

const snapshot =
await getDocs(
collection(db,"chat_rooms")
);

container.innerHTML = "";

let totalRoom = 0;

snapshot.forEach((roomDoc)=>{

const room =
roomDoc.data();

if(
!room.members ||
!room.members.includes(uid)
){
return;
}

totalRoom++;

container.innerHTML += `

<div class="dashboard-card">

<h3>
${room.namaToko || "Chat"}
</h3>

<p>
${room.namaProduk || "-"}
</p>

<p>
${room.lastMessage || "Belum ada pesan"}
</p>

<br>

<a
href="chat.html?room=${roomDoc.id}"
class="btn-primary">

Buka Chat

</a>

</div>

`;

});

if(totalRoom === 0){

container.innerHTML = `

<div class="dashboard-card">

<h3>
Belum Ada Percakapan
</h3>

<p>
Chat akan muncul setelah Anda menghubungi penjual.
</p>

</div>

`;

}

</script>

</body>
</html>
