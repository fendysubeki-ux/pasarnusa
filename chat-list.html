<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pesan Masuk - PasarNusa</title><link rel="stylesheet" href="style.css"></head><body><section class="dashboard"><h1>💬 Pesan Masuk</h1><p>
Daftar percakapan pembeli dan UMKM.
</p><div
id="roomContainer"
class="dashboard-grid"><div class="dashboard-card"><h3>Memuat Chat...</h3></div></div></section><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const roomContainer =
document.getElementById(
"roomContainer"
);

roomContainer.innerHTML = "";

const snapshot =
await getDocs(

query(
collection(db,"chat_rooms"),
orderBy("updatedAt","desc")
)

);

if(snapshot.empty){

roomContainer.innerHTML = `

<div class="dashboard-card">

<h3>
📭 Belum Ada Chat
</h3>

<p>
Pesan pembeli akan muncul di sini.
</p>

</div>

`;

}

snapshot.forEach((docSnap)=>{

const data =
docSnap.data();

roomContainer.innerHTML += `

<a
href="chat.html?room=${docSnap.id}"
class="dashboard-card"
style="
text-decoration:none;
color:inherit;
">

<h3>

${data.namaPembeli || "Pembeli"}

</h3>

<p>

${data.lastMessage || "Belum ada pesan"}

</p>

<br>

<small>

${data.namaProduk || "-"}

</small>

</a>

`;

});

</script></body></html>
