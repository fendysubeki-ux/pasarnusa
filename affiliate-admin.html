<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>👥 Affiliate Admin</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><section class="dashboard"><div class="dashboard-header"><div>
<h1>👥 Affiliate Admin</h1>
<p>Kelola seluruh affiliate PasarNusa</p>
</div><a href="admin.html"
class="btn-secondary">
⬅ Dashboard Admin
</a>

</div><div class="dashboard-grid"><div class="dashboard-card">
<h3 id="totalAffiliate">0</h3>
<p>Total Affiliate</p>
</div><div class="dashboard-card">
<h3 id="affiliateAktif">0</h3>
<p>Affiliate Aktif</p>
</div><div class="dashboard-card">
<h3 id="totalKomisi">Rp 0</h3>
<p>Total Komisi</p>
</div><div class="dashboard-card">
<h3 id="totalPencairan">0</h3>
<p>Pengajuan Pencairan</p>
</div><div class="dashboard-card">
<h3 id="menungguPencairan">0</h3>
<p>Menunggu Persetujuan</p>
</div><div class="dashboard-card">
<h3 id="totalDibayar">Rp 0</h3>
<p>Komisi Dibayarkan</p>
</div></div><h2>💰 Pengajuan Pencairan</h2><input
type="text"
id="searchWithdraw"
placeholder="Cari affiliate..."
class="search-box">

<div
id="withdrawContainer"
class="dashboard-grid"><div class="dashboard-card">
<p>Memuat data...</p>
</div></div><h2>👥 Daftar Affiliate</h2><div
id="affiliateContainer"
class="dashboard-grid"><div class="dashboard-card">
<p>Memuat data...</p>
</div></div></section>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc,
addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

location.href = "login.html";
throw new Error("Belum login");

}

const adminDoc =
await getDoc(
doc(db,"users",auth.currentUser.uid)
);

if(
!adminDoc.exists() ||
adminDoc.data().role !== "admin"
){

alert("Akses khusus admin");

location.href = "index.html";

throw new Error("Bukan admin");

}

const affiliateContainer =
document.getElementById(
"affiliateContainer"
);

const withdrawContainer =
document.getElementById(
"withdrawContainer"
);

const searchInput =
document.getElementById(
"searchWithdraw"
);

let withdrawData = [];

async function loadData(){

try{

const affiliateSnap =
await getDocs(
collection(db,"affiliate")
);

const withdrawSnap =
await getDocs(
collection(db,"withdrawAffiliate")
);

affiliateContainer.innerHTML = "";
withdrawContainer.innerHTML = "";

let totalAffiliate = 0;
let affiliateAktif = 0;
let totalKomisi = 0;

affiliateSnap.forEach(docItem=>{

const data = docItem.data();

totalAffiliate++;

if(
data.status === "aktif"
){
affiliateAktif++;
}

totalKomisi +=
Number(data.komisi || 0);

affiliateContainer.innerHTML += `

<div class="dashboard-card">

<h3>${data.nama || "-"}</h3>

<p>${data.email || "-"}</p>

<p>
Klik :
${data.totalKlik || 0}
</p>

<p>
Penjualan :
${data.totalPenjualan || 0}
</p>

<p>
Komisi :
Rp ${Number(
data.komisi || 0
).toLocaleString("id-ID")}
</p>

</div>

`;

});

withdrawData = [];

let totalPencairan = 0;
let menungguPencairan = 0;
let totalDibayar = 0;

withdrawSnap.forEach(docItem=>{

const data = {
id:docItem.id,
...docItem.data()
};

withdrawData.push(data);

totalPencairan++;

if(
data.status === "Menunggu"
){
menungguPencairan++;
}

if(
data.status === "Disetujui"
){

totalDibayar +=
Number(data.jumlah || 0);

}

});

renderWithdraw();

document.getElementById(
"totalAffiliate"
).innerText =
totalAffiliate;

document.getElementById(
"affiliateAktif"
).innerText =
affiliateAktif;

document.getElementById(
"totalKomisi"
).innerText =
"Rp " +
totalKomisi.toLocaleString("id-ID");

document.getElementById(
"totalPencairan"
).innerText =
totalPencairan;

document.getElementById(
"menungguPencairan"
).innerText =
menungguPencairan;

document.getElementById(
"totalDibayar"
).innerText =
"Rp " +
totalDibayar.toLocaleString("id-ID");

}
catch(error){

console.error(error);

alert(
"Gagal memuat data affiliate"
);

}

}

function renderWithdraw(){

const keyword =
searchInput.value
.toLowerCase();

withdrawContainer.innerHTML = "";

const hasil =
withdrawData.filter(item=>

(item.namaAffiliate || "")
.toLowerCase()
.includes(keyword)

);

if(hasil.length === 0){

withdrawContainer.innerHTML = `

<div class="dashboard-card">

<h3>Tidak Ada Data</h3>

</div>

`;

return;

}

hasil.forEach(item=>{

withdrawContainer.innerHTML += `

<div class="dashboard-card">

<h3>
${item.namaAffiliate || "-"}
</h3>

<p>
Bank :
${item.bank || "-"}
</p>

<p>
Rekening :
${item.rekening || "-"}
</p>

<p>
Atas Nama :
${item.atasNama || "-"}
</p>

<p>
Rp ${Number(
item.jumlah || 0
).toLocaleString("id-ID")}
</p>

<p>
Status :
${item.status || "-"}
</p>

${
item.status === "Menunggu"
?
`
<button
onclick="setujui('${item.id}')"
class="btn-primary">

✔ Setujui

</button>

<button
onclick="tolak('${item.id}')"
class="btn-secondary">

✖ Tolak

</button>
`
:
"<p>Sudah diproses</p>"
}

</div>

`;

});

}

window.setujui =
async(id)=>{

const ref =
doc(
db,
"withdrawAffiliate",
id
);

const snap =
await getDoc(ref);

const data =
snap.data();

await updateDoc(ref,{
status:"Disetujui"
});

await addDoc(
collection(db,"notifikasi"),
{
uid:data.uid,
judul:"Pencairan Disetujui",
pesan:"Pengajuan pencairan komisi telah disetujui admin.",
dibaca:false,
createdAt:new Date()
}
);

alert(
"Pencairan disetujui"
);

loadData();

};

window.tolak =
async(id)=>{

const ref =
doc(
db,
"withdrawAffiliate",
id
);

const snap =
await getDoc(ref);

const data =
snap.data();

await updateDoc(ref,{
status:"Ditolak"
});

await addDoc(
collection(db,"notifikasi"),
{
uid:data.uid,
judul:"Pencairan Ditolak",
pesan:"Pengajuan pencairan komisi ditolak admin.",
dibaca:false,
createdAt:new Date()
}
);

alert(
"Pencairan ditolak"
);

loadData();

};

searchInput.addEventListener(
"input",
renderWithdraw
);

loadData();

</script></body>
</html>
