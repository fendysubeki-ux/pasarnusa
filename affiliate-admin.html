<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Affiliate Admin - PasarNusa</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>

<h1>🤝 Kelola Affiliate</h1>

<p>

Kelola seluruh affiliate PasarNusa.

</p>

</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;">

<a
href="dashboard-admin.html"
class="btn-secondary">

⬅ Dashboard

</a>

<button
onclick="location.reload()"
class="btn-primary">

🔄 Refresh

</button>

</div>

</div>

</section>

<section class="dashboard">

<h2>📊 Statistik Affiliate</h2>

<div class="dashboard-grid">

<div class="dashboard-card">

<h3 id="totalAffiliate">0</h3>

<p>Total Affiliate</p>

</div>

<div class="dashboard-card">

<h3 id="affiliateAktif">0</h3>

<p>Affiliate Aktif</p>

</div>

<div class="dashboard-card">

<h3 id="totalKlik">0</h3>

<p>Total Klik</p>

</div>

<div class="dashboard-card">

<h3 id="totalPenjualan">0</h3>

<p>Total Penjualan</p>

</div>

<div class="dashboard-card">

<h3 id="totalKomisi">Rp 0</h3>

<p>Total Komisi</p>

</div>

</div>

</section>

<section class="dashboard">

<div style="display:flex;gap:15px;flex-wrap:wrap;">

<input
id="searchAffiliate"
class="search-box"
type="text"
placeholder="Cari affiliate...">

</div>

</section>

<section class="dashboard">

<div
id="affiliateContainer"
class="dashboard-grid">

<div class="dashboard-card">

Memuat data affiliate...

</div>

</div>

</section>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig={

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href="login.html";

throw new Error("Belum login");

}

const adminSnap=
await getDoc(
doc(
db,
"users",
auth.currentUser.uid
)
);

if(
!adminSnap.exists()||
adminSnap.data().role!=="admin"
){

alert("Akses khusus Admin");

window.location.href="index.html";

throw new Error("Bukan Admin");

}

const container=
document.getElementById(
"affiliateContainer"
);

let semuaAffiliate=[];

async function loadAffiliate(){

container.innerHTML=
"<p>Memuat data...</p>";

const usersSnap=
await getDocs(
collection(db,"users")
);

const komisiSnap=
await getDocs(
collection(db,"affiliate_commissions")
);

semuaAffiliate=[];

let totalAffiliate=0;
let affiliateAktif=0;
let totalKlik=0;
let totalPenjualan=0;
let totalKomisi=0;

usersSnap.forEach((docSnap)=>{

const data=docSnap.data();

if(data.role!=="affiliate") return;

totalAffiliate++;

if(
String(data.status||"aktif")
.toLowerCase()==="aktif"
){

affiliateAktif++;

}

let klik=0;
let penjualan=0;
let komisi=0;

komisiSnap.forEach((komisiDoc)=>{

const item=
komisiDoc.data();

if(
item.affiliateUid===docSnap.id
){

klik+=
Number(item.klik||0);

penjualan+=
Number(item.penjualan||0);

komisi+=
Number(item.komisi||0);

}

});

totalKlik+=klik;

totalPenjualan+=penjualan;

totalKomisi+=komisi;

semuaAffiliate.push({

id:docSnap.id,

...data,

klik,

penjualan,

komisi

});

});

document.getElementById(
"totalAffiliate"
).innerText=
totalAffiliate;

document.getElementById(
"affiliateAktif"
).innerText=
affiliateAktif;

document.getElementById(
"totalKlik"
).innerText=
totalKlik;

document.getElementById(
"totalPenjualan"
).innerText=
totalPenjualan;

document.getElementById(
"totalKomisi"
).innerText=
"Rp "+
totalKomisi.toLocaleString("id-ID");

renderAffiliate();

}
function renderAffiliate(){

const keyword=
document.getElementById(
"searchAffiliate"
).value.toLowerCase();

container.innerHTML="";

const hasil=
semuaAffiliate.filter((affiliate)=>{

const nama=
String(
affiliate.nama||
affiliate.namaLengkap||
""
).toLowerCase();

const wa=
String(
affiliate.whatsapp||
""
).toLowerCase();

return(
nama.includes(keyword)
||
wa.includes(keyword)
);

});

if(hasil.length===0){

container.innerHTML=`

<div class="dashboard-card">

<h3>
Affiliate tidak ditemukan
</h3>

<p>
Tidak ada data yang sesuai.
</p>

</div>

`;

return;

}

hasil.forEach((affiliate)=>{

const status=
String(
affiliate.status||
"aktif"
).toLowerCase();

const warna=
status==="aktif"
?
"#16a34a"
:
"#dc2626";

container.innerHTML+=`

<div class="dashboard-card">

<h3>

👤 ${affiliate.nama||"-"}

</h3>

<p>

📱 ${affiliate.whatsapp||"-"}

</p>

<p>

📧 ${affiliate.email||"-"}

</p>

<hr>

<p>

🖱 Total Klik :
<b>${affiliate.klik}</b>

</p>

<p>

🛒 Penjualan :
<b>${affiliate.penjualan}</b>

</p>

<p>

💰 Komisi :
<b>

Rp ${Number(
affiliate.komisi||0
).toLocaleString("id-ID")}

</b>

</p>

<p>

<span style="
background:${warna};
color:#fff;
padding:5px 10px;
border-radius:8px;
">

${status==="aktif"?"Aktif":"Nonaktif"}

</span>

</p>

<div style="
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
">

<a
href="detail-affiliate-admin.html?id=${affiliate.id}"
class="btn-secondary">

👁 Detail

</a>

<a
href="komisi-admin.html?uid=${affiliate.id}"
class="btn-secondary">

💰 Komisi

</a>

<button
class="btn-primary"
onclick="ubahStatusAffiliate('${affiliate.id}','aktif')">

Aktifkan

</button>

<button
class="btn-secondary"
onclick="ubahStatusAffiliate('${affiliate.id}','nonaktif')">

Nonaktifkan

</button>

</div>

</div>

`;

});

}
window.ubahStatusAffiliate = async(id,status)=>{

try{

await updateDoc(
doc(db,"users",id),
{
status:status
}
);

alert(
"Status affiliate berhasil diperbarui."
);

await loadAffiliate();

}
catch(error){

console.error(error);

alert(error.message);

}

};

document
.getElementById("searchAffiliate")
.addEventListener(
"input",
renderAffiliate
);

loadAffiliate();

</script>

</body>

</html>
