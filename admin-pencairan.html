<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Pencairan Affiliate</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

.dashboard-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:15px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.stat-card{
background:#fff;
padding:25px;
border-radius:18px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.stat-card h2{
margin-top:10px;
font-size:28px;
color:#22c55e;
}

.filter-area{
display:grid;
grid-template-columns:2fr 1fr;
gap:15px;
margin-bottom:25px;
}

.search-box,
.filter-select{
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px;
}

.status-menunggu{
color:#f59e0b;
font-weight:700;
}

.status-disetujui{
color:#22c55e;
font-weight:700;
}

.status-ditolak{
color:#ef4444;
font-weight:700;
}

.nominal{
font-size:22px;
font-weight:700;
color:#22c55e;
}

</style>

</head>
<body>

<section class="dashboard">

<div class="dashboard-header">

<div>
<h1>💰 Admin Pencairan Affiliate</h1>
<p>Kelola seluruh pengajuan pencairan komisi affiliate</p>
</div>

<a href="admin.html" class="btn-secondary">
← Dashboard Admin
</a>

</div>

<div class="stats-grid">

<div class="stat-card">
<p>Total Pengajuan</p>
<h2 id="totalPengajuan">0</h2>
</div>

<div class="stat-card">
<p>Total Nominal</p>
<h2 id="totalNominal">Rp 0</h2>
</div>

<div class="stat-card">
<p>Menunggu</p>
<h2 id="totalMenunggu">0</h2>
</div>

<div class="stat-card">
<p>Disetujui</p>
<h2 id="totalDisetujui">0</h2>
</div>

<div class="stat-card">
<p>Ditolak</p>
<h2 id="totalDitolak">0</h2>
</div>

</div>

<div class="filter-area">

<input
type="text"
id="searchInput"
class="search-box"
placeholder="Cari affiliate, UID, bank...">

<select
id="filterStatus"
class="filter-select">

<option value="all">
Semua Status
</option>

<option value="Menunggu">
Menunggu
</option>

<option value="Disetujui">
Disetujui
</option>

<option value="Ditolak">
Ditolak
</option>

</select>

</div>

<div
id="pencairanContainer"
class="dashboard-grid">

<div class="dashboard-card">

<p>Memuat data...</p>

</div>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
getDoc,
doc,
updateDoc,
addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

throw new Error("Belum Login");

}

const adminSnap =
await getDoc(
doc(
db,
"users",
auth.currentUser.uid
)
);

if(
!adminSnap.exists() ||
adminSnap.data().role !== "admin"
){

alert(
"Akses khusus admin"
);

window.location.href =
"index.html";

throw new Error(
"Bukan Admin"
);

}

const container =
document.getElementById(
"pencairanContainer"
);

let semuaData = [];

const snapshot =
await getDocs(
collection(
db,
"pencairan_komisi"
)
);

snapshot.forEach((item)=>{

semuaData.push({
id:item.id,
...item.data()
});

});

renderData();

function renderData(){

container.innerHTML = "";

const keyword =
document
.getElementById(
"searchInput"
)
.value
.toLowerCase();

const filter =
document
.getElementById(
"filterStatus"
)
.value;

let totalNominal = 0;
let totalMenunggu = 0;
let totalDisetujui = 0;
let totalDitolak = 0;

const hasil =
semuaData.filter((item)=>{

const cocokCari =

(item.namaAffiliate || "")
.toLowerCase()
.includes(keyword)

||

(item.uid || "")
.toLowerCase()
.includes(keyword)

||

(item.bank || "")
.toLowerCase()
.includes(keyword);

const cocokStatus =

filter === "all"
||
item.status === filter;

return cocokCari &&
cocokStatus;

});

hasil.forEach((data)=>{

totalNominal +=
Number(
data.jumlah || 0
);

if(
data.status === "Menunggu"
){
totalMenunggu++;
}

if(
data.status === "Disetujui"
){
totalDisetujui++;
}

if(
data.status === "Ditolak"
){
totalDitolak++;
}

let statusClass =
"status-menunggu";

if(
data.status === "Disetujui"
){
statusClass =
"status-disetujui";
}

if(
data.status === "Ditolak"
){
statusClass =
"status-ditolak";
}

container.innerHTML += `

<div class="dashboard-card">

<h3>
${data.namaAffiliate || "Affiliate"}
</h3>

<p>
UID:
${data.uid}
</p>

<p>
Bank:
${data.bank || "-"}
</p>

<p>
Rekening:
${data.rekening || "-"}
</p>

<p class="nominal">
Rp ${Number(
data.jumlah || 0
).toLocaleString("id-ID")}
</p>

<p>
Status:
<span class="${statusClass}">
${data.status}
</span>
</p>

<p>
${
data.createdAt?.seconds
?
new Date(
data.createdAt.seconds * 1000
).toLocaleString("id-ID")
:
"-"
}
</p>

${
data.status === "Menunggu"
?
`

<button
onclick="setujui('${data.id}')"
class="btn-primary">

✔ Setujui

</button>

<br><br>

<button
onclick="tolak('${data.id}')"
class="btn-secondary">

✖ Tolak

</button>

`
:
`

<p>
Pengajuan sudah diproses
</p>

`
}

</div>

`;

});

document.getElementById(
"totalPengajuan"
).innerText =
semuaData.length;

document.getElementById(
"totalNominal"
).innerText =
"Rp " +
totalNominal.toLocaleString(
"id-ID"
);

document.getElementById(
"totalMenunggu"
).innerText =
totalMenunggu;

document.getElementById(
"totalDisetujui"
).innerText =
totalDisetujui;

document.getElementById(
"totalDitolak"
).innerText =
totalDitolak;

if(
hasil.length === 0
){

container.innerHTML = `

<div class="dashboard-card">

<h3>
Tidak ada data ditemukan
</h3>

</div>

`;

}

}

document
.getElementById(
"searchInput"
)
.addEventListener(
"input",
renderData
);

document
.getElementById(
"filterStatus"
)
.addEventListener(
"change",
renderData
);

window.setujui =
async(id)=>{

if(
!confirm(
"Setujui pencairan ini?"
)
){
return;
}

try{

const pencairanRef =
doc(
db,
"pencairan_komisi",
id
);

const snap =
await getDoc(
pencairanRef
);

const data =
snap.data();

await updateDoc(
pencairanRef,
{
status:"Disetujui",
tanggalPencairan:
new Date()
}
);

await addDoc(
collection(
db,
"notifikasi"
),
{
uid:data.uid,

judul:
"Pencairan Disetujui",

pesan:
"Komisi affiliate Anda telah berhasil dicairkan.",

dibaca:false,

createdAt:
new Date()
}
);

alert(
"Pencairan berhasil disetujui"
);

location.reload();

}catch(error){

console.error(
error
);

alert(
"Gagal menyetujui pencairan"
);

}

};

window.tolak =
async(id)=>{

if(
!confirm(
"Tolak pencairan ini?"
)
){
return;
}

try{

const pencairanRef =
doc(
db,
"pencairan_komisi",
id
);

const snap =
await getDoc(
pencairanRef
);

const data =
snap.data();

await updateDoc(
pencairanRef,
{
status:"Ditolak"
}
);

await addDoc(
collection(
db,
"notifikasi"
),
{
uid:data.uid,

judul:
"Pencairan Ditolak",

pesan:
"Pengajuan pencairan komisi Anda ditolak admin.",

dibaca:false,

createdAt:
new Date()
}
);

alert(
"Pencairan berhasil ditolak"
);

location.reload();

}catch(error){

console.error(
error
);

alert(
"Gagal menolak pencairan"
);

}

};

renderData();

</script>

</body>
</html>
