<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Kelola Provinsi</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>

<h1>

🌎 Kelola Provinsi

</h1>

<p>

Kelola seluruh provinsi di PasarNusa

</p>

</div>

<div style="
display:flex;
gap:10px;
flex-wrap:wrap;
">

<a
href="dashboard-admin.html"
class="btn-secondary">

⬅ Dashboard

</a>

<button
onclick="location.reload()"
class="btn-primary">

🔄 Refresh

</button>

</div>

</div>

</section>

<section class="dashboard">

<div class="dashboard-grid">

<div class="dashboard-card">

<h3 id="totalProvinsi">

0

</h3>

<p>Total Provinsi</p>

</div>

<div class="dashboard-card">

<h3 id="totalKabupaten">

0

</h3>

<p>Total Kabupaten</p>

</div>

<div class="dashboard-card">

<h3 id="totalProduk">

0

</h3>

<p>Total Produk</p>

</div>

</div>

</section>

<section class="dashboard">

<input
id="searchProvinsi"
class="search-box"
placeholder="Cari provinsi...">

<br><br>

<button
onclick="bukaTambahProvinsi()"
class="btn-primary">

➕ Tambah Provinsi

</button>

</section>

<section class="dashboard">

<div
id="provinsiContainer"
class="dashboard-grid">

<div class="dashboard-card">

Memuat data provinsi...

</div>

</div>

</section>

<div
id="provinsiModal"
class="modal"
style="display:none;">

<div class="modal-content">

<h2 id="modalTitle">

Tambah Provinsi

</h2>

<input
id="namaProvinsiInput"
class="search-box"
placeholder="Nama Provinsi">

<input
id="bannerInput"
class="search-box"
placeholder="URL Banner">

<input
id="mapsInput"
class="search-box"
placeholder="Google Maps">

<textarea
id="deskripsiInput"
class="search-box"
placeholder="Deskripsi Provinsi"
style="height:120px;"></textarea>

<div style="
display:flex;
gap:10px;
margin-top:20px;
">

<button
id="simpanProvinsiBtn"
class="btn-primary">

💾 Simpan

</button>

<button
onclick="tutupModal()"
class="btn-secondary">

Batal

</button>

</div>

</div>

</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
doc,
getDoc,
deleteDoc,
addDoc,
updateDoc

}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig={

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href="login.html";

throw new Error("Belum login");

}

const adminSnap=
await getDoc(
doc(
db,
"users",
auth.currentUser.uid
)
);

if(
!adminSnap.exists()||
adminSnap.data().role!=="admin"
){

alert("Akses khusus Admin");

window.location.href="index.html";

throw new Error("Bukan Admin");

}

const container=
document.getElementById(
"provinsiContainer"
);

let semuaProvinsi=[];

let editId=null;

async function loadProvinsi(){

container.innerHTML=
"<p>Memuat data...</p>";

const [

provinsiSnap,
kabupatenSnap,
produkSnap

]=await Promise.all([

getDocs(collection(db,"provinsi")),

getDocs(collection(db,"kabupaten")),

getDocs(collection(db,"produk"))

]);

semuaProvinsi=[];

let totalProvinsi=0;

let totalKabupaten=0;

let totalProduk=0;

provinsiSnap.forEach((docSnap)=>{

const data=
docSnap.data();

let jumlahKabupaten=0;

let jumlahProduk=0;

kabupatenSnap.forEach((kabupaten)=>{

const k=
kabupaten.data();

if(
k.provinsi===data.nama
){

jumlahKabupaten++;

}

});

produkSnap.forEach((produk)=>{

const p=
produk.data();

if(
p.provinsi===data.nama
){

jumlahProduk++;

}

});

totalProvinsi++;

totalKabupaten+=jumlahKabupaten;

totalProduk+=jumlahProduk;

semuaProvinsi.push({

id:docSnap.id,

...data,

jumlahKabupaten,

jumlahProduk

});

});

document.getElementById(
"totalProvinsi"
).innerText=
totalProvinsi;

document.getElementById(
"totalKabupaten"
).innerText=
totalKabupaten;

document.getElementById(
"totalProduk"
).innerText=
totalProduk;

renderProvinsi();

}
function renderProvinsi(){

const keyword=
document.getElementById(
"searchProvinsi"
).value.toLowerCase();

container.innerHTML="";

const hasil=
semuaProvinsi.filter((item)=>{

return(

(item.nama||"")
.toLowerCase()
.includes(keyword)

);

});

if(hasil.length===0){

container.innerHTML=`

<div class="dashboard-card">

<h3>

Provinsi Tidak Ditemukan

</h3>

<p>

Tidak ada data yang sesuai.

</p>

</div>

`;

return;

}

hasil.forEach((item)=>{

container.innerHTML+=`

<div class="dashboard-card">

<img
src="${item.banner||'https://placehold.co/600x300'}"
style="
width:100%;
height:180px;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;
">

<h3>

🌎 ${item.nama}

</h3>

<p>

🏛 ${item.jumlahKabupaten} Kabupaten/Kota

</p>

<p>

🛍 ${item.jumlahProduk} Produk

</p>

<p>

${(item.deskripsi||"-")
.substring(0,100)}...

</p>

<div style="
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
">

<a
href="provinsi.html?provinsi=${encodeURIComponent(item.nama)}"
class="btn-primary">

👁 Lihat

</a>

<button
class="btn-secondary"
onclick="editProvinsi('${item.id}')">

✏ Edit

</button>

<button
class="btn-secondary"
onclick="hapusProvinsi('${item.id}')">

🗑 Hapus

</button>

</div>

</div>

`;

});

}
window.hapusProvinsi=async(id)=>{

if(
!confirm(
"Yakin ingin menghapus provinsi ini?"
)
){

return;

}

try{

await deleteDoc(
doc(db,"provinsi",id)
);

alert(
"Provinsi berhasil dihapus."
);

loadProvinsi();

}
catch(error){

console.error(error);

alert(error.message);

}

};

document
.getElementById("searchProvinsi")
.addEventListener(
"input",
renderProvinsi
);

loadProvinsi();
window.bukaTambahProvinsi=()=>{

editId=null;

document.getElementById("modalTitle").innerText=
"Tambah Provinsi";

document.getElementById("namaProvinsiInput").value="";

document.getElementById("bannerInput").value="";

document.getElementById("mapsInput").value="";

document.getElementById("deskripsiInput").value="";

document.getElementById("provinsiModal").style.display=
"flex";

};

window.tutupModal=()=>{

document.getElementById("provinsiModal").style.display=
"none";

};

window.editProvinsi=(id)=>{

const data=
semuaProvinsi.find(
item=>item.id===id
);

if(!data)return;

editId=id;

document.getElementById("modalTitle").innerText=
"Edit Provinsi";

document.getElementById("namaProvinsiInput").value=
data.nama||"";

document.getElementById("bannerInput").value=
data.banner||"";

document.getElementById("mapsInput").value=
data.maps||"";

document.getElementById("deskripsiInput").value=
data.deskripsi||"";

document.getElementById("provinsiModal").style.display=
"flex";

};

document
.getElementById("simpanProvinsiBtn")
.addEventListener(
"click",
async()=>{

const data={

nama:
document.getElementById("namaProvinsiInput").value,

banner:
document.getElementById("bannerInput").value,

maps:
document.getElementById("mapsInput").value,

deskripsi:
document.getElementById("deskripsiInput").value

};

try{

if(editId){

await updateDoc(
doc(db,"provinsi",editId),
data
);

}else{

await addDoc(
collection(db,"provinsi"),
data
);

}

alert(
"Data provinsi berhasil disimpan."
);

tutupModal();

loadProvinsi();

}
catch(error){

console.error(error);

alert(error.message);

}

});
</script>
</body>
</html>
