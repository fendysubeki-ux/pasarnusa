<!DOCTYPE html><html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pesanan Masuk - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><section class="dashboard"><div class="dashboard-header"><div><h1>📦 Pesanan Masuk</h1><p>
Kelola seluruh pesanan pelanggan.
</p></div><a href="dashboard.html" class="btn-secondary">
Kembali
</a></div><div class="dashboard-grid"><div class="dashboard-card">
<h3 id="totalPesanan">0</h3>
<p>Total Pesanan</p>
</div><div class="dashboard-card">
<h3 id="menungguVerifikasi">0</h3>
<p>Menunggu Verifikasi</p>
</div><div class="dashboard-card">
<h3 id="diproses">0</h3>
<p>Diproses</p>
</div><div class="dashboard-card">
<h3 id="dikirim">0</h3>
<p>Dikirim</p>
</div></div><input
type="text"
id="searchPesanan"
class="search-box"
placeholder="Cari nama pembeli...">

<select
id="filterStatus"
class="search-box">

<option value="all">
Semua Status
</option><option value="Menunggu Verifikasi">
Menunggu Verifikasi
</option><option value="Diproses">
Diproses
</option><option value="Dikirim">
Dikirim
</option><option value="Selesai">
Selesai
</option><option value="Ditolak">
Ditolak
</option></select><div
id="pesananContainer"
class="dashboard-grid"><div class="dashboard-card">
<p>Memuat data...</p>
</div></div></section><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where,
updateDoc,
doc,
addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_PROJECT.appspot.com",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

const container =
document.getElementById(
"pesananContainer"
);

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

const snapshot =
await getDocs(
query(
collection(db,"pesanan"),
where(
"uid",
"==",
user.uid
)
)
);

container.innerHTML = "";

let total = 0;
let verifikasi = 0;
let proses = 0;
let kirim = 0;

snapshot.forEach((item)=>{

const data = item.data();

total++;

if(data.status === "Menunggu Verifikasi")
verifikasi++;

if(data.status === "Diproses")
proses++;

if(data.status === "Dikirim")
kirim++;

let daftarProduk = "";

(data.items || []).forEach((produk)=>{

daftarProduk += `
<li>
${produk.namaProduk}
x ${produk.qty}
</li>
`;

});

container.innerHTML += `

<div class="dashboard-card pesanan-item">

<h3>
${data.namaPembeli || "-"}
</h3>

<p>
📱 ${data.whatsapp || "-"}
</p>

<p>
📍 ${data.alamat || "-"}
</p>

<hr>

<ul>
${daftarProduk}
</ul>

<p>
💰 Rp ${Number(
data.totalBayar || 0
).toLocaleString("id-ID")}
</p>

<p>
📦 Status:
<b>
${data.status || "-"}
</b>
</p>

${
data.buktiTransfer
?
`
<a
href="${data.buktiTransfer}"
target="_blank"
class="btn-secondary">

Lihat Bukti Transfer

</a>
`
:
`
<p>
Belum Upload Bukti
</p>
`
}

<br><br>

<input
type="text"
id="resi-${item.id}"
placeholder="Nomor Resi">

<br><br>

<select
id="status-${item.id}">

<option value="Diproses">
Diproses
</option>

<option value="Dikirim">
Dikirim
</option>

<option value="Selesai">
Selesai
</option>

<option value="Ditolak">
Ditolak
</option>

</select>

<br><br>

<button
onclick="updateStatus('${item.id}','${data.uidPembeli}')"
class="btn-primary">

Update Status

</button>

</div>

`;

});

document.getElementById(
"totalPesanan"
).innerText =
total;

document.getElementById(
"menungguVerifikasi"
).innerText =
verifikasi;

document.getElementById(
"diproses"
).innerText =
proses;

document.getElementById(
"dikirim"
).innerText =
kirim;

});

window.updateStatus =
async(id,pembeli)=>{

const status =
document.getElementById(
"status-" + id
).value;

const resi =
document.getElementById(
"resi-" + id
).value;

await updateDoc(
doc(db,"pesanan",id),
{
status:status,
resi:resi
}
);

await addDoc(
collection(db,"notifikasi"),
{
uid:pembeli,
judul:"Update Pesanan",
pesan:"Status pesanan berubah menjadi " + status,
dibaca:false,
createdAt:new Date()
}
);

alert(
"Status berhasil diperbarui"
);

location.reload();

};

document
.getElementById(
"searchPesanan"
)
.addEventListener(
"input",
(e)=>{

const keyword =
e.target.value.toLowerCase();

document
.querySelectorAll(
".pesanan-item"
)
.forEach((item)=>{

item.style.display =
item.innerText
.toLowerCase()
.includes(keyword)
?
"block"
:
"none";

});

}
);

</script></body>
</html>
