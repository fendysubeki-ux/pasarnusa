<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesanan Masuk - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>
<h1>📦 Pesanan Masuk</h1>
<p>Kelola seluruh pesanan pelanggan.</p>
</div>

<a href="dashboard-umkm.html" class="btn-secondary">
⬅ Dashboard
</a>

</div>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3 id="totalPesanan">0</h3>
<p>Total Pesanan</p>
</div>

<div class="dashboard-card">
<h3 id="menungguVerifikasi">0</h3>
<p>Menunggu Verifikasi</p>
</div>

<div class="dashboard-card">
<h3 id="diproses">0</h3>
<p>Diproses</p>
</div>

<div class="dashboard-card">
<h3 id="dikirim">0</h3>
<p>Dikirim</p>
</div>

<div class="dashboard-card">
<h3 id="selesai">0</h3>
<p>Selesai</p>
</div>

</div>

<br>

<input
type="text"
id="searchPesanan"
class="search-box"
placeholder="Cari nama pembeli...">

<br><br>

<select
id="filterStatus"
class="search-box">

<option value="all">Semua Status</option>
<option value="Menunggu Verifikasi">Menunggu Verifikasi</option>
<option value="Diproses">Diproses</option>
<option value="Dikirim">Dikirim</option>
<option value="Selesai">Selesai</option>
<option value="Ditolak">Ditolak</option>

</select>

<br><br>

<div
id="pesananContainer"
class="dashboard-grid">

<div class="dashboard-card">
<p>Memuat pesanan...</p>
</div>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
updateDoc,
addDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href = "login.html";

}

const uid = auth.currentUser.uid;

const container =
document.getElementById("pesananContainer");

let semuaPesanan = [];

loadPesanan();

async function loadPesanan(){

const snapshot =
await getDocs(

query(
collection(db,"pesanan"),
where("uidUmkm","==",uid)
)

);

semuaPesanan = [];

snapshot.forEach((docSnap)=>{

semuaPesanan.push({
id:docSnap.id,
...docSnap.data()
});

});

renderPesanan(semuaPesanan);
updateStatistik();

}

function updateStatistik(){

document.getElementById("totalPesanan").innerText =
semuaPesanan.length;

document.getElementById("menungguVerifikasi").innerText =
semuaPesanan.filter(
item=>item.status==="Menunggu Verifikasi"
).length;

document.getElementById("diproses").innerText =
semuaPesanan.filter(
item=>item.status==="Diproses"
).length;

document.getElementById("dikirim").innerText =
semuaPesanan.filter(
item=>item.status==="Dikirim"
).length;

document.getElementById("selesai").innerText =
semuaPesanan.filter(
item=>item.status==="Selesai"
).length;

}

function renderPesanan(data){

container.innerHTML = "";

if(data.length===0){

container.innerHTML=`
<div class="dashboard-card">
<h3>Belum Ada Pesanan</h3>
<p>Pesanan akan muncul di sini.</p>
</div>
`;

return;

}

data.forEach((pesanan)=>{

let daftarProduk = "";

(pesanan.items || []).forEach((item)=>{

daftarProduk += `
<li>
${item.namaProduk} x ${item.qty}
</li>
`;

});

container.innerHTML += `

<div class="dashboard-card pesanan-item">

<h3>${pesanan.namaPembeli || "-"}</h3>

<p>📱 ${pesanan.whatsapp || "-"}</p>

<p>📍 ${pesanan.alamat || "-"}</p>

<hr>

<ul>
${daftarProduk}
</ul>

<hr>

<p>
💰 Rp ${Number(
pesanan.totalBayar || 0
).toLocaleString("id-ID")}
</p>

<p>
📦 Status :
<b>${pesanan.status || "-"}
</b>
</p>

${
pesanan.buktiTransfer
?
`
<a
href="${pesanan.buktiTransfer}"
target="_blank"
class="btn-secondary">

Lihat Bukti Transfer

</a>
`
:
`<p>Belum Upload Bukti</p>`
}

<br><br>

<input
type="text"
id="resi-${pesanan.id}"
placeholder="Nomor Resi">

<br><br>

<select id="status-${pesanan.id}">
<option value="Diproses">Diproses</option>
<option value="Dikirim">Dikirim</option>
<option value="Selesai">Selesai</option>
<option value="Ditolak">Ditolak</option>
</select>

<br><br>

<button
onclick="updateStatus('${pesanan.id}','${pesanan.uidPembeli}')"
class="btn-primary">

Update Status

</button>

</div>

`;

});

}

window.updateStatus =
async(id,pembeli)=>{

const status =
document.getElementById(
"status-"+id
).value;

const resi =
document.getElementById(
"resi-"+id
).value;

if(
status==="Dikirim" &&
!resi.trim()
){

alert("Nomor resi wajib diisi");
return;

}

await updateDoc(
doc(db,"pesanan",id),
{
status,
resi
}
);

await addDoc(
collection(db,"notifikasi"),
{
uid:pembeli,
judul:"Status Pesanan",
pesan:"Status pesanan berubah menjadi " + status,
dibaca:false,
createdAt:new Date()
}
);

alert("Status berhasil diperbarui");

location.reload();

};

document
.getElementById("searchPesanan")
.addEventListener("input",(e)=>{

const keyword =
e.target.value.toLowerCase();

renderPesanan(

semuaPesanan.filter(item=>

(item.namaPembeli || "")
.toLowerCase()
.includes(keyword)

)

);

});

document
.getElementById("filterStatus")
.addEventListener("change",(e)=>{

const status = e.target.value;

if(status==="all"){

renderPesanan(semuaPesanan);

return;

}

renderPesanan(

semuaPesanan.filter(
item=>item.status===status
)

);

});

</script>

</body>
</html>
