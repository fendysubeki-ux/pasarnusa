<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head><body><div class="register-card"><h1>🔐 Login PasarNusa</h1><input type="email" id="email" placeholder="Email"><input type="password" id="password" placeholder="Password"><button id="btnLogin" class="btn-primary">
Masuk
</button><p style="text-align:center;margin-top:20px;"><a href="register-user.html">
Daftar Pembeli
</a>|

<a href="register.html">
Daftar UMKM
</a>|

<a href="register-affiliate.html">
Daftar Affiliate
</a></p></div><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

try{

const credential =
await signInWithEmailAndPassword(
auth,
email,
password
);

const uid =
credential.user.uid;

const userDoc =
await getDoc(doc(db,"users",uid));

if(!userDoc.exists()){

alert("Data user tidak ditemukan");
await signOut(auth);
return;

}

const user =
userDoc.data();

if(
user.role === "umkm" &&
user.status !== "aktif"
){

alert("Akun UMKM belum diverifikasi");
await signOut(auth);
return;

}

localStorage.setItem("uid",uid);
localStorage.setItem("role",user.role || "user");
localStorage.setItem("nama",user.nama || "");

if(user.role === "admin"){

window.location.replace(
"admin.html"
);

}
else if(user.role === "affiliate"){

window.location.replace(
"dashboard-affiliate.html"
);

}
else if(user.role === "umkm"){

window.location.replace(
"dashboard.html"
);

}
else{

window.location.replace(
"dashboard-user.html"
);

}

}
catch(error){

console.error(error);

alert(
"Login gagal\n\n" +
error.message
);

}

}

document
.getElementById("btnLogin")
.addEventListener(
"click",
login
);

</script></body>
</html>
