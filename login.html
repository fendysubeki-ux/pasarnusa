<!DOCTYPE html><html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><section class="auth-section"><div class="register-card"><h1>🔐 Login PasarNusa</h1><p style="text-align:center;margin-bottom:25px;">
Masuk untuk mengakses akun Anda
</p><input
type="email"
id="email"
placeholder="Email"
autocomplete="email">

<div style="position:relative;"><input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password">

<button
type="button"
id="togglePassword"
style="
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:none;
background:none;
cursor:pointer;
">

👁️

</button></div><button
id="btnLogin"
class="btn-primary">

Masuk

</button><div style="
text-align:center;
margin-top:20px;
"><a href="register.html">
Daftar UMKM
</a>|

<a href="register-affiliate.html">
Daftar Affiliate
</a>|

<a href="reset-password.html">
Lupa Password
</a></div></div></section><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_PROJECT.appspot.com",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

document
.getElementById("togglePassword")
.addEventListener("click",()=>{

const password =
document.getElementById("password");

password.type =
password.type === "password"
? "text"
: "password";

});

async function login(){

const email =
document.getElementById("email")
.value.trim();

const password =
document.getElementById("password")
.value;

const btn =
document.getElementById("btnLogin");

try{

if(!email || !password){

alert(
"Email dan password wajib diisi"
);

return;

}

btn.disabled = true;

btn.innerText =
"Memproses...";

const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);

if(
!userCredential.user.emailVerified
){

await signOut(auth);

alert(
"Silakan verifikasi email terlebih dahulu"
);

return;

}

const userDoc =
await getDoc(
doc(
db,
"users",
userCredential.user.uid
)
);

if(!userDoc.exists()){

alert(
"Data akun tidak ditemukan"
);

return;

}

const user =
userDoc.data();

localStorage.setItem(
"uid",
userCredential.user.uid
);

localStorage.setItem(
"role",
user.role || "user"
);

localStorage.setItem(
"nama",
user.nama || ""
);

alert(
"Login berhasil"
);

if(user.role === "admin"){

window.location.href =
"admin.html";

}
else if(user.role === "affiliate"){

window.location.href =
"dashboard-affiliate.html";

}
else if(user.role === "umkm"){

window.location.href =
"dashboard.html";

}
else{

window.location.href =
"index.html";

}

}
catch(error){

if(
error.code ===
"auth/invalid-credential"
){

alert(
"Email atau password salah"
);

}
else if(
error.code ===
"auth/too-many-requests"
){

alert(
"Terlalu banyak percobaan login"
);

}
else{

alert(
"Terjadi kesalahan saat login"
);

}

}
finally{

btn.disabled = false;

btn.innerText =
"Masuk";

}

}

document
.getElementById("btnLogin")
.addEventListener(
"click",
login
);

document
.addEventListener(
"keydown",
(e)=>{

if(e.key === "Enter"){

login();

}

}
);

</script></body>
</html>
