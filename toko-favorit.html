<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Toko Favorit - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

.favorite-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
flex-wrap:wrap;
margin-bottom:25px;
}

.favorite-search{
width:100%;
padding:14px;
border:1px solid #e5e7eb;
border-radius:14px;
font-size:15px;
margin-bottom:20px;
}

.store-card{
background:#fff;
border-radius:20px;
padding:20px;
box-shadow:0 5px 20px rgba(0,0,0,.06);
text-align:center;
}

.store-logo{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
margin:auto;
display:block;
margin-bottom:15px;
}

.store-actions{
display:flex;
gap:10px;
margin-top:15px;
}

.store-actions a,
.store-actions button{
flex:1;
}

.empty-state{
text-align:center;
padding:50px 20px;
}

.empty-state h2{
margin-bottom:10px;
}

</style>

</head>
<body>

<section class="dashboard">

<div class="favorite-header">

<div>

<h1>⭐ Toko Favorit</h1>

<p>
Kelola toko favorit Anda
</p>

</div>

<div class="dashboard-card">

<h3 id="totalFavorit">
0
</h3>

<p>Total Toko</p>

</div>

</div>

<input
type="text"
id="searchInput"
class="favorite-search"
placeholder="Cari toko favorit...">

<div
id="tokoContainer"
class="dashboard-grid">

<div class="dashboard-card">

<p>Memuat toko favorit...</p>

</div>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const container =
document.getElementById(
"tokoContainer"
);

const tokoFavorit =
JSON.parse(
localStorage.getItem(
"tokoFavorit"
)
) || [];

document.getElementById(
"totalFavorit"
).innerText =
tokoFavorit.length;

let semuaToko = [];

async function loadToko(){

container.innerHTML = "";

if(tokoFavorit.length === 0){

container.innerHTML = `

<div class="empty-state">

<h2>
⭐ Belum Ada Toko Favorit
</h2>

<p>
Ikuti toko favorit Anda terlebih dahulu.
</p>

<a
href="index.html"
class="btn-primary">

Jelajahi Toko

</a>

</div>

`;

return;

}

const snapshot =
await getDocs(
collection(db,"umkm")
);

snapshot.forEach((doc)=>{

const toko = doc.data();

if(
tokoFavorit.includes(
toko.uid
)
){

semuaToko.push(toko);

}

});

renderToko();

}

function renderToko(){

const keyword =
document
.getElementById(
"searchInput"
)
.value
.toLowerCase();

container.innerHTML = "";

const hasil =
semuaToko.filter((toko)=>{

return (
toko.namaUmkm || ""
)
.toLowerCase()
.includes(keyword);

});

if(hasil.length === 0){

container.innerHTML = `

<div class="dashboard-card">

<h3>
Toko Tidak Ditemukan
</h3>

</div>

`;

return;

}

hasil.forEach((toko)=>{

container.innerHTML += `

<div
class="store-card"
data-uid="${toko.uid}">

<img
src="${
toko.logo ||
'https://picsum.photos/300'
}"
class="store-logo">

<h3>
${toko.namaUmkm}
</h3>

<p>
${toko.deskripsi || ""}
</p>

<p>
⭐ ${toko.ratingToko || 0}
</p>

<div class="store-actions">

<a
href="toko.html?uid=${toko.uid}"
class="btn-primary">

Kunjungi

</a>

<button
onclick="hapusFavorit('${toko.uid}')"
class="btn-secondary">

Hapus

</button>

</div>

</div>

`;

});

}

window.hapusFavorit =
function(uid){

let favorit =
JSON.parse(
localStorage.getItem(
"tokoFavorit"
)
) || [];

favorit =
favorit.filter(
(item)=>item !== uid
);

localStorage.setItem(
"tokoFavorit",
JSON.stringify(favorit)
);

semuaToko =
semuaToko.filter(
(item)=>item.uid !== uid
);

document.getElementById(
"totalFavorit"
).innerText =
favorit.length;

renderToko();

};

document
.getElementById(
"searchInput"
)
.addEventListener(
"input",
renderToko
);

loadToko();

</script>

</body>
</html>
