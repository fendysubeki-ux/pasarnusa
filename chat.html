<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chat PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><section class="chat-page"><!-- Header --><div class="chat-header"><div class="chat-user"><img
id="fotoToko"
src="https://picsum.photos/100"
class="chat-avatar">

<div><h3 id="namaToko">
Toko PasarNusa
</h3><p id="statusOnline">
🟢 Online
</p></div></div><a
href="index.html"
class="btn-secondary">

⬅ Kembali

</a></div><!-- Produk --><div class="chat-product-card"><img
id="gambarProduk"
src="https://picsum.photos/150">

<div><h4 id="namaProduk">
Nama Produk
</h4><p id="hargaProduk">
Rp 0
</p><a
id="detailProduk"
href="#">

Lihat Produk

</a></div></div><!-- Chat --><div
id="chatContainer"
class="chat-container"><div class="chat-system">
Mulai percakapan dengan penjual
</div></div><!-- Input --><div class="chat-input-area"><input
type="text"
id="pesanInput"
placeholder="Tulis pesan...">

<button
id="kirimPesan"
class="btn-primary">

Kirim

</button></div></section><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

}

/* Parameter */

const params =
new URLSearchParams(
window.location.search
);

const roomId =
params.get("room");

if(!roomId){

alert(
"Room chat tidak ditemukan"
);

window.location.href =
"index.html";

}

/* Container */

const container =
document.getElementById(
"chatContainer"
);

/* Load Chat */

const q =
query(
collection(
db,
"chat_rooms",
roomId,
"messages"
),
orderBy(
"createdAt"
)
);

onSnapshot(
q,
(snapshot)=>{

container.innerHTML = "";

snapshot.forEach((doc)=>{

const data =
doc.data();

const saya =
data.uid ===
auth.currentUser.uid;

container.innerHTML += `

<div class="
${saya ? "chat-right" : "chat-left"}
">

<div class="chat-bubble">

${data.pesan}

</div>

</div>

`;

});

container.scrollTop =
container.scrollHeight;

}
);

/* Kirim Pesan */

async function kirimPesan(){

const input =
document.getElementById(
"pesanInput"
);

const pesan =
input.value.trim();

if(!pesan) return;

await addDoc(
collection(
db,
"chat_rooms",
roomId,
"messages"
),
{
uid:
auth.currentUser.uid,

nama:
auth.currentUser.email,

pesan:
pesan,

createdAt:
serverTimestamp()
}
);

input.value = "";

}

/* Event */

document
.getElementById(
"kirimPesan"
)
.addEventListener(
"click",
kirimPesan
);

document
.getElementById(
"pesanInput"
)
.addEventListener(
"keydown",
(e)=>{

if(e.key === "Enter"){

kirimPesan();

}

}
);

</script></body>
</html>
