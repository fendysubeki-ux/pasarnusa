<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chat PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><section class="chat-page"><!-- Header --><div class="chat-header"><div class="chat-user"><img
id="fotoToko"
src="https://picsum.photos/100"
class="chat-avatar">

<div><h3 id="namaToko">
Toko PasarNusa
</h3><p id="statusOnline">
🟢 Online
</p></div></div><a
href="index.html"
class="btn-secondary">

⬅ Kembali

</a></div><!-- Produk --><div class="chat-product-card"><img
id="gambarProduk"
src="https://picsum.photos/150">

<div><h4 id="namaProduk">
Nama Produk
</h4><p id="hargaProduk">
Rp 0
</p><a
id="detailProduk"
href="#">

Lihat Produk

</a></div></div><!-- Chat --><div
id="chatContainer"
class="chat-container"><div class="chat-system">
Mulai percakapan dengan penjual
</div></div><!-- Input --><div class="chat-input-area"><input
type="text"
id="pesanInput"
placeholder="Tulis pesan...">

<button
id="kirimPesan"
class="btn-primary">

Kirim

</button></div></section>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

throw new Error(
"Belum login"
);

}

const params =
new URLSearchParams(
window.location.search
);

const roomId =
params.get("room");

if(!roomId){

alert(
"Room tidak ditemukan"
);

window.location.href =
"index.html";

throw new Error(
"Room kosong"
);

}

const roomRef =
doc(
db,
"chat_rooms",
roomId
);

const roomSnap =
await getDoc(roomRef);

if(!roomSnap.exists()){

alert(
"Room tidak ditemukan"
);

window.location.href =
"index.html";

throw new Error(
"Room tidak ada"
);

}

const room =
roomSnap.data();

if(
!room.members ||
!room.members.includes(
auth.currentUser.uid
)
){

alert(
"Akses ditolak"
);

window.location.href =
"index.html";

throw new Error(
"Bukan anggota room"
);

}

/* HEADER */

document.getElementById(
"namaToko"
).innerText =
room.namaToko ||
"Toko PasarNusa";

document.getElementById(
"fotoToko"
).src =
room.fotoToko ||
"https://picsum.photos/100";

document.getElementById(
"namaProduk"
).innerText =
room.namaProduk ||
"Produk";

document.getElementById(
"hargaProduk"
).innerText =
"Rp " +
Number(
room.hargaProduk || 0
).toLocaleString("id-ID");

document.getElementById(
"gambarProduk"
).src =
room.gambarProduk ||
"https://picsum.photos/150";

document.getElementById(
"detailProduk"
).href =
"produk-detail.html?id=" +
(room.produkId || "");

/* CHAT */

const container =
document.getElementById(
"chatContainer"
);

const chatQuery =
query(
collection(
db,
"chat_rooms",
roomId,
"messages"
),
orderBy(
"createdAt",
"asc"
)
);

onSnapshot(
chatQuery,
(snapshot)=>{

container.innerHTML = "";

if(snapshot.empty){

container.innerHTML = `
<div class="chat-system">
Mulai percakapan dengan penjual
</div>
`;

return;

}

snapshot.forEach((item)=>{

const data =
item.data();

const saya =
data.uid ===
auth.currentUser.uid;

const pesan =
String(
data.pesan || ""
)
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

container.innerHTML += `

<div class="
${saya ? "chat-right" : "chat-left"}
">

<div class="chat-bubble">

${pesan}

</div>

</div>

`;

});

container.scrollTop =
container.scrollHeight;

}
);

/* KIRIM PESAN */

let sending = false;

async function kirimPesan(){

if(sending) return;

const input =
document.getElementById(
"pesanInput"
);

const pesan =
input.value.trim();

if(!pesan) return;

if(
pesan.length > 1000
){

alert(
"Maksimal 1000 karakter"
);

return;

}

try{

sending = true;

await addDoc(
collection(
db,
"chat_rooms",
roomId,
"messages"
),
{

uid:
auth.currentUser.uid,

nama:
auth.currentUser.email,

pesan:
pesan,

createdAt:
serverTimestamp()

}
);

input.value = "";

}
catch(error){

console.error(error);

alert(
"Gagal mengirim pesan"
);

}
finally{

sending = false;

}

}

/* EVENT */

document
.getElementById(
"kirimPesan"
)
.addEventListener(
"click",
kirimPesan
);

document
.getElementById(
"pesanInput"
)
.addEventListener(
"keydown",
(e)=>{

if(
e.key === "Enter"
){

kirimPesan();

}

}
);

</script></body>
</html>
