<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesanan Admin - PasarNusa</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<section class="dashboard">

<h1>📦 Kelola Pesanan</h1>

<div id="pesananContainer" class="dashboard-grid">

<div class="dashboard-card">
Loading...
</div>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container =
document.getElementById("pesananContainer");

async function loadPesanan(){

try{

const snapshot =
await getDocs(
collection(db,"pesanan")
);

container.innerHTML = "";

if(snapshot.empty){

container.innerHTML = `
<div class="dashboard-card">
<h3>Belum ada pesanan</h3>
<p>Belum ada transaksi masuk.</p>
</div>
`;

return;

}

snapshot.forEach((item)=>{

const data = item.data();

container.innerHTML += `

<a href="detail-pesanan-admin.html?id=${item.id}"
class="dashboard-card">

<h3>
Pesanan #${item.id.substring(0,8)}
</h3>

<p>
Status:
${data.status || "menunggu"}
</p>

<p>
Rp ${Number(
data.total ||
data.totalBayar ||
0
).toLocaleString("id-ID")}
</p>

</a>

`;

});

}
catch(error){

console.error(error);

container.innerHTML = `
<div class="dashboard-card">
<h3>Error</h3>
<p>${error.message}</p>
</div>
`;

}

}

loadPesanan();

</script>

</body>
</html>
