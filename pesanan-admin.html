<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kelola Pesanan Admin - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#16a34a">

</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>

<h1>📦 Kelola Pesanan</h1>

<p>
Kelola seluruh transaksi Marketplace PasarNusa.
</p>

</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;">

<a
href="dashboard-admin.html"
class="btn-secondary">

⬅ Dashboard

</a>

<button
onclick="location.reload()"
class="btn-primary">

🔄 Refresh

</button>

</div>

</div>

</section>

<section class="dashboard">

<h2>📊 Statistik Pesanan</h2>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3 id="totalPesanan">0</h3>
<p>Total Pesanan</p>
</div>

<div class="dashboard-card">
<h3 id="belumBayar">0</h3>
<p>Belum Bayar</p>
</div>

<div class="dashboard-card">
<h3 id="menungguVerifikasi">0</h3>
<p>Menunggu Verifikasi</p>
</div>

<div class="dashboard-card">
<h3 id="diproses">0</h3>
<p>Diproses</p>
</div>

<div class="dashboard-card">
<h3 id="dikirim">0</h3>
<p>Dikirim</p>
</div>

<div class="dashboard-card">
<h3 id="selesai">0</h3>
<p>Selesai</p>
</div>

<div class="dashboard-card">
<h3 id="dibatalkan">0</h3>
<p>Dibatalkan</p>
</div>

<div class="dashboard-card">
<h3 id="totalOmset">Rp 0</h3>
<p>Total Omset</p>
</div>

</div>

</section>

<section class="dashboard">

<div style="display:flex;gap:15px;flex-wrap:wrap;">

<input
type="text"
id="searchPesanan"
class="search-box"
placeholder="Cari ID atau nama pembeli...">

<select id="filterStatus">

<option value="Semua">
Semua Status
</option>

<option value="Belum Bayar">
Belum Bayar
</option>

<option value="Menunggu Verifikasi">
Menunggu Verifikasi
</option>

<option value="Diproses">
Diproses
</option>

<option value="Dikirim">
Dikirim
</option>

<option value="Selesai">
Selesai
</option>

<option value="Dibatalkan">
Dibatalkan
</option>

</select>

</div>

</section>

<section class="dashboard">

<div
id="pesananContainer"
class="dashboard-grid">

<div class="dashboard-card">

<h3>Loading...</h3>

<p>
Memuat seluruh pesanan marketplace...
</p>

</div>

</div>

</section>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href="login.html";

throw new Error("Belum login");

}

const adminSnap =
await getDoc(
doc(
db,
"users",
auth.currentUser.uid
)
);

if(
!adminSnap.exists() ||
adminSnap.data().role !== "admin"
){

alert("Akses khusus admin");

window.location.href="index.html";

throw new Error("Bukan admin");

}

const container =
document.getElementById(
"pesananContainer"
);

let semuaPesanan=[];

async function loadPesanan(){

try{

const snapshot=
await getDocs(
collection(db,"pesanan")
);

semuaPesanan=[];

let total=0;
let belumBayar=0;
let menungguVerifikasi=0;
let diproses=0;
let dikirim=0;
let selesai=0;
let dibatalkan=0;
let omset=0;

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

semuaPesanan.push({

id:docSnap.id,

...data

});

total++;

switch(data.status){

case "Belum Bayar":
belumBayar++;
break;

case "Menunggu Verifikasi":
menungguVerifikasi++;
break;

case "Diproses":
diproses++;
break;

case "Dikirim":
dikirim++;
break;

case "Selesai":
selesai++;
omset+=Number(
data.totalBayar||0
);
break;

case "Dibatalkan":
dibatalkan++;
break;

}

});

semuaPesanan.reverse();

document.getElementById("totalPesanan").innerText=total;

document.getElementById("belumBayar").innerText=belumBayar;

document.getElementById("menungguVerifikasi").innerText=menungguVerifikasi;

document.getElementById("diproses").innerText=diproses;

document.getElementById("dikirim").innerText=dikirim;

document.getElementById("selesai").innerText=selesai;

document.getElementById("dibatalkan").innerText=dibatalkan;

document.getElementById("totalOmset").innerText=
"Rp "+
omset.toLocaleString("id-ID");

renderPesanan();

}
catch(error){

console.error(error);

container.innerHTML=`
<div class="dashboard-card">
<h3>Error</h3>
<p>${error.message}</p>
</div>
`;

}

}
function renderPesanan(){

const keyword =
document.getElementById(
"searchPesanan"
).value.toLowerCase();

const filter =
document.getElementById(
"filterStatus"
).value;

container.innerHTML="";

const hasil =
semuaPesanan.filter((pesanan)=>{

const cocokNama =
(pesanan.namaPembeli||"")
.toLowerCase()
.includes(keyword);

const cocokId =
pesanan.id
.toLowerCase()
.includes(keyword);

const cocokStatus =
filter==="Semua"
||
pesanan.status===filter;

return(
(cocokNama||cocokId)
&& cocokStatus
);

});

if(hasil.length===0){

container.innerHTML=`

<div class="dashboard-card">

<h3>
Tidak Ada Pesanan
</h3>

<p>
Pesanan tidak ditemukan.
</p>

</div>

`;

return;

}

hasil.forEach((pesanan)=>{

const tanggal =
pesanan.createdAt?.seconds
?
new Date(
pesanan.createdAt.seconds*1000
).toLocaleString("id-ID")
:
"-";

let badge="#6b7280";

switch(pesanan.status){

case "Belum Bayar":
badge="#ef4444";
break;

case "Menunggu Verifikasi":
badge="#f59e0b";
break;

case "Diproses":
badge="#3b82f6";
break;

case "Dikirim":
badge="#8b5cf6";
break;

case "Selesai":
badge="#16a34a";
break;

case "Dibatalkan":
badge="#374151";
break;

}

container.innerHTML += `

<div class="dashboard-card">

<h3>

🧾 #${pesanan.id.substring(0,8)}

</h3>

<p>

👤 ${pesanan.namaPembeli||"-"}

</p>

<p>

🏪 ${pesanan.namaUmkm||"-"}

</p>

<p>

📱 ${pesanan.whatsapp||"-"}

</p>

<p>

📅 ${tanggal}

</p>

<p>

💰 Rp ${Number(
pesanan.totalBayar||0
).toLocaleString("id-ID")}

</p>

<p>

<span style="
background:${badge};
color:#fff;
padding:5px 12px;
border-radius:8px;
">

${pesanan.status}

</span>

</p>

<div style="
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:15px;
">

<a
href="detail-pesanan-admin.html?id=${pesanan.id}"
class="btn-primary">

📋 Detail

</a>

<button
class="btn-secondary"
onclick="updateStatus('${pesanan.id}','Diproses')">

Diproses

</button>

<button
class="btn-secondary"
onclick="updateStatus('${pesanan.id}','Dikirim')">

Dikirim

</button>

<button
class="btn-primary"
onclick="updateStatus('${pesanan.id}','Selesai')">

Selesai

</button>

<button
class="btn-secondary"
onclick="updateStatus('${pesanan.id}','Dibatalkan')">

Batalkan

</button>

</div>

</div>

`;

});

}
window.updateStatus = async(id,status)=>{

try{

await updateDoc(
doc(db,"pesanan",id),
{
status:status,
statusUmkm:status
}
);

alert("Status berhasil diperbarui");

loadPesanan();

}
catch(error){

console.error(error);

alert(error.message);

}

};

document
.getElementById("searchPesanan")
.addEventListener(
"input",
renderPesanan
);

document
.getElementById("filterStatus")
.addEventListener(
"change",
renderPesanan
);

loadPesanan();

</script>

</body>

</html>
