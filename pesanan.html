<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesanan Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="cart-section">

<h1>Riwayat Pesanan</h1>

<div id="pesananContainer">

</div>

</section>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain: "pasarnusa-18aa0.firebaseapp.com",
projectId: "pasarnusa-18aa0",
storageBucket: "pasarnusa-18aa0.firebasestorage.app",
messagingSenderId: "866998011671",
appId: "1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container =
document.getElementById("pesananContainer");

const querySnapshot =
await getDocs(collection(db,"pesanan"));

querySnapshot.forEach((doc)=>{

const pesanan = doc.data();

container.innerHTML += `

<div class="cart-card">

<h3>${pesanan.produk}</h3>

<div class="status diproses">
${pesanan.status}
</div>

<p>
Status:
<b>${pesanan.status}</b>
</p>

<button
onclick="ubahStatus('${doc.id}','Diproses')"
class="btn-secondary">
Diproses
</button>

<button
onclick="ubahStatus('${doc.id}','Dikirim')"
class="btn-secondary">
Dikirim
</button>

<button
onclick="ubahStatus('${doc.id}','Selesai')"
class="btn-primary">
Selesai
</button>

<p>
Pembeli:
${pesanan.namaPembeli}
</p>

<p>
Total:
Rp ${Number(pesanan.harga).toLocaleString("id-ID")}
</p>

</div>

`;

});
window.ubahStatus = async(id,status)=>{

await updateDoc(
doc(db,"pesanan",id),
{
status: status
}
);

location.reload();

};
</script>
</body>
</html>
