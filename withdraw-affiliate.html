<!DOCTYPE html><html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tarik Komisi Affiliate - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><section class="dashboard"><div class="dashboard-header"><div>
<h1>💸 Tarik Komisi Affiliate</h1>
<p>Ajukan pencairan komisi ke rekening atau e-wallet.</p>
</div><a href="dashboard-affiliate.html" class="btn-secondary">
Kembali
</a></div><div class="dashboard-grid"><div class="dashboard-card">
<h3 id="saldoKomisi">Rp 0</h3>
<p>Saldo Tersedia</p>
</div><div class="dashboard-card">
<h3 id="totalDicairkan">Rp 0</h3>
<p>Total Dicairkan</p>
</div><div class="dashboard-card">
<h3>Rp 50.000</h3>
<p>Minimum Pencairan</p>
</div></div><div class="form-card"><h3>Data Pencairan</h3><input
type="text"
id="namaBank"
placeholder="Nama Bank / E-Wallet">

<input
type="text"
id="namaPemilik"
placeholder="Nama Pemilik Rekening">

<input
type="text"
id="nomorRekening"
placeholder="Nomor Rekening / E-Wallet">

<input
type="number"
id="jumlahWithdraw"
placeholder="Jumlah Pencairan">

<button
id="btnWithdraw"
class="btn-primary">

Ajukan Pencairan

</button></div><h2>📋 Riwayat Pencairan</h2><div
id="riwayatContainer"
class="dashboard-grid"><div class="dashboard-card">
<p>Memuat data...</p>
</div></div></section><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where,
addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_PROJECT.appspot.com",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

let saldoKomisi = 0;

const riwayatContainer =
document.getElementById(
"riwayatContainer"
);

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

const pesananSnap =
await getDocs(
query(
collection(db,"pesanan"),
where(
"affiliate",
"==",
user.uid
)
)
);

pesananSnap.forEach((item)=>{

const data = item.data();

if(data.status === "Selesai"){

saldoKomisi += Number(
data.komisiAffiliate || 0
);

}

});

document.getElementById(
"saldoKomisi"
).innerText =
"Rp " +
saldoKomisi.toLocaleString("id-ID");

const withdrawSnap =
await getDocs(
query(
collection(db,"withdrawAffiliate"),
where(
"uid",
"==",
user.uid
)
)
);

let totalDicairkan = 0;

riwayatContainer.innerHTML = "";

withdrawSnap.forEach((item)=>{

const data = item.data();

if(data.status === "Disetujui"){

totalDicairkan +=
Number(data.jumlah || 0);

}

riwayatContainer.innerHTML += `

<div class="dashboard-card">

<h3>
${data.bank}
</h3>

<p>
${data.rekening}
</p>

<p>
Rp ${Number(
data.jumlah || 0
).toLocaleString("id-ID")}
</p>

<p>
Status:
<b>
${data.status}
</b>
</p>

</div>

`;

});

document.getElementById(
"totalDicairkan"
).innerText =
"Rp " +
totalDicairkan.toLocaleString("id-ID");

});

document
.getElementById(
"btnWithdraw"
)
.addEventListener(
"click",
async()=>{

const user =
auth.currentUser;

const bank =
document.getElementById(
"namaBank"
).value.trim();

const pemilik =
document.getElementById(
"namaPemilik"
).value.trim();

const rekening =
document.getElementById(
"nomorRekening"
).value.trim();

const jumlah =
Number(
document.getElementById(
"jumlahWithdraw"
).value
);

if(
!bank ||
!pemilik ||
!rekening ||
!jumlah
){

alert(
"Lengkapi semua data"
);

return;

}

if(jumlah < 50000){

alert(
"Minimum pencairan Rp 50.000"
);

return;

}

if(jumlah > saldoKomisi){

alert(
"Saldo komisi tidak mencukupi"
);

return;

}

await addDoc(
collection(
db,
"withdrawAffiliate"
),
{
uid:user.uid,
bank:bank,
pemilik:pemilik,
rekening:rekening,
jumlah:jumlah,
status:"Menunggu Persetujuan",
createdAt:new Date()
}
);

alert(
"Pengajuan pencairan berhasil dikirim"
);

location.reload();

}
);

</script></body>
</html>
