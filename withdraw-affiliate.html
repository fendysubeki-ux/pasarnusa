<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tarik Komisi Affiliate - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>
<body>

<section class="dashboard">

<div class="dashboard-header">

<div>
<h1>💸 Tarik Komisi Affiliate</h1>
<p>Ajukan pencairan komisi ke rekening atau e-wallet.</p>
</div>

<a href="affiliate-dashboard.html" class="btn-secondary">
Kembali
</a>

</div>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3 id="saldoKomisi">Rp 0</h3>
<p>Saldo Tersedia</p>
</div>

<div class="dashboard-card">
<h3 id="totalDicairkan">Rp 0</h3>
<p>Total Dicairkan</p>
</div>

<div class="dashboard-card">
<h3>Rp 50.000</h3>
<p>Minimum Pencairan</p>
</div>

</div>

<div class="form-card">

<h3>Data Pencairan</h3>

<input
type="text"
id="namaBank"
placeholder="Nama Bank / E-Wallet">

<input
type="text"
id="namaPemilik"
placeholder="Nama Pemilik Rekening">

<input
type="text"
id="nomorRekening"
placeholder="Nomor Rekening / E-Wallet">

<input
type="number"
id="jumlahWithdraw"
placeholder="Jumlah Pencairan">

<button
id="btnWithdraw"
class="btn-primary">

Ajukan Pencairan

</button>

</div>

<h2>📋 Riwayat Pencairan</h2>

<div
id="riwayatContainer"
class="dashboard-grid">

<div class="dashboard-card">
<p>Memuat data...</p>
</div>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href = "login.html";

}

const uid = auth.currentUser.uid;

const riwayatContainer =
document.getElementById("riwayatContainer");

let saldoKomisi = 0;

async function loadData(){

try{

const pesananSnap = await getDocs(
query(
collection(db,"pesanan"),
where("affiliateUid","==",uid)
)
);

let totalKomisi = 0;

pesananSnap.forEach((item)=>{

const data = item.data();

if(data.status === "Selesai"){

totalKomisi += Number(
data.komisiAffiliate || 0
);

}

});

const withdrawSnap = await getDocs(
query(
collection(db,"pencairanAffiliate"),
where("uid","==",uid)
)
);

let totalDicairkan = 0;

riwayatContainer.innerHTML = "";

if(withdrawSnap.empty){

riwayatContainer.innerHTML = `
<div class="dashboard-card">
<h3>Belum Ada Riwayat</h3>
<p>Pencairan komisi akan muncul di sini.</p>
</div>
`;

}

withdrawSnap.forEach((item)=>{

const data = item.data();

if(data.status === "Disetujui"){

totalDicairkan += Number(
data.jumlah || 0
);

}

riwayatContainer.innerHTML += `

<div class="dashboard-card">

<h3>${data.bank}</h3>

<p>${data.rekening}</p>

<p>
Rp ${Number(data.jumlah || 0)
.toLocaleString("id-ID")}
</p>

<p>
Status:
<b>${data.status}</b>
</p>

</div>

`;

});

saldoKomisi =
totalKomisi - totalDicairkan;

document.getElementById(
"saldoKomisi"
).innerText =
"Rp " +
saldoKomisi.toLocaleString("id-ID");

document.getElementById(
"totalDicairkan"
).innerText =
"Rp " +
totalDicairkan.toLocaleString("id-ID");

}catch(error){

console.error(error);

alert("Gagal memuat data");

}

}

await loadData();

document.getElementById(
"btnWithdraw"
).addEventListener(
"click",
async()=>{

const bank =
document.getElementById("namaBank").value.trim();

const pemilik =
document.getElementById("namaPemilik").value.trim();

const rekening =
document.getElementById("nomorRekening").value.trim();

const jumlah =
Number(
document.getElementById("jumlahWithdraw").value
);

if(
!bank ||
!pemilik ||
!rekening ||
!jumlah
){

alert("Lengkapi semua data");
return;

}

if(jumlah < 50000){

alert("Minimal pencairan Rp 50.000");
return;

}

if(jumlah > saldoKomisi){

alert("Saldo komisi tidak mencukupi");
return;

}

await addDoc(
collection(db,"pencairanAffiliate"),
{
uid,
bank,
pemilik,
rekening,
jumlah,
status:"Menunggu",
createdAt:serverTimestamp()
}
);

alert("Pengajuan berhasil dikirim");

location.reload();

}
);

</script>

</body>
</html>
