<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UMKM Admin - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>

<h1>🏪 Kelola UMKM</h1>

<p>
Kelola seluruh UMKM yang bergabung di PasarNusa.
</p>

</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;">

<a
href="dashboard-admin.html"
class="btn-secondary">

⬅ Dashboard

</a>

<button
onclick="location.reload()"
class="btn-primary">

🔄 Refresh

</button>

</div>

</div>

</section>

<section class="dashboard">

<h2>📊 Statistik UMKM</h2>

<div class="dashboard-grid">

<div class="dashboard-card">

<h3 id="totalUmkm">0</h3>

<p>Total UMKM</p>

</div>

<div class="dashboard-card">

<h3 id="umkmAktif">0</h3>

<p>UMKM Aktif</p>

</div>

<div class="dashboard-card">

<h3 id="umkmPending">0</h3>

<p>Menunggu Verifikasi</p>

</div>

<div class="dashboard-card">

<h3 id="umkmNonaktif">0</h3>

<p>Nonaktif</p>

</div>

</div>

</section>

<section class="dashboard">

<div style="display:flex;gap:15px;flex-wrap:wrap;">

<input
id="searchUmkm"
type="text"
class="search-box"
placeholder="Cari nama UMKM...">

<select
id="filterStatus">

<option value="Semua">
Semua Status
</option>

<option value="aktif">
Aktif
</option>

<option value="pending">
Pending
</option>

<option value="nonaktif">
Nonaktif
</option>

</select>

</div>

</section>

<section class="dashboard">

<div
id="umkmContainer"
class="dashboard-grid">

<div class="dashboard-card">

Memuat data UMKM...

</div>

</div>

</section>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig={

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href="login.html";

throw new Error("Belum login");

}

const adminSnap=
await getDoc(
doc(
db,
"users",
auth.currentUser.uid
)
);

if(
!adminSnap.exists()||
adminSnap.data().role!=="admin"
){

alert("Akses khusus Admin");

window.location.href="index.html";

throw new Error("Bukan Admin");

}

const container=
document.getElementById(
"umkmContainer"
);

let semuaUmkm=[];

async function loadUmkm(){

container.innerHTML=
"<p>Memuat data...</p>";

const snapshot=
await getDocs(
collection(db,"users")
);

semuaUmkm=[];

let total=0;
let aktif=0;
let pending=0;
let nonaktif=0;

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

if(data.role!=="umkm") return;

total++;

const status=
String(
data.status||"pending"
).toLowerCase();

if(status==="aktif"){

aktif++;

}else if(status==="nonaktif"){

nonaktif++;

}else{

pending++;

}

semuaUmkm.push({

id:docSnap.id,

...data

});

});

document.getElementById(
"totalUmkm"
).innerText=total;

document.getElementById(
"umkmAktif"
).innerText=aktif;

document.getElementById(
"umkmPending"
).innerText=pending;

document.getElementById(
"umkmNonaktif"
).innerText=nonaktif;

renderUmkm();

}
function renderUmkm(){

const keyword=
document.getElementById(
"searchUmkm"
).value.toLowerCase();

const filter=
document.getElementById(
"filterStatus"
).value.toLowerCase();

container.innerHTML="";

const hasil=
semuaUmkm.filter((umkm)=>{

const nama=
String(
umkm.namaToko||
umkm.nama||
""
).toLowerCase();

const status=
String(
umkm.status||
"pending"
).toLowerCase();

const cocokNama=
nama.includes(keyword);

const cocokStatus=
filter==="semua"
||
status===filter;

return cocokNama && cocokStatus;

});

if(hasil.length===0){

container.innerHTML=`

<div class="dashboard-card">

<h3>
Tidak Ada UMKM
</h3>

<p>
Data tidak ditemukan.
</p>

</div>

`;

return;

}

hasil.forEach((umkm)=>{

let warna="#f59e0b";
let status="Pending";

if(String(umkm.status).toLowerCase()==="aktif"){

warna="#16a34a";
status="Aktif";

}

if(String(umkm.status).toLowerCase()==="nonaktif"){

warna="#dc2626";
status="Nonaktif";

}

container.innerHTML+=`

<div class="dashboard-card">

<h3>

🏪 ${umkm.namaToko||"-"}

</h3>

<p>

👤 ${umkm.nama||"-"}

</p>

<p>

📱 ${umkm.whatsapp||"-"}

</p>

<p>

📍 ${umkm.kota||"-"}

</p>

<p>

<span style="
background:${warna};
color:#fff;
padding:5px 10px;
border-radius:8px;
">

${status}

</span>

</p>

<div style="
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
">

<a
href="detail-umkm-admin.html?id=${umkm.id}"
class="btn-secondary">

👁 Detail

</a>

<button
class="btn-primary"
onclick="ubahStatusUmkm('${umkm.id}','aktif')">

✅ Aktifkan

</button>

<button
class="btn-secondary"
onclick="ubahStatusUmkm('${umkm.id}','nonaktif')">

⛔ Nonaktifkan

</button>

</div>

</div>

`;

});

}
window.ubahStatusUmkm = async(id,status)=>{

try{

await updateDoc(
doc(db,"users",id),
{
status:status
}
);

alert(
"Status UMKM berhasil diperbarui"
);

await loadUmkm();

}
catch(error){

console.error(error);

alert(error.message);

}

};

document
.getElementById("searchUmkm")
.addEventListener(
"input",
renderUmkm
);

document
.getElementById("filterStatus")
.addEventListener(
"change",
renderUmkm
);

loadUmkm();

</script>

</body>

</html>
