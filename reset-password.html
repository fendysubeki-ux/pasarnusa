<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Plus Jakarta Sans',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f8fafc;
padding:20px;
}

.auth-card{
width:100%;
max-width:450px;
background:white;
padding:35px;
border-radius:24px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.logo{
font-size:55px;
text-align:center;
margin-bottom:15px;
}

.auth-card h1{
text-align:center;
margin-bottom:10px;
}

.auth-card p{
text-align:center;
color:#64748b;
margin-bottom:25px;
line-height:1.6;
}

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
margin-bottom:8px;
font-weight:600;
}

.input-group input{
width:100%;
padding:14px;
border:1px solid #e2e8f0;
border-radius:12px;
outline:none;
font-size:15px;
}

.input-group input:focus{
border-color:#22c55e;
}

.btn-primary{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#22c55e;
color:white;
font-size:15px;
font-weight:700;
cursor:pointer;
}

.btn-primary:hover{
opacity:.9;
}

.btn-primary:disabled{
opacity:.6;
cursor:not-allowed;
}

.success-box{
display:none;
padding:15px;
background:#dcfce7;
color:#166534;
border-radius:12px;
margin-top:20px;
line-height:1.6;
}

.error-box{
display:none;
padding:15px;
background:#fee2e2;
color:#991b1b;
border-radius:12px;
margin-top:20px;
line-height:1.6;
}

.back-link{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
font-weight:600;
color:#22c55e;
}

.back-link:hover{
text-decoration:underline;
}

</style>

</head>
<body>

<div class="auth-card">

<div class="logo">
🔐
</div>

<h1>Lupa Password</h1>

<p>
Masukkan email yang terdaftar pada akun PasarNusa.
Kami akan mengirimkan link untuk mengatur ulang password Anda.
</p>

<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="contoh@email.com"
autocomplete="email">

</div>

<button
id="btnReset"
class="btn-primary">

Kirim Link Reset Password

</button>

<div
id="successBox"
class="success-box">

</div>

<div
id="errorBox"
class="error-box">

</div>

<a
href="login.html"
class="back-link">

← Kembali ke Login

</a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const emailInput =
document.getElementById("email");

const btnReset =
document.getElementById("btnReset");

const successBox =
document.getElementById("successBox");

const errorBox =
document.getElementById("errorBox");

function showError(text){

errorBox.style.display =
"block";

successBox.style.display =
"none";

errorBox.innerText =
text;

}

function showSuccess(text){

successBox.style.display =
"block";

errorBox.style.display =
"none";

successBox.innerText =
text;

}

async function resetPassword(){

const email =
emailInput.value.trim();

const emailRegex =
/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(!email){

showError(
"Silakan masukkan email terlebih dahulu."
);

return;

}

if(!emailRegex.test(email)){

showError(
"Format email tidak valid."
);

return;

}

try{

btnReset.disabled = true;

btnReset.innerText =
"Mengirim Link...";

await sendPasswordResetEmail(
auth,
email
);

showSuccess(
"✅ Link reset password berhasil dikirim. Silakan cek inbox atau folder spam email Anda."
);

emailInput.value = "";

}
catch(error){

let pesan =
"Terjadi kesalahan. Silakan coba lagi.";

if(
error.code ===
"auth/user-not-found"
){

pesan =
"Email tidak terdaftar.";

}

if(
error.code ===
"auth/invalid-email"
){

pesan =
"Format email tidak valid.";

}

if(
error.code ===
"auth/too-many-requests"
){

pesan =
"Terlalu banyak percobaan. Silakan coba beberapa saat lagi.";

}

showError(pesan);

}
finally{

btnReset.disabled = false;

btnReset.innerText =
"Kirim Link Reset Password";

}

}

btnReset.addEventListener(
"click",
resetPassword
);

emailInput.addEventListener(
"keypress",
(e)=>{

if(e.key === "Enter"){

resetPassword();

}

}
);

</script>

</body>
</html>
