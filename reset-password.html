<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - PasarNusa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8fafc;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 450px;
      background: #fff;
      padding: 35px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    .logo {
      font-size: 55px;
      text-align: center;
      margin-bottom: 15px;
    }

    .auth-card h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .auth-card p {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      transition: border-color .15s ease;
    }

    .input-group input:focus {
      border-color: #22c55e;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s ease;
    }

    .btn-primary:hover {
      opacity: .9;
    }

    .btn-primary:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* Kotak notifikasi sukses & error memakai class yang sama untuk konsistensi */
    .notice-box {
      display: none;
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
      line-height: 1.6;
    }

    .notice-box.success {
      background: #dcfce7;
      color: #166534;
    }

    .notice-box.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
      font-weight: 600;
      color: #22c55e;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="logo">🔐</div>

    <h1>Lupa Password</h1>
    <p>
      Masukkan email yang terdaftar pada akun PasarNusa.
      Kami akan mengirimkan link untuk mengatur ulang password Anda.
    </p>

    <div class="input-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="contoh@email.com"
        autocomplete="email"
        required
      >
    </div>

    <button id="btnReset" class="btn-primary" type="button">
      Kirim Link Reset Password
    </button>

    <!-- Satu kotak notifikasi yang dipakai bersama untuk pesan sukses/error -->
    <div id="noticeBox" class="notice-box" role="status" aria-live="polite"></div>

    <a href="login.html" class="back-link">← Kembali ke Login</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    // Konfigurasi Firebase proyek PasarNusa
    const firebaseConfig = {
      apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
      authDomain: "pasarnusa-18aa0.firebaseapp.com",
      projectId: "pasarnusa-18aa0",
      storageBucket: "pasarnusa-18aa0.firebasestorage.app",
      messagingSenderId: "866998011671",
      appId: "1:866998011671:web:5555115feb82741ab55952"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Referensi elemen DOM
    const emailInput = document.getElementById("email");
    const btnReset = document.getElementById("btnReset");
    const noticeBox = document.getElementById("noticeBox");

    const BTN_DEFAULT_TEXT = "Kirim Link Reset Password";
    const BTN_LOADING_TEXT = "Mengirim Link...";
    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    /**
     * Menampilkan pesan pada notice box.
     * @param {string} text - Pesan yang ditampilkan.
     * @param {"success"|"error"} type - Jenis notifikasi.
     */
    function showNotice(text, type) {
      noticeBox.textContent = text;
      noticeBox.className = `notice-box ${type}`;
      noticeBox.style.display = "block";
    }

    /**
     * Mengubah pesan error Firebase menjadi pesan yang ramah pengguna.
     * Catatan keamanan: kita TIDAK membedakan pesan untuk "email tidak terdaftar"
     * agar tidak terjadi user enumeration (kebocoran info email mana yang valid).
     */
    function getErrorMessage(error) {
      switch (error.code) {
        case "auth/invalid-email":
          return "Format email tidak valid.";
        case "auth/too-many-requests":
          return "Terlalu banyak percobaan. Silakan coba beberapa saat lagi.";
        case "auth/user-not-found":
          // Tetap tampilkan pesan generik yang sama seperti sukses-nya,
          // supaya tidak membocorkan status pendaftaran email.
          return "Jika email terdaftar, link reset password akan segera dikirim.";
        default:
          return "Terjadi kesalahan. Silakan coba lagi.";
      }
    }

    /** Mengatur status tombol (loading / normal). */
    function setLoading(isLoading) {
      btnReset.disabled = isLoading;
      btnReset.textContent = isLoading ? BTN_LOADING_TEXT : BTN_DEFAULT_TEXT;
    }

    /** Proses utama: validasi input lalu kirim email reset password. */
    async function resetPassword() {
      const email = emailInput.value.trim();

      if (!email) {
        showNotice("Silakan masukkan email terlebih dahulu.", "error");
        return;
      }

      if (!EMAIL_REGEX.test(email)) {
        showNotice("Format email tidak valid.", "error");
        return;
      }

      setLoading(true);

      try {
        await sendPasswordResetEmail(auth, email);
        showNotice(
          "✅ Link reset password berhasil dikirim. Silakan cek inbox atau folder spam email Anda.",
          "success"
        );
        emailInput.value = "";
      } catch (error) {
        showNotice(getErrorMessage(error), "error");
      } finally {
        setLoading(false);
      }
    }

    // Event listeners
    btnReset.addEventListener("click", resetPassword);
    emailInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") resetPassword();
    });
  </script>

</body>
</html>
