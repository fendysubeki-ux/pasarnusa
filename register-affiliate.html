<!DOCTYPE html><html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Daftar Affiliate - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><meta name="description" content="Daftar Affiliate PasarNusa"></head><body><div class="register-card"><h1>💰 Daftar Affiliate</h1><p style="text-align:center;margin-bottom:20px;">
Promosikan produk UMKM dan dapatkan komisi dari setiap penjualan.
</p><input
type="text"
id="nama"
placeholder="Nama Lengkap">

<input
type="email"
id="email"
placeholder="Email">

<input
type="tel"
id="whatsapp"
placeholder="Nomor WhatsApp">

<input
type="password"
id="password"
placeholder="Password (Minimal 6 Karakter)">

<button
id="btnDaftar"
class="btn-primary">

Daftar Affiliate

</button><p style="text-align:center;margin-top:20px;">Sudah punya akun?

<a href="login.html">
Login
</a></p><p style="text-align:center;margin-top:10px;"><a href="index.html">
⬅ Kembali ke Beranda
</a></p></div><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth,
createUserWithEmailAndPassword,
signOut
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

async function daftarAffiliate(){

const btn =
document.getElementById("btnDaftar");

const nama =
document.getElementById("nama")
.value.trim();

const email =
document.getElementById("email")
.value.trim();

const whatsapp =
document.getElementById("whatsapp")
.value.trim();

const password =
document.getElementById("password")
.value;

if(
!nama ||
!email ||
!whatsapp ||
!password
){

alert(
"Lengkapi semua data terlebih dahulu"
);

return;

}

if(password.length < 6){

alert(
"Password minimal 6 karakter"
);

return;

}

if(
!whatsapp.startsWith("08")
){

alert(
"Nomor WhatsApp harus diawali 08"
);

return;

}

try{

btn.disabled = true;

btn.innerText =
"Mendaftarkan...";

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

const uid =
userCredential.user.uid;

await setDoc(
doc(db,"users",uid),
{
uid,
nama,
email,
whatsapp,

role:"affiliate",

status:"aktif",

saldoKomisi:0,

totalKomisi:0,

totalKlik:0,

totalPenjualan:0,

createdAt:
serverTimestamp()
}
);

alert(
"Pendaftaran Affiliate berhasil"
);

await signOut(auth);

window.location.href =
"login.html";

}
catch(error){

console.error(error);

let pesan =
"Pendaftaran gagal";

if(
error.code ===
"auth/email-already-in-use"
){

pesan =
"Email sudah digunakan";

}

if(
error.code ===
"auth/invalid-email"
){

pesan =
"Format email tidak valid";

}

alert(pesan);

}
finally{

btn.disabled = false;

btn.innerText =
"Daftar Affiliate";

}

}

document
.getElementById("btnDaftar")
.addEventListener(
"click",
daftarAffiliate
);

document
.addEventListener(
"keypress",
(e)=>{

if(e.key === "Enter"){

daftarAffiliate();

}

}
);

</script></body>
</html>
