<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Komisi Affiliate - Admin</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>

<h1>💰 Pencairan Komisi Affiliate</h1>

<p>

Kelola seluruh pencairan komisi affiliate.

</p>

</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;">

<a
href="dashboard-admin.html"
class="btn-secondary">

⬅ Dashboard

</a>

<button
onclick="location.reload()"
class="btn-primary">

🔄 Refresh

</button>

</div>

</div>

</section>

<section class="dashboard">

<h2>📊 Statistik</h2>

<div class="dashboard-grid">

<div class="dashboard-card">

<h3 id="totalWithdraw">

0

</h3>

<p>Total Pencairan</p>

</div>

<div class="dashboard-card">

<h3 id="pendingWithdraw">

0

</h3>

<p>Menunggu</p>

</div>

<div class="dashboard-card">

<h3 id="selesaiWithdraw">

0

</h3>

<p>Disetujui</p>

</div>

<div class="dashboard-card">

<h3 id="ditolakWithdraw">

0

</h3>

<p>Ditolak</p>

</div>

</div>

</section>

<section class="dashboard">

<input
id="searchWithdraw"
class="search-box"
placeholder="Cari affiliate...">

</section>

<section class="dashboard">

<div
id="withdrawContainer"
class="dashboard-grid">

<div class="dashboard-card">

Memuat data...

</div>

</div>

</section>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig={

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href="login.html";

throw new Error("Belum login");

}

const adminSnap=
await getDoc(
doc(
db,
"users",
auth.currentUser.uid
)
);

if(
!adminSnap.exists()||
adminSnap.data().role!=="admin"
){

alert("Akses khusus Admin");

window.location.href="index.html";

throw new Error("Bukan Admin");

}

const container=
document.getElementById(
"withdrawContainer"
);

let semuaWithdraw=[];

async function loadWithdraw(){

container.innerHTML=
"<p>Memuat data...</p>";

const snapshot=
await getDocs(
collection(db,"affiliate_withdraws")
);

semuaWithdraw=[];

let total=0;
let pending=0;
let selesai=0;
let ditolak=0;

snapshot.forEach((docSnap)=>{

const data=
docSnap.data();

total++;

if(data.status==="Menunggu"){

pending++;

}

if(data.status==="Selesai"){

selesai++;

}

if(data.status==="Ditolak"){

ditolak++;

}

semuaWithdraw.push({

id:docSnap.id,

...data

});

});

document.getElementById(
"totalWithdraw"
).innerText=
total;

document.getElementById(
"pendingWithdraw"
).innerText=
pending;

document.getElementById(
"selesaiWithdraw"
).innerText=
selesai;

document.getElementById(
"ditolakWithdraw"
).innerText=
ditolak;

renderWithdraw();

}
function renderWithdraw(){

const keyword=
document.getElementById(
"searchWithdraw"
).value.toLowerCase();

container.innerHTML="";

const hasil=
semuaWithdraw.filter((item)=>{

const nama=
String(
item.namaAffiliate||
item.nama||
""
).toLowerCase();

const rekening=
String(
item.nomorRekening||
""
).toLowerCase();

return(
nama.includes(keyword)
||
rekening.includes(keyword)
);

});

if(hasil.length===0){

container.innerHTML=`

<div class="dashboard-card">

<h3>
Tidak Ada Data
</h3>

<p>
Belum ada pengajuan pencairan.
</p>

</div>

`;

return;

}

hasil.forEach((item)=>{

let warna="#f59e0b";

if(item.status==="Selesai"){

warna="#16a34a";

}

if(item.status==="Ditolak"){

warna="#dc2626";

}

container.innerHTML+=`

<div class="dashboard-card">

<h3>

👤 ${item.namaAffiliate||"-"}

</h3>

<p>

💰 Nominal

<br>

<b>

Rp ${Number(
item.nominal||0
).toLocaleString("id-ID")}

</b>

</p>

<p>

🏦 ${item.bank||"-"}

</p>

<p>

💳 ${item.nomorRekening||"-"}

</p>

<p>

👤 ${item.namaRekening||"-"}

</p>

<p>

<span style="
background:${warna};
color:#fff;
padding:6px 12px;
border-radius:8px;
">

${item.status||"Menunggu"}

</span>

</p>

<div style="
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
">

<a
href="detail-withdraw-admin.html?id=${item.id}"
class="btn-secondary">

👁 Detail

</a>

<button
class="btn-primary"
onclick="updateWithdraw('${item.id}','Selesai')">

✅ Setujui

</button>

<button
class="btn-secondary"
onclick="updateWithdraw('${item.id}','Ditolak')">

❌ Tolak

</button>

</div>

</div>

`;

});

}
window.updateWithdraw = async(id,status)=>{

try{

await updateDoc(
doc(db,"affiliate_withdraws",id),
{
status:status
}
);

alert(
status==="Selesai"
?
"Pencairan berhasil disetujui."
:
"Pencairan berhasil ditolak."
);

await loadWithdraw();

}
catch(error){

console.error(error);

alert(error.message);

}

};

document
.getElementById("searchWithdraw")
.addEventListener(
"input",
renderWithdraw
);

loadWithdraw();

</script>

</body>

</html>
