<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16a34a" />
  <title>Kabupaten – PasarNusa</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ==================== HERO BANNER ==================== -->
  <section class="hero">
    <img
      id="bannerKabupaten"
      src="https://placehold.co/1200x400"
      alt="Banner Kabupaten"
      style="width:100%; height:260px; object-fit:cover; border-radius:20px;"
    />
  </section>

  <!-- ==================== NAMA & PROVINSI ==================== -->
  <section class="dashboard">
    <h1 id="namaKabupaten">Memuat...</h1>
    <p id="lokasiKabupaten">Provinsi</p>
  </section>

  <!-- ==================== STATISTIK ==================== -->
  <section class="dashboard">
    <div class="dashboard-grid">
      <div class="dashboard-card">
        <h3 id="jumlahKecamatan">0</h3>
        <p>Kecamatan</p>
      </div>
      <div class="dashboard-card">
        <h3 id="jumlahDesa">0</h3>
        <p>Desa</p>
      </div>
      <div class="dashboard-card">
        <h3 id="jumlahUmkm">0</h3>
        <p>UMKM</p>
      </div>
      <div class="dashboard-card">
        <h3 id="jumlahProduk">0</h3>
        <p>Produk</p>
      </div>
    </div>
  </section>

  <!-- ==================== DESKRIPSI KABUPATEN ==================== -->
  <section class="dashboard">
    <h2>📖 Tentang Kabupaten</h2>
    <div class="dashboard-card">
      <p id="deskripsiKabupaten">Memuat informasi...</p>
    </div>
  </section>

  <!-- ==================== DAFTAR KECAMATAN ==================== -->
  <section class="dashboard">
    <h2>🏛 Daftar Kecamatan</h2>
    <div id="kecamatanContainer" class="dashboard-grid">
      <div class="dashboard-card">Memuat data kecamatan...</div>
    </div>
  </section>

  <!-- ==================== FIREBASE + LOGIKA UTAMA ==================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    // --- Konfigurasi Firebase ---
    const firebaseConfig = {
      apiKey:            "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
      authDomain:        "pasarnusa-18aa0.firebaseapp.com",
      projectId:         "pasarnusa-18aa0",
      storageBucket:     "pasarnusa-18aa0.firebasestorage.app",
      messagingSenderId: "866998011671",
      appId:             "1:866998011671:web:5555115feb82741ab55952",
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    // --- Baca nama kabupaten dari query string URL (?kabupaten=NamaKabupaten) ---
    const params        = new URLSearchParams(window.location.search);
    const namaKabupaten = params.get("kabupaten");

    // Referensi elemen DOM yang sering dipakai
    const elNama        = document.getElementById("namaKabupaten");
    const elLokasi      = document.getElementById("lokasiKabupaten");
    const elDeskripsi   = document.getElementById("deskripsiKabupaten");
    const elBanner      = document.getElementById("bannerKabupaten");
    const elKecamatan   = document.getElementById("jumlahKecamatan");
    const elDesa        = document.getElementById("jumlahDesa");
    const elUmkm        = document.getElementById("jumlahUmkm");
    const elProduk      = document.getElementById("jumlahProduk");
    const kecamatanContainer = document.getElementById("kecamatanContainer");

    // Guard: hentikan jika tidak ada parameter kabupaten
    if (!namaKabupaten) {
      elNama.innerText = "Kabupaten tidak ditemukan.";
      throw new Error("Parameter 'kabupaten' tidak ada di URL.");
    }

    // ---------------------------------------------------------------
    // loadKabupaten()
    // Mengambil info dasar kabupaten (nama, provinsi, deskripsi, banner)
    // lalu memuat statistik dan daftar kecamatan secara paralel.
    // ---------------------------------------------------------------
    async function loadKabupaten() {
      try {
        // Query langsung berdasarkan field 'nama' agar tidak fetch semua dokumen
        const q    = query(collection(db, "kabupaten"), where("nama", "==", namaKabupaten));
        const snap = await getDocs(q);

        if (snap.empty) {
          elNama.innerText    = "Kabupaten tidak ditemukan.";
          elDeskripsi.innerText = "Data tidak tersedia.";
          return;
        }

        // Ambil dokumen pertama yang cocok
        const data = snap.docs[0].data();

        elNama.innerText      = data.nama      ?? "-";
        elLokasi.innerText    = data.provinsi  ?? "-";
        elDeskripsi.innerText = data.deskripsi ?? "-";
        elBanner.src          = data.banner    ?? "https://placehold.co/1200x400";
        elBanner.alt          = `Banner ${data.nama}`;

        // Muat statistik & kecamatan setelah info kabupaten tampil
        await loadStatistik();

      } catch (err) {
        console.error("Gagal memuat kabupaten:", err);
        elNama.innerText = "Terjadi kesalahan saat memuat data.";
      }
    }

    // ---------------------------------------------------------------
    // loadStatistik()
    // Mengambil data kecamatan, desa, dan produk secara paralel,
    // kemudian menghitung statistik yang relevan untuk kabupaten ini.
    // ---------------------------------------------------------------
    async function loadStatistik() {
      // Fetch tiga koleksi secara bersamaan untuk efisiensi
      const [kecamatanSnap, desaSnap, produkSnap] = await Promise.all([
        getDocs(query(collection(db, "kecamatan"), where("kabupaten", "==", namaKabupaten))),
        getDocs(query(collection(db, "desa"),      where("kabupaten", "==", namaKabupaten))),
        getDocs(query(collection(db, "produk"),    where("kabupaten", "==", namaKabupaten))),
      ]);

      // Hitung jumlah kecamatan & kumpulkan datanya untuk dirender
      const daftarKecamatan = kecamatanSnap.docs.map((doc) => ({
        id: doc.id,
        ...doc.data(),
      }));

      // Hitung UMKM unik berdasarkan uidUmkm pada produk
      const umkmSet = new Set(
        produkSnap.docs
          .map((doc) => doc.data().uidUmkm)
          .filter(Boolean)
      );

      // Perbarui tampilan statistik
      elKecamatan.innerText = daftarKecamatan.length;
      elDesa.innerText      = desaSnap.size;
      elUmkm.innerText      = umkmSet.size;
      elProduk.innerText    = produkSnap.size;

      renderKecamatan(daftarKecamatan);
    }

    // ---------------------------------------------------------------
    // renderKecamatan(daftar)
    // Merender kartu-kartu kecamatan ke dalam kecamatanContainer.
    // ---------------------------------------------------------------
    function renderKecamatan(daftar) {
      if (daftar.length === 0) {
        kecamatanContainer.innerHTML = `
          <div class="dashboard-card">
            <h3>Belum Ada Kecamatan</h3>
            <p>Belum ada data kecamatan untuk kabupaten ini.</p>
          </div>`;
        return;
      }

      // Bangun semua HTML sekaligus, hindari banyak innerHTML+= (menyebabkan reflow berulang)
      kecamatanContainer.innerHTML = daftar.map((item) => `
        <div class="dashboard-card">
          <img
            src="${item.banner ?? "https://placehold.co/600x300"}"
            alt="Banner ${item.nama ?? "Kecamatan"}"
            style="width:100%; height:180px; object-fit:cover; border-radius:15px;"
            loading="lazy"
          />
          <h3>🏛 ${item.nama ?? "-"}</h3>
          <p>${item.deskripsi ?? "-"}</p>
          <a
            href="kecamatan.html?kecamatan=${encodeURIComponent(item.nama ?? "")}"
            class="btn-primary"
          >
            Lihat Kecamatan
          </a>
        </div>
      `).join("");
    }

    // Mulai proses pemuatan data
    loadKabupaten();
  </script>

</body>
</html>
