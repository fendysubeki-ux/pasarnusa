<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Riwayat Transaksi - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>
<h1>💳 Riwayat Transaksi</h1>
<p>Lihat seluruh transaksi toko Anda</p>
</div>

<a href="dashboard-umkm.html" class="btn-secondary">
⬅ Dashboard
</a>

</div>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3 id="totalTransaksi">0</h3>
<p>Total Transaksi</p>
</div>

<div class="dashboard-card">
<h3 id="transaksiSelesai">0</h3>
<p>Transaksi Selesai</p>
</div>

<div class="dashboard-card">
<h3 id="transaksiPending">0</h3>
<p>Transaksi Pending</p>
</div>

<div class="dashboard-card">
<h3 id="totalPendapatan">Rp 0</h3>
<p>Total Pendapatan</p>
</div>

</div>

<br>

<div style="display:flex;gap:10px;flex-wrap:wrap;">

<input
type="text"
id="searchTransaksi"
class="search-box"
placeholder="Cari transaksi...">

<select id="filterStatus">

<option value="all">
Semua Status
</option>

<option value="Selesai">
Selesai
</option>

<option value="Diproses">
Diproses
</option>

<option value="Dikirim">
Dikirim
</option>

<option value="Belum Bayar">
Belum Bayar
</option>

</select>

</div>

<br>

<div
id="transaksiContainer"
class="dashboard-grid">

<div class="dashboard-card">

<h3>Memuat Data...</h3>

<p>Mohon tunggu sebentar</p>

</div>

</div>

</section>

<script type="module" src="riwayat-transaksi.js"></script>

</body>
</html>
