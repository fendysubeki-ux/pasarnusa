<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Riwayat Transaksi - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><section class="dashboard"><div class="page-header"><div>
<h1>💳 Riwayat Transaksi</h1>
<p>Pantau seluruh transaksi toko Anda</p>
</div><a href="dashboard.html" class="btn-secondary">
← Dashboard
</a></div><div class="dashboard-grid"><div class="dashboard-card">
<h3 id="totalTransaksi">0</h3>
<p>Total Transaksi</p>
</div><div class="dashboard-card">
<h3 id="totalOmzet">Rp 0</h3>
<p>Total Omzet</p>
</div><div class="dashboard-card">
<h3 id="transaksiSelesai">0</h3>
<p>Transaksi Selesai</p>
</div><div class="dashboard-card">
<h3 id="transaksiPending">0</h3>
<p>Belum Selesai</p>
</div></div><div class="form-card"><input
type="text"
id="searchInput"
placeholder="Cari nama pembeli atau produk...">

<select id="filterStatus"><option value="all">Semua Status</option>
<option value="Belum Bayar">Belum Bayar</option>
<option value="Diproses">Diproses</option>
<option value="Dikirim">Dikirim</option>
<option value="Selesai">Selesai</option></select></div><div
id="transaksiContainer"
class="dashboard-grid"><div class="dashboard-card"><h3>Memuat transaksi...</h3></div></div></section><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where,
orderBy
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_STORAGE_BUCKET",
messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href = "login.html";

}

const container =
document.getElementById("transaksiContainer");

const snapshot =
await getDocs(
query(
collection(db,"pesanan"),
where("uid","==",auth.currentUser.uid),
orderBy("createdAt","desc")
)
);

container.innerHTML = "";

let totalOmzet = 0;
let totalTransaksi = 0;
let transaksiSelesai = 0;
let transaksiPending = 0;

if(snapshot.empty){

container.innerHTML = `
<div class="dashboard-card">
<h3>Belum Ada Transaksi</h3>
<p>Transaksi toko akan muncul di sini.</p>
</div>
`;

}

snapshot.forEach((docSnap)=>{

const data = docSnap.data();

totalTransaksi++;

totalOmzet += Number(
data.totalBayar || 0
);

if(data.status === "Selesai"){
transaksiSelesai++;
}else{
transaksiPending++;
}

let statusClass = "status-pending";

if(data.status === "Selesai"){
statusClass = "status-success";
}

container.innerHTML += `

<div class="dashboard-card transaksi-item">

<h3>
#${docSnap.id.slice(0,8)}
</h3>

<p>
👤 ${data.namaPembeli || "-"}
</p>

<p>
💰 Rp ${Number(
data.totalBayar || 0
).toLocaleString("id-ID")}
</p>

<p>
📦 ${data.items?.length || 0} Produk
</p>

<p>
📅 ${
data.createdAt?.seconds
?
new Date(
data.createdAt.seconds * 1000
).toLocaleDateString("id-ID")
:
"-"
}
</p>

<div class="${statusClass}">
${data.status || "-"}
</div>

<br>

<a
href="detail-transaksi.html?id=${docSnap.id}"
class="btn-primary">

Lihat Detail

</a>

</div>

`;

});

document.getElementById(
"totalTransaksi"
).innerText =
totalTransaksi;

document.getElementById(
"totalOmzet"
).innerText =
"Rp " +
totalOmzet.toLocaleString("id-ID");

document.getElementById(
"transaksiSelesai"
).innerText =
transaksiSelesai;

document.getElementById(
"transaksiPending"
).innerText =
transaksiPending;

</script></body>
</html>
