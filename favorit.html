<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Favorit Saya - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head><body><section class="dashboard"><h1>❤️ Favorit Saya</h1><div class="dashboard-grid"><div class="dashboard-card">
<h3 id="totalFavorit">0</h3>
<p>Total Produk Favorit</p>
</div><div class="dashboard-card">
<h3>🛍️</h3>
<p>Simpan produk favorit Anda</p>
</div></div><div style="
display:flex;
gap:10px;
margin:20px 0;
flex-wrap:wrap;
"><a
href="produk.html"
class="btn-primary">

🛒 Belanja Lagi

</a><button
id="hapusSemua"
class="btn-secondary">

🗑️ Hapus Semua

</button></div><div
id="favoritContainer"
class="product-grid">
</div></section><script>

const favorit =
JSON.parse(
localStorage.getItem("favorit")
) || [];

const container =
document.getElementById(
"favoritContainer"
);

document.getElementById(
"totalFavorit"
).innerText =
favorit.length;

if(favorit.length === 0){

container.innerHTML = `

<div class="dashboard-card">

<h2>❤️ Belum Ada Favorit</h2>

<p>
Produk yang Anda simpan akan muncul di sini.
</p>

<br>

<a
href="produk.html"
class="btn-primary">

Mulai Belanja

</a>

</div>

`;

}

favorit.forEach((produk)=>{

container.innerHTML += `

<div class="product-card">

<img
src="${
produk.gambar ||
'https://picsum.photos/400/300'
}"
alt="${produk.namaProduk}">

<div class="product-info">

<h3>
${produk.namaProduk}
</h3>

<p class="price">
Rp ${Number(
produk.harga || 0
).toLocaleString("id-ID")}
</p>

<div style="
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
">

<a
href="produk-detail.html?id=${produk.id}"
class="btn-primary">

Lihat Detail

</a>

<button
onclick="hapusFavorit('${produk.id}')"
class="btn-secondary">

Hapus

</button>

</div>

</div>

</div>

`;

});

window.hapusFavorit = function(id){

let favorit =
JSON.parse(
localStorage.getItem("favorit")
) || [];

favorit =
favorit.filter(
(item)=>item.id !== id
);

localStorage.setItem(
"favorit",
JSON.stringify(favorit)
);

location.reload();

};

document
.getElementById("hapusSemua")
.addEventListener("click",()=>{

if(
confirm(
"Hapus semua produk favorit?"
)
){

localStorage.removeItem(
"favorit"
);

location.reload();

}

});

</script></body>
</html>
