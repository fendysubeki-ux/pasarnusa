<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorit Saya - PasarNusa</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Stylesheet utama PasarNusa -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ──────────────────────────────────────────
       Toolbar aksi (Belanja Lagi / Keranjang / Hapus Semua)
    ────────────────────────────────────────── */
    .action-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    /* ──────────────────────────────────────────
       Tombol aksi per kartu produk
    ────────────────────────────────────────── */
    .product-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    /* ──────────────────────────────────────────
       Kartu kosong (empty state)
    ────────────────────────────────────────── */
    .empty-state {
      grid-column: 1 / -1; /* Rentangkan seluruh kolom grid */
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- ════════════════════════════════════════
       HALAMAN FAVORIT
  ════════════════════════════════════════ -->
  <section class="dashboard">

    <!-- Header halaman -->
    <div class="dashboard-header">
      <div>
        <h1>❤️ Favorit Saya</h1>
        <p>Produk yang Anda simpan</p>
      </div>
      <a href="dashboard-user.html" class="btn-secondary">⬅ Dashboard</a>
    </div>

    <!-- Statistik ringkas -->
    <div class="dashboard-grid">
      <div class="dashboard-card">
        <h3 id="totalFavorit">0</h3>
        <p>Total Produk Favorit</p>
      </div>
      <div class="dashboard-card">
        <h3>⭐</h3>
        <p>Simpan produk untuk dibeli nanti</p>
      </div>
    </div>

    <!-- Toolbar aksi utama -->
    <div class="action-toolbar">
      <a href="index.html" class="btn-primary">🛍 Belanja Lagi</a>
      <a href="cart.html" class="btn-secondary">🛒 Keranjang</a>
      <button id="hapusSemua" class="btn-secondary">🗑 Hapus Semua</button>
    </div>

    <!-- Grid produk favorit — diisi oleh JS -->
    <div id="favoritContainer" class="product-grid"></div>

  </section>

  <script>
    /* ══════════════════════════════════════════
       GUARD: Arahkan ke login jika belum masuk
    ══════════════════════════════════════════ */
    if (!localStorage.getItem("uid")) {
      window.location.href = "login.html";
    }

    /* ══════════════════════════════════════════
       STATE: Muat data favorit dari localStorage
    ══════════════════════════════════════════ */
    let favorit = JSON.parse(localStorage.getItem("favorit")) || [];

    /* Simpan referensi elemen yang sering dipakai */
    const container     = document.getElementById("favoritContainer");
    const elTotal       = document.getElementById("totalFavorit");
    const btnHapusSemua = document.getElementById("hapusSemua");

    /* Tampilkan total awal */
    elTotal.textContent = favorit.length;

    /* Render pertama kali */
    renderFavorit();

    /* ══════════════════════════════════════════
       RENDER: Tampilkan daftar produk favorit
    ══════════════════════════════════════════ */
    function renderFavorit() {
      container.innerHTML = "";

      /* Empty state */
      if (favorit.length === 0) {
        container.innerHTML = `
          <div class="dashboard-card empty-state">
            <h2>❤️ Belum Ada Favorit</h2>
            <p>Produk favorit Anda akan muncul di sini.</p>
            <br />
            <a href="index.html" class="btn-primary">Mulai Belanja</a>
          </div>`;
        return;
      }

      /* Bangun semua kartu sekaligus, lalu masukkan ke DOM satu kali
         (menghindari reflow berulang akibat innerHTML +=) */
      const fragment = favorit
        .map((produk) => buatKartuProduk(produk))
        .join("");

      container.innerHTML = fragment;
    }

    /* ══════════════════════════════════════════
       HELPER: Buat markup HTML satu kartu produk
    ══════════════════════════════════════════ */
    function buatKartuProduk(produk) {
      /* Escape nilai dinamis untuk mencegah XSS */
      const nama   = escapeHtml(produk.namaProduk || "Produk");
      const gambar = escapeHtml(produk.gambar || "https://picsum.photos/400/300");
      const harga  = Number(produk.harga || 0).toLocaleString("id-ID");
      const id     = escapeHtml(String(produk.id));

      return `
        <div class="product-card">
          <img src="${gambar}" alt="${nama}" loading="lazy" />
          <div class="product-info">
            <h3>${nama}</h3>
            <p class="price">Rp ${harga}</p>
            <div class="product-actions">
              <a href="produk-detail.html?id=${id}" class="btn-primary">Lihat Detail</a>
              <button onclick="tambahKeranjang('${id}')" class="btn-primary">🛒 Keranjang</button>
              <button onclick="hapusFavorit('${id}')" class="btn-secondary">🗑 Hapus</button>
            </div>
          </div>
        </div>`;
    }

    /* ══════════════════════════════════════════
       HELPER: Escape karakter HTML (anti-XSS)
    ══════════════════════════════════════════ */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    /* ══════════════════════════════════════════
       HELPER: Simpan favorit ke localStorage &
               perbarui tampilan counter
    ══════════════════════════════════════════ */
    function simpanFavorit() {
      localStorage.setItem("favorit", JSON.stringify(favorit));
      elTotal.textContent = favorit.length;
    }

    /* ══════════════════════════════════════════
       AKSI: Hapus satu produk dari favorit
    ══════════════════════════════════════════ */
    window.hapusFavorit = function (id) {
      favorit = favorit.filter((item) => String(item.id) !== id);
      simpanFavorit();
      renderFavorit();
    };

    /* ══════════════════════════════════════════
       AKSI: Tambah produk ke keranjang
    ══════════════════════════════════════════ */
    window.tambahKeranjang = function (id) {
      const produk = favorit.find((item) => String(item.id) === id);
      if (!produk) return;

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      const existing = cart.find((item) => String(item.id) === id);
      if (existing) {
        /* Produk sudah ada — tambah jumlah */
        existing.qty += 1;
      } else {
        /* Produk baru — masukkan dengan qty 1 */
        cart.push({
          id:         produk.id,
          uid:        produk.uid || "",
          namaProduk: produk.namaProduk,
          harga:      produk.harga,
          gambar:     produk.gambar,
          kategori:   produk.kategori || "",
          qty:        1,
        });
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      alert("Produk berhasil masuk keranjang.");
    };

    /* ══════════════════════════════════════════
       AKSI: Hapus semua produk favorit
    ══════════════════════════════════════════ */
    btnHapusSemua.addEventListener("click", () => {
      if (!confirm("Hapus semua produk favorit?")) return;

      localStorage.removeItem("favorit");
      favorit = [];
      simpanFavorit();
      renderFavorit();
    });
  </script>
</body>

</html>
