<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengaturan Toko - PasarNusa</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Stylesheet utama PasarNusa -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section class="dashboard">

    <!-- Header halaman -->
    <div class="dashboard-header">
      <div>
        <h1>⚙️ Pengaturan Toko</h1>
        <p>Kelola profil dan pengaturan akun UMKM</p>
      </div>
      <a href="dashboard-umkm.html" class="btn-secondary">⬅️ Dashboard</a>
    </div>

    <!-- Form informasi toko -->
    <div class="form-card">
      <h2>🏪 Informasi Toko</h2>

      <label for="namaUmkm">Nama Toko</label>
      <input type="text" id="namaUmkm" placeholder="Nama Toko" />

      <label for="deskripsi">Deskripsi</label>
      <textarea id="deskripsi" rows="5" placeholder="Deskripsi toko"></textarea>

      <label for="whatsapp">WhatsApp</label>
      <input type="tel" id="whatsapp" placeholder="08123456789" />

      <label for="logo">Logo Toko</label>
      <input type="url" id="logo" placeholder="https://..." />

      <label for="banner">Banner Toko</label>
      <input type="url" id="banner" placeholder="https://..." />

      <button id="simpanBtn" class="btn-primary">💾 Simpan Perubahan</button>
    </div>

    <!-- Kartu aksi: keamanan & reset data -->
    <div class="dashboard-grid">

      <div class="dashboard-card">
        <h3>🔐 Keamanan</h3>
        <p>Keluar dari akun PasarNusa.</p>
        <button id="logoutBtn" class="btn-secondary">🚪 Logout</button>
      </div>

      <div class="dashboard-card">
        <h3>🗑 Reset Data Lokal</h3>
        <p>Menghapus cache browser.</p>
        <button id="resetBtn" class="btn-secondary">Hapus Cache</button>
      </div>

    </div>
  </section>

  <script type="module">
    // ─── Import Firebase SDK ───────────────────────────────────────────────────
    import { initializeApp }    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    // ─── Konfigurasi Firebase ──────────────────────────────────────────────────
    const firebaseConfig = {
      apiKey:            "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
      authDomain:        "pasarnusa-18aa0.firebaseapp.com",
      projectId:         "pasarnusa-18aa0",
      storageBucket:     "pasarnusa-18aa0.firebasestorage.app",
      messagingSenderId: "866998011671",
      appId:             "1:866998011671:web:5555115feb82741ab55952"
    };

    // ─── Inisialisasi Firebase ─────────────────────────────────────────────────
    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    // Tunggu sampai status autentikasi siap, lalu cek sesi
    await auth.authStateReady();
    if (!auth.currentUser) {
      window.location.href = "login.html";
    }

    const uid = auth.currentUser.uid;

    // ─── Helper: ambil elemen input berdasarkan ID ─────────────────────────────
    const field = (id) => document.getElementById(id);

    // ─── Muat data toko dari Firestore ─────────────────────────────────────────
    try {
      const snap = await getDoc(doc(db, "umkm", uid));
      if (snap.exists()) {
        const toko = snap.data();
        field("namaUmkm").value = toko.namaUmkm  || "";
        field("deskripsi").value = toko.deskripsi || "";
        field("whatsapp").value  = toko.whatsapp  || "";
        field("logo").value      = toko.logo      || "";
        field("banner").value    = toko.banner    || "";
      }
    } catch (err) {
      console.error("Gagal memuat data toko:", err);
    }

    // ─── Simpan perubahan ke Firestore ─────────────────────────────────────────
    field("simpanBtn").addEventListener("click", async () => {
      try {
        await updateDoc(doc(db, "umkm", uid), {
          namaUmkm:  field("namaUmkm").value,
          deskripsi: field("deskripsi").value,
          whatsapp:  field("whatsapp").value,
          logo:      field("logo").value,
          banner:    field("banner").value,
        });
        alert("Pengaturan berhasil disimpan.");
      } catch (err) {
        console.error("Gagal menyimpan pengaturan:", err);
        alert("Gagal menyimpan. Coba lagi.");
      }
    });

    // ─── Logout ────────────────────────────────────────────────────────────────
    field("logoutBtn").addEventListener("click", async () => {
      if (!confirm("Yakin ingin logout?")) return;
      await signOut(auth);
      localStorage.clear();
      window.location.href = "login.html";
    });

    // ─── Hapus cache lokal ─────────────────────────────────────────────────────
    field("resetBtn").addEventListener("click", () => {
      if (!confirm("Hapus semua cache lokal?")) return;
      localStorage.clear();
      alert("Cache berhasil dihapus.");
      location.reload();
    });
  </script>
</body>
</html>
