<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Jelajahi Desa - PasarNusa</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>

<h1>🏘 Jelajahi Desa</h1>

<p>

Temukan UMKM terbaik dari berbagai desa di Indonesia.

</p>

</div>

<a
href="index.html"
class="btn-secondary">

🏠 Beranda

</a>

</div>

</section>

<section class="dashboard">

<input

type="text"

id="searchDesa"

class="search-box"

placeholder="Cari nama desa...">

</section>

<section class="dashboard">

<div
id="desaContainer"
class="dashboard-grid">

<div class="dashboard-card">

Memuat daftar desa...

</div>

</div>

</section>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const container=
document.getElementById(
"desaContainer"
);

let semuaDesa=[];

async function loadDesa(){

container.innerHTML=
"<p>Memuat daftar desa...</p>";

const desaSnap=
await getDocs(
collection(db,"desa")
);

const produkSnap=
await getDocs(
collection(db,"produk")
);

semuaDesa=[];

desaSnap.forEach((docSnap)=>{

const data=
docSnap.data();

let jumlahProduk=0;

const umkm=new Set();

produkSnap.forEach((produkDoc)=>{

const produk=
produkDoc.data();

if(produk.desa===data.nama){

jumlahProduk++;

if(produk.uidUmkm){

umkm.add(produk.uidUmkm);

}

}

});

semuaDesa.push({

id:docSnap.id,

...data,

jumlahProduk,

jumlahUmkm:umkm.size

});

});

renderDesa();

}
function renderDesa(){

const keyword=
document.getElementById(
"searchDesa"
).value.toLowerCase();

container.innerHTML="";

const hasil=
semuaDesa.filter((desa)=>{

return(
(desa.nama||"")
.toLowerCase()
.includes(keyword)
);

});

if(hasil.length===0){

container.innerHTML=`

<div class="dashboard-card">

<h3>

Desa tidak ditemukan

</h3>

<p>

Coba gunakan kata kunci lain.

</p>

</div>

`;

return;

}

hasil.forEach((desa)=>{

container.innerHTML+=`

<div class="dashboard-card">

<img
src="${desa.banner||'https://placehold.co/600x300'}"
style="
width:100%;
height:180px;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;
">

<h3>

🏞 ${desa.nama}

</h3>

<p>

📍 ${desa.kecamatan||"-"}, ${desa.kabupaten||"-"}

</p>

<p>

🏪 ${desa.jumlahUmkm} UMKM

</p>

<p>

🛍 ${desa.jumlahProduk} Produk

</p>

<p>

${(desa.deskripsi||"-").substring(0,120)}...

</p>

<a
href="desa.html?desa=${encodeURIComponent(desa.nama)}"
class="btn-primary"
style="
display:block;
text-align:center;
margin-top:15px;
">

🚀 Jelajahi Desa

</a>

</div>

`;

});

}
document
.getElementById("searchDesa")
.addEventListener(
"input",
renderDesa
);

loadDesa();

</script>

</body>

</html>
