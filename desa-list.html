<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jelajahi Desa - PasarNusa</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    /* ─── Kartu Desa ─────────────────────────────────────── */
    .desa-banner {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
      /* Cegah layout shift saat gambar belum dimuat */
      background-color: #f0f0f0;
    }

    .desa-meta {
      margin: 4px 0;
    }

    .desa-desc {
      margin-top: 8px;
      color: #555;
      /* Tampilkan deskripsi maksimal 3 baris */
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-desa {
      display: block;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <!-- ─── Header Halaman ──────────────────────────────────── -->
  <section class="dashboard">
    <div class="dashboard-header">
      <div>
        <h1>🏘 Jelajahi Desa</h1>
        <p>Temukan UMKM terbaik dari berbagai desa di Indonesia.</p>
      </div>
      <a href="index.html" class="btn-secondary">🏠 Beranda</a>
    </div>
  </section>

  <!-- ─── Kotak Pencarian ─────────────────────────────────── -->
  <section class="dashboard">
    <input
      type="search"
      id="searchDesa"
      class="search-box"
      placeholder="Cari nama desa..."
      aria-label="Cari nama desa"
    >
  </section>

  <!-- ─── Grid Daftar Desa ────────────────────────────────── -->
  <section class="dashboard">
    <div id="desaContainer" class="dashboard-grid" aria-live="polite">
      <div class="dashboard-card">Memuat daftar desa...</div>
    </div>
  </section>

  <!-- ─── Firebase & Logika Utama ────────────────────────── -->
  <script type="module">
    import { initializeApp }   from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    // ── Konfigurasi Firebase ──────────────────────────────
    const firebaseConfig = {
      apiKey:            "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
      authDomain:        "pasarnusa-18aa0.firebaseapp.com",
      projectId:         "pasarnusa-18aa0",
      storageBucket:     "pasarnusa-18aa0.firebasestorage.app",
      messagingSenderId: "866998011671",
      appId:             "1:866998011671:web:5555115feb82741ab55952",
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    // ── Elemen DOM ────────────────────────────────────────
    const container  = document.getElementById("desaContainer");
    const searchInput = document.getElementById("searchDesa");

    // Cache semua data desa (diisi satu kali saat halaman dimuat)
    let semuaDesa = [];

    // ── Muat Data dari Firestore ──────────────────────────
    async function loadDesa() {
      container.innerHTML = "<div class='dashboard-card'>Memuat daftar desa...</div>";

      try {
        // Ambil koleksi desa & produk secara paralel untuk efisiensi
        const [desaSnap, produkSnap] = await Promise.all([
          getDocs(collection(db, "desa")),
          getDocs(collection(db, "produk")),
        ]);

        // Buat peta: nama desa → { jumlahProduk, setUmkm }
        // agar penghitungan O(n) bukan O(n²)
        const statPerDesa = new Map();

        produkSnap.forEach((doc) => {
          const p = doc.data();
          if (!p.desa) return;

          if (!statPerDesa.has(p.desa)) {
            statPerDesa.set(p.desa, { jumlahProduk: 0, umkmSet: new Set() });
          }

          const stat = statPerDesa.get(p.desa);
          stat.jumlahProduk++;
          if (p.uidUmkm) stat.umkmSet.add(p.uidUmkm);
        });

        // Gabungkan data desa dengan statistiknya
        semuaDesa = desaSnap.docs.map((doc) => {
          const data = doc.data();
          const stat = statPerDesa.get(data.nama) ?? { jumlahProduk: 0, umkmSet: new Set() };
          return {
            id: doc.id,
            ...data,
            jumlahProduk: stat.jumlahProduk,
            jumlahUmkm:   stat.umkmSet.size,
          };
        });

        renderDesa();
      } catch (err) {
        // Tampilkan pesan error yang informatif kepada pengguna
        console.error("Gagal memuat data desa:", err);
        container.innerHTML = `
          <div class="dashboard-card">
            <h3>Gagal memuat desa</h3>
            <p>Periksa koneksi internet Anda, lalu muat ulang halaman.</p>
          </div>`;
      }
    }

    // ── Render / Filter Kartu Desa ────────────────────────
    function renderDesa() {
      const keyword = searchInput.value.trim().toLowerCase();

      // Filter berdasarkan kata kunci pencarian
      const hasil = semuaDesa.filter((desa) =>
        (desa.nama ?? "").toLowerCase().includes(keyword)
      );

      // Kondisi: tidak ada hasil
      if (hasil.length === 0) {
        container.innerHTML = `
          <div class="dashboard-card">
            <h3>Desa tidak ditemukan</h3>
            <p>Coba gunakan kata kunci lain.</p>
          </div>`;
        return;
      }

      // Bangun semua kartu sekaligus dengan DocumentFragment
      // untuk meminimalkan reflow DOM
      const fragment = document.createDocumentFragment();

      hasil.forEach((desa) => {
        // Potong deskripsi di sisi JS sebagai fallback untuk browser lama
        const deskripsi = (desa.deskripsi ?? "-").substring(0, 150);

        const card = document.createElement("div");
        card.className = "dashboard-card";

        // Gunakan innerHTML hanya setelah nilai di-escape untuk keamanan XSS
        card.innerHTML = `
          <img
            class="desa-banner"
            src="${escHtml(desa.banner ?? "https://placehold.co/600x300")}"
            alt="Banner desa ${escHtml(desa.nama ?? "")}"
            loading="lazy"
          >
          <h3>🏞 ${escHtml(desa.nama ?? "-")}</h3>
          <p class="desa-meta">📍 ${escHtml(desa.kecamatan ?? "-")}, ${escHtml(desa.kabupaten ?? "-")}</p>
          <p class="desa-meta">🏪 ${desa.jumlahUmkm} UMKM</p>
          <p class="desa-meta">🛍 ${desa.jumlahProduk} Produk</p>
          <p class="desa-desc">${escHtml(deskripsi)}${desa.deskripsi && desa.deskripsi.length > 150 ? "…" : ""}</p>
          <a
            href="desa.html?desa=${encodeURIComponent(desa.nama ?? "")}"
            class="btn-primary btn-desa"
          >
            🚀 Jelajahi Desa
          </a>`;

        fragment.appendChild(card);
      });

      container.innerHTML = "";
      container.appendChild(fragment);
    }

    // ── Utilitas: Escape HTML untuk cegah XSS ────────────
    function escHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ── Event Listener Pencarian ──────────────────────────
    searchInput.addEventListener("input", renderDesa);

    // ── Muat Data Pertama Kali ────────────────────────────
    loadDesa();
  </script>

</body>
</html>
