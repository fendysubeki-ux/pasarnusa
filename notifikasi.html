<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifikasi - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>
<h1>🔔 Pusat Notifikasi</h1>
<p>Semua aktivitas akun Anda</p>
</div>

<a href="dashboard-umkm.html" class="btn-secondary">
⬅ Dashboard
</a>

</div>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3 id="totalNotif">0</h3>
<p>Total Notifikasi</p>
</div>

<div class="dashboard-card">
<h3 id="belumDibaca">0</h3>
<p>Belum Dibaca</p>
</div>

<div class="dashboard-card">
<h3 id="notifPesanan">0</h3>
<p>Pesanan</p>
</div>

<div class="dashboard-card">
<h3 id="notifAffiliate">0</h3>
<p>Affiliate</p>
</div>

<div class="dashboard-card">
<h3 id="notifUmkm">0</h3>
<p>UMKM</p>
</div>

</div>

<br>

<input
type="text"
id="searchNotif"
class="search-box"
placeholder="Cari notifikasi...">

<br><br>

<div style="display:flex;gap:10px;flex-wrap:wrap;">

<button id="btnBacaSemua" class="btn-primary">
✓ Tandai Semua Dibaca
</button>

<button id="btnRefresh" class="btn-secondary">
🔄 Refresh
</button>

</div>

<br>

<div id="notifContainer" class="dashboard-grid">

<div class="dashboard-card">
<h3>Memuat Notifikasi...</h3>
<p>Mohon tunggu sebentar</p>
</div>

</div>

</section>

<script type="module" src="notifikasi.js"></script>

</body>
</html>
