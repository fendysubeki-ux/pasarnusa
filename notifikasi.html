<!DOCTYPE html><html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notifikasi - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><section class="dashboard"><div class="dashboard-header"><div>
<h1>🔔 Pusat Notifikasi</h1>
<p>Semua aktivitas akun Anda</p>
</div><a href="dashboard-umkm.html"
class="btn-secondary">
⬅️ Dashboard
</a>

</div><div class="dashboard-grid"><div class="dashboard-card">
<h3 id="totalNotif">0</h3>
<p>Total Notifikasi</p>
</div><div class="dashboard-card">
<h3 id="belumDibaca">0</h3>
<p>Belum Dibaca</p>
</div><div class="dashboard-card">
<h3 id="notifPesanan">0</h3>
<p>Pesanan</p>
</div><div class="dashboard-card">
<h3 id="notifAffiliate">0</h3>
<p>Affiliate</p>
</div></div><br><input
type="text"
id="searchNotif"
class="search-box"
placeholder="Cari notifikasi...">

<br><br>

<button
id="btnBacaSemua"
class="btn-primary">

✓ Tandai Semua Dibaca

</button><br><br>

<div
id="notifContainer"
class="dashboard-grid"><div class="dashboard-card"><p>Memuat notifikasi...</p></div></div></section><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

}

const uid =
auth.currentUser.uid;

const container =
document.getElementById(
"notifContainer"
);

let notifDocs = [];

async function loadNotif(){

container.innerHTML = "";

const snapshot =
await getDocs(
query(
collection(db,"notifikasi"),
where("uid","==",uid)
)
);

let total = 0;
let unread = 0;
let pesanan = 0;
let affiliate = 0;

notifDocs = [];

snapshot.forEach((item)=>{

notifDocs.push(item);

const data = item.data();

total++;

if(!data.dibaca){
unread++;
}

if(data.kategori === "Pesanan"){
pesanan++;
}

if(data.kategori === "Affiliate"){
affiliate++;
}

});

document.getElementById(
"totalNotif"
).innerText =
total;

document.getElementById(
"belumDibaca"
).innerText =
unread;

document.getElementById(
"notifPesanan"
).innerText =
pesanan;

document.getElementById(
"notifAffiliate"
).innerText =
affiliate;

renderNotif();

}

function renderNotif(){

const keyword =
document.getElementById(
"searchNotif"
).value.toLowerCase();

container.innerHTML = "";

const hasil =
notifDocs.filter((item)=>{

const data =
item.data();

return (
(data.judul || "") +
(data.pesan || "")
)
.toLowerCase()
.includes(keyword);

});

if(hasil.length === 0){

container.innerHTML = `

<div class="dashboard-card">

<h3>
📭 Tidak Ada Notifikasi
</h3>

</div>

`;

return;

}

hasil.forEach((item)=>{

const data =
item.data();

container.innerHTML += `

<div class="dashboard-card">

<h3>

${data.judul || "Notifikasi"}

</h3>

<p>

${data.pesan || ""}

</p>

<br>

<small>

${data.createdAt?.seconds
?
new Date(
data.createdAt.seconds*1000
).toLocaleString("id-ID")
:
"-"}

</small>

<br><br>

<span>

${data.dibaca
? "✅ Sudah Dibaca"
: "🟡 Belum Dibaca"}

</span>

</div>

`;

});

}

document
.getElementById(
"searchNotif"
)
.addEventListener(
"input",
renderNotif
);

document
.getElementById(
"btnBacaSemua"
)
.addEventListener(
"click",
async()=>{

for(const item of notifDocs){

await updateDoc(
doc(
db,
"notifikasi",
item.id
),
{
dibaca:true
}
);

}

alert(
"Semua notifikasi ditandai dibaca"
);

loadNotif();

}
);

loadNotif();

</script></body>
</html>
