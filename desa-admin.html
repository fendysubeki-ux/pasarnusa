<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Kelola Desa</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>

<h1>

🏘 Kelola Desa

</h1>

<p>

Kelola seluruh desa di PasarNusa

</p>

</div>

<div style="
display:flex;
gap:10px;
flex-wrap:wrap;
">

<a
href="dashboard-admin.html"
class="btn-secondary">

⬅ Dashboard

</a>

<button
onclick="location.reload()"
class="btn-primary">

🔄 Refresh

</button>

</div>

</div>

</section>

<section class="dashboard">

<div class="dashboard-grid">

<div class="dashboard-card">

<h3 id="totalDesa">

0

</h3>

<p>Total Desa</p>

</div>

<div class="dashboard-card">

<h3 id="totalUmkm">

0

</h3>

<p>Total UMKM</p>

</div>

<div class="dashboard-card">

<h3 id="totalProduk">

0

</h3>

<p>Total Produk</p>

</div>

</div>

</section>

<section class="dashboard">

<input

id="searchDesa"

class="search-box"

placeholder="Cari desa...">

<br><br>

<button
onclick="bukaTambahDesa()"
class="btn-primary">

➕ Tambah Desa

</button>

</section>

<section class="dashboard">

<div
id="desaContainer"
class="dashboard-grid">

<div class="dashboard-card">

Memuat data desa...

</div>

</div>

</section>
<div id="desaModal" class="modal" style="display:none;">

<div class="modal-content">

<h2 id="modalTitle">

Tambah Desa

</h2>

<input
id="namaDesaInput"
class="search-box"
placeholder="Nama Desa">

<input
id="kecamatanInput"
class="search-box"
placeholder="Kecamatan">

<input
id="kabupatenInput"
class="search-box"
placeholder="Kabupaten">

<input
id="provinsiInput"
class="search-box"
placeholder="Provinsi">

<input
type="file"
id="bannerInput"
accept="image/*"
class="search-box">
  
<input
id="mapsInput"
class="search-box"
placeholder="Google Maps">

<textarea
id="deskripsiInput"
class="search-box"
placeholder="Deskripsi Desa"
style="height:120px;"></textarea>

<div style="display:flex;gap:10px;margin-top:20px;">

<button
id="simpanDesaBtn"
class="btn-primary">

💾 Simpan

</button>

<button
onclick="tutupModal()"
class="btn-secondary">

Batal

</button>

</div>

</div>

</div>
<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
doc,
getDoc,
deleteDoc,
addDoc,
updateDoc

}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig={

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href="login.html";

throw new Error("Belum login");

}

const adminSnap=
await getDoc(
doc(
db,
"users",
auth.currentUser.uid
)
);

if(
!adminSnap.exists()||
adminSnap.data().role!=="admin"
){

alert("Akses khusus Admin");

window.location.href="index.html";

throw new Error("Bukan Admin");

}

const container=
document.getElementById(
"desaContainer"
);

let semuaDesa=[];
let editId=null;
async function loadDesa(){

container.innerHTML=
"<p>Memuat data...</p>";

const [

desaSnap,
produkSnap,
usersSnap

]=await Promise.all([

getDocs(collection(db,"desa")),

getDocs(collection(db,"produk")),

getDocs(collection(db,"users"))

]);

semuaDesa=[];

let totalDesa=0;

let totalProduk=0;

let totalUmkm=0;

desaSnap.forEach((docSnap)=>{

const data=docSnap.data();

let jumlahProduk=0;

let jumlahUmkm=0;

produkSnap.forEach((produk)=>{

const p=produk.data();

if(p.desa===data.nama){

jumlahProduk++;

}

});

usersSnap.forEach((user)=>{

const u=user.data();

if(
u.role==="umkm"
&&
u.desa===data.nama
){

jumlahUmkm++;

}

});

totalDesa++;

totalProduk+=jumlahProduk;

totalUmkm+=jumlahUmkm;

semuaDesa.push({

id:docSnap.id,

...data,

jumlahProduk,

jumlahUmkm

});

});

document.getElementById(
"totalDesa"
).innerText=
totalDesa;

document.getElementById(
"totalProduk"
).innerText=
totalProduk;

document.getElementById(
"totalUmkm"
).innerText=
totalUmkm;

renderDesa();

}
function renderDesa(){

const keyword=
document.getElementById(
"searchDesa"
).value.toLowerCase();

container.innerHTML="";

const hasil=
semuaDesa.filter((desa)=>{

return(
(desa.nama||"")
.toLowerCase()
.includes(keyword)
||
(desa.kecamatan||"")
.toLowerCase()
.includes(keyword)
||
(desa.kabupaten||"")
.toLowerCase()
.includes(keyword)
);

});

if(hasil.length===0){

container.innerHTML=`

<div class="dashboard-card">

<h3>

Desa Tidak Ditemukan

</h3>

<p>

Tidak ada data yang sesuai.

</p>

</div>

`;

return;

}

hasil.forEach((desa)=>{

container.innerHTML+=`

<div class="dashboard-card">

<img
src="${desa.banner||'https://placehold.co/600x300'}"
style="
width:100%;
height:180px;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;
">

<h3>

🏘 ${desa.nama}

</h3>

<p>

📍 ${desa.kecamatan},
${desa.kabupaten}

</p>

<p>

🏪 ${desa.jumlahUmkm} UMKM

</p>

<p>

🛍 ${desa.jumlahProduk} Produk

</p>

<p>

${(desa.deskripsi||"-")
.substring(0,100)}...

</p>

<div style="
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
">

<a
href="desa.html?desa=${encodeURIComponent(desa.nama)}"
class="btn-primary">

👁 Lihat

</a>

<button
class="btn-secondary"
onclick="editDesa('${desa.id}')">

✏ Edit

</button>

<button
class="btn-secondary"
onclick="hapusDesa('${desa.id}')">

🗑 Hapus

</button>

</div>

</div>

`;

});

}
window.hapusDesa = async(id)=>{

if(
!confirm(
"Yakin ingin menghapus desa ini?"
)
){

return;

}

try{

await deleteDoc(
doc(db,"desa",id)
);

alert(
"Desa berhasil dihapus."
);

await loadDesa();

}
catch(error){

console.error(error);

alert(error.message);

}

};

document
.getElementById("searchDesa")
.addEventListener(
"input",
renderDesa
);

loadDesa();
window.bukaTambahDesa=()=>{

editId=null;

document.getElementById("modalTitle").innerText=
"Tambah Desa";

document.getElementById("namaDesaInput").value="";

document.getElementById("kecamatanInput").value="";

document.getElementById("kabupatenInput").value="";

document.getElementById("provinsiInput").value="";

document.getElementById("bannerInput").value="";

document.getElementById("mapsInput").value="";

document.getElementById("deskripsiInput").value="";

document.getElementById("desaModal").style.display=
"flex";

};

window.tutupModal=()=>{

document.getElementById("desaModal").style.display=
"none";

};

window.editDesa=(id)=>{

const desa=
semuaDesa.find(item=>item.id===id);

if(!desa)return;

editId=id;

document.getElementById("modalTitle").innerText=
"Edit Desa";

document.getElementById("namaDesaInput").value=
desa.nama||"";

document.getElementById("kecamatanInput").value=
desa.kecamatan||"";

document.getElementById("kabupatenInput").value=
desa.kabupaten||"";

document.getElementById("provinsiInput").value=
desa.provinsi||"";

document.getElementById("bannerInput").value=
desa.banner||"";

document.getElementById("mapsInput").value=
desa.maps||"";

document.getElementById("deskripsiInput").value=
desa.deskripsi||"";

document.getElementById("desaModal").style.display=
"flex";

};

document
.getElementById("simpanDesaBtn")
.addEventListener(
"click",
async()=>{

const data={

nama:
document.getElementById("namaDesaInput").value,

kecamatan:
document.getElementById("kecamatanInput").value,

kabupaten:
document.getElementById("kabupatenInput").value,

provinsi:
document.getElementById("provinsiInput").value,

banner:
document.getElementById("bannerInput").value,

maps:
document.getElementById("mapsInput").value,

deskripsi:
document.getElementById("deskripsiInput").value

};

try{

if(editId){

await updateDoc(
doc(db,"desa",editId),
data
);

}else{

await addDoc(
collection(db,"desa"),
data
);

}

alert(
"Data desa berhasil disimpan."
);

tutupModal();

loadDesa();

}
catch(error){

console.error(error);

alert(error.message);

}

});
</script>
</body>
</html>
