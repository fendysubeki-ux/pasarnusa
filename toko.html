<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Toko UMKM - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<meta name="description" content="Profil UMKM PasarNusa">

</head>
<body>

<section class="shop-header">

<img
id="bannerToko"
src="https://picsum.photos/1200/350"
class="shop-banner-img"
alt="Banner Toko">

<div class="shop-profile">

<img
id="logoToko"
src="https://picsum.photos/200"
class="shop-logo"
alt="Logo Toko">

<h1 id="namaToko">
Memuat Toko...
</h1>

<p id="deskripsiToko">
Memuat informasi toko...
</p>

<div class="shop-badges">

<span>
⭐ <span id="ratingMini">0</span>
</span>

<span>
🔥 <span id="totalTerjualMini">0</span> Terjual
</span>

</div>

<div class="shop-actions">

<a
id="waToko"
target="_blank"
class="btn-primary">

💬 WhatsApp

</a>

<button
id="shareToko"
class="btn-secondary">

📤 Bagikan

</button>

<a
href="produk.html"
class="btn-secondary">

🛍 Produk

</a>

<a
href="index.html"
class="btn-secondary">

🏠 Beranda

</a>

</div>

</div>

</section>

<section class="dashboard">

<div class="dashboard-grid">

<div class="dashboard-card">

<h3 id="totalProduk">0</h3>

<p>Total Produk</p>

</div>

<div class="dashboard-card">

<h3 id="produkAktif">0</h3>

<p>Produk Aktif</p>

</div>

<div class="dashboard-card">

<h3 id="totalTerjual">0</h3>

<p>Total Terjual</p>

</div>

<div class="dashboard-card">

<h3 id="ratingToko">0</h3>

<p>Rating Toko</p>

</div>

</div>

</section>

<section class="dashboard">

<h2>ℹ️ Informasi Toko</h2>

<div class="dashboard-grid">

<div class="dashboard-card">

<h3>📍 Alamat</h3>

<p id="alamatToko">-</p>

</div>

<div class="dashboard-card">

<h3>📱 WhatsApp</h3>

<p id="nomorToko">-</p>

</div>

<div class="dashboard-card">

<h3>📅 Bergabung</h3>

<p id="tanggalGabung">-</p>

</div>

</div>

</section>

<section class="products">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:20px;
">

<h2>🛍 Produk Toko</h2>

<input
type="text"
id="searchProduk"
placeholder="Cari produk..."
class="search-box">

</div>

<div
id="tokoContainer"
class="product-grid">

<div class="dashboard-card">

<h3>Memuat Produk...</h3>

<p>Mohon tunggu...</p>

</div>

</div>

</section>

<footer>

<div class="copyright">

© 2026 PasarNusa

</div>

</footer>

<script type="module" src="toko.js"></script>

</body>
</html>
