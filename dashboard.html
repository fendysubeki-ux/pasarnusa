<!DOCTYPE html>
<html>
<head>
<title>Dashboard UMKM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Daftar UMKM</h2>

<div id="umkmList"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain: "pasarnusa-18aa0.firebaseapp.com",
projectId: "pasarnusa-18aa0",
storageBucket: "pasarnusa-18aa0.firebasestorage.app",
messagingSenderId: "866998011671",
appId: "1:866998011671:web:5555115feb82741ab55952",
measurementId: "G-Q861Y1J3RJ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("umkmList");

const querySnapshot = await getDocs(collection(db,"umkm"));

querySnapshot.forEach((doc)=>{

const data = doc.data();

list.innerHTML += `
<div class="card">
<h3>${data.namaUmkm}</h3>
<p>Pemilik : ${data.namaPemilik}</p>
<p>WA : ${data.whatsapp}</p>
<p>Kategori : ${data.kategori}</p>
<p>${data.deskripsi}</p>
</div>
`;

});

</script>

</body>
</html>
