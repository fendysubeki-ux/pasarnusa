<!DOCTYPE html>
<html>
<head>

<title>Keranjang Belanja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">
<link rel="stylesheet"
href="style.css">

</head>
<body>

<section class="cart-section">

<h1>Keranjang Belanja</h1>

<div id="cartContainer">

</div>

</section>

<script>

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

const cartContainer =
document.getElementById("cartContainer");

if(cart.length > 0){

let total = 0;

cart.forEach((produk,index)=>{

total += Number(produk.harga);

cartContainer.innerHTML += `

<div class="product-card">

<img
src="${produk.gambar || 'https://picsum.photos/400/300'}">

<div class="product-info">

<span class="category">
${produk.kategori || 'Produk'}
</span>

<h2>
${produk.namaProduk}
</h2>

<p class="price">
Rp ${Number(produk.harga)
.toLocaleString("id-ID")}
</p>

<p>
${produk.deskripsi}
</p>

<button
onclick="hapusItem(${index})"
class="btn-secondary">

Hapus

</button>

</div>

</div>

`;

});

cartContainer.innerHTML += `

<div class="cart-card">

<h2>
Total:
Rp ${total.toLocaleString("id-ID")}
</h2>

<a
href="checkout.html"
class="btn-primary">

Checkout

</a>

</div>

`;

}else{

cartContainer.innerHTML = `

<div class="cart-card">

<h2>
🛒 Keranjang Kosong
</h2>

<p>
Belum ada produk di keranjang.
</p>

</div>

`;

}

window.hapusItem = (index)=>{

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

location.reload();

};

</script>

</body>
</html>
