<!DOCTYPE html><html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Keranjang Belanja - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><div class="logo">
PASAR<span>NUSA</span>
</div><a
href="index.html"
class="btn-secondary">

🏠 Beranda

</a></header><section class="cart-section"><h1>🛒 Keranjang Belanja</h1><p>
Periksa kembali produk sebelum checkout.
</p><div id="cartContainer"></div></section><script>

let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

const cartContainer =
document.getElementById(
"cartContainer"
);

renderCart();

function renderCart(){

cartContainer.innerHTML = "";

if(cart.length === 0){

cartContainer.innerHTML = `

<div class="cart-card">

<h2>🛒 Keranjang Kosong</h2>

<p>
Belum ada produk di keranjang.
</p>

<br>

<a
href="index.html#produk"
class="btn-primary">

Mulai Belanja

</a>

</div>

`;

return;

}

let totalBelanja = 0;
let totalItem = 0;

cart.forEach((produk,index)=>{

const qty =
Number(produk.qty || 1);

const subtotal =
Number(produk.harga || 0)
* qty;

totalBelanja += subtotal;
totalItem += qty;

cartContainer.innerHTML += `

<div class="product-card">

<img
src="${
produk.gambar ||
'https://picsum.photos/400/300'
}"
alt="${produk.namaProduk}">

<div class="product-info">

<span class="category">
${produk.kategori || "Produk"}
</span>

<h3>
${produk.namaProduk}
</h3>

<p class="price">
Rp ${Number(
produk.harga || 0
).toLocaleString("id-ID")}
</p>

<p>
Jumlah :
<b>${qty}</b>
</p>

<p>
Subtotal :
<b>
Rp ${subtotal.toLocaleString("id-ID")}
</b>
</p>

<div
style="
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:10px;
">

<button
onclick="kurangiQty(${index})"
class="btn-secondary">

➖

</button>

<button
onclick="tambahQty(${index})"
class="btn-primary">

➕

</button>

<button
onclick="hapusItem(${index})"
class="btn-secondary">

🗑 Hapus

</button>

</div>

</div>

</div>

`;

});

const ongkir = 0;

cartContainer.innerHTML += `

<div class="cart-card">

<h3>
Total Produk : ${cart.length}
</h3>

<h3>
Total Item : ${totalItem}
</h3>
<p>
🏪 UMKM :
${cart[0]?.namaToko || "-"}
</p>
<p>
Subtotal :
Rp ${totalBelanja.toLocaleString("id-ID")}
</p>

<p>
Estimasi Ongkir :
Dihitung saat checkout
</p>

<hr>

<h2>Total Bayar</h2>

<h1>
Rp ${(totalBelanja + ongkir)
.toLocaleString("id-ID")}
</h1>

<p>
Termasuk estimasi ongkir
</p>

<br>

<div
style="
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
">

<a
href="index.html#produk"
class="btn-secondary">

🛍 Lanjut Belanja

</a>

<button
onclick="kosongkanKeranjang()"
class="btn-secondary">

🗑 Kosongkan

</button>

<button
onclick="cekCheckout()"
class="btn-primary">

💳 Checkout

</button>

</div>

</div>

`;

}

window.tambahQty = function(index){

cart[index].qty =
(cart[index].qty || 1) + 1;

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

};

window.kurangiQty = function(index){

if(
(cart[index].qty || 1) > 1
){

cart[index].qty--;

}else{

cart.splice(index,1);

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

};

window.hapusItem = function(index){

if(
confirm(
"Hapus produk ini?"
)
){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

}

};

window.kosongkanKeranjang =
function(){

if(
confirm(
"Kosongkan seluruh keranjang?"
)
){

localStorage.removeItem(
"cart"
);

cart = [];

renderCart();

}

};

window.cekCheckout =
function(){

const uid =
localStorage.getItem("uid");

if(!uid){

alert(
"Silakan login terlebih dahulu"
);

window.location.href =
"login.html";

return;

}

if(
cart.length > 0
){

const uidUmkm =
cart[0].uid;

const bedaUmkm =
cart.some(
(item)=>
item.uid !== uidUmkm
);

if(bedaUmkm){

alert(
"Saat ini checkout hanya mendukung produk dari 1 UMKM dalam 1 pesanan"
);

return;

}

}

window.location.href =
"checkout.html";

};

</script>
</body>
</html>
