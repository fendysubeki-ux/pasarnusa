<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Riwayat Komisi Affiliate - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="dashboard">

<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px;">

<div>
<h1 id="judulAffiliate">
💰 Riwayat Komisi Affiliate
</h1>
<p>
Pantau seluruh komisi referral Anda
</p>
</div>

<a href="dashboard-affiliate.html" class="btn-secondary">
← Dashboard Affiliate
</a>

</div>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3>Total Komisi</h3>
<h2 id="totalKomisi">
Rp 0
</h2>
</div>

<div class="dashboard-card">
<h3>Komisi Cair</h3>
<h2 id="komisiCair">
Rp 0
</h2>
</div>

<div class="dashboard-card">
<h3>Komisi Pending</h3>
<h2 id="komisiPending">
Rp 0
</h2>
</div>

<div class="dashboard-card">
<h3>Total Referral</h3>
<h2 id="totalReferral">
0
</h2>
</div>

</div>

<h2 style="margin-top:30px;">
Riwayat Komisi
</h2>

<div
id="komisiContainer"
class="dashboard-grid">

<div class="dashboard-card">
<p>Memuat data...</p>
</div>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_AUTH_DOMAIN",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_STORAGE_BUCKET",
messagingSenderId:"YOUR_MESSAGING_ID",
appId:"YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

}

const uid =
auth.currentUser.uid;

const userDoc =
await getDoc(
doc(
db,
"users",
uid
)
);

if(
!userDoc.exists() ||
userDoc.data().role !== "affiliate"
){

alert(
"Akses khusus Affiliate"
);

window.location.href =
"index.html";

throw new Error(
"Bukan Affiliate"
);

}

document.getElementById(
"judulAffiliate"
).innerText =
"💰 Komisi Affiliate " +
(
userDoc.data().namaAffiliate ||
userDoc.data().nama ||
"PasarNusa"
);

const container =
document.getElementById(
"komisiContainer"
);

container.innerHTML = "";

const snapshot =
await getDocs(
query(
collection(db,"pesanan"),
where(
"affiliate",
"==",
uid
)
)
);

let totalKomisi = 0;
let komisiCair = 0;
let komisiPending = 0;
let totalReferral = 0;

snapshot.forEach((item)=>{

const data = item.data();

const komisi =
Number(
data.komisiAffiliate || 0
);

totalKomisi += komisi;
totalReferral++;

if(
String(data.status)
.toLowerCase() ===
"selesai"
){

komisiCair += komisi;

}else{

komisiPending += komisi;

}

container.innerHTML += `

<div class="dashboard-card">

<h3>
Rp ${komisi.toLocaleString("id-ID")}
</h3>

<p>
👤 ${data.namaPembeli || "-"}
</p>

<p>
📦 ${data.status || "-"}
</p>

<p>
📅 ${
data.createdAt
?
new Date(
data.createdAt.seconds * 1000
).toLocaleDateString("id-ID")
:
"-"
}
</p>

</div>

`;

});

document.getElementById(
"totalKomisi"
).innerText =
"Rp " +
totalKomisi.toLocaleString("id-ID");

document.getElementById(
"komisiCair"
).innerText =
"Rp " +
komisiCair.toLocaleString("id-ID");

document.getElementById(
"komisiPending"
).innerText =
"Rp " +
komisiPending.toLocaleString("id-ID");

document.getElementById(
"totalReferral"
).innerText =
totalReferral;

if(snapshot.empty){

container.innerHTML = `

<div class="dashboard-card">

<h3>
Belum Ada Komisi
</h3>

<p>
Komisi affiliate akan muncul di sini setelah ada transaksi referral.
</p>

</div>

`;

}

</script>

</body>
</html>
