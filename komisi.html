<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Riwayat Komisi Affiliate - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>
<h1>💰 Riwayat Komisi Affiliate</h1>
<p>Pantau seluruh komisi referral Anda</p>
</div>

<a href="affiliate-dashboard.html" class="btn-secondary">
⬅ Dashboard Affiliate
</a>

</div>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3>Total Komisi</h3>
<h2 id="totalKomisi">Rp 0</h2>
</div>

<div class="dashboard-card">
<h3>Komisi Cair</h3>
<h2 id="komisiCair">Rp 0</h2>
</div>

<div class="dashboard-card">
<h3>Komisi Pending</h3>
<h2 id="komisiPending">Rp 0</h2>
</div>

<div class="dashboard-card">
<h3>Total Referral</h3>
<h2 id="totalReferral">0</h2>
</div>

</div>

<h2 style="margin-top:30px;">
📋 Riwayat Komisi
</h2>

<div id="komisiContainer" class="dashboard-grid">

<div class="dashboard-card">
<p>Memuat data...</p>
</div>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="login.html";
return;

}

const uid = user.uid;

const userDoc = await getDoc(
doc(db,"users",uid)
);

if(
!userDoc.exists() ||
userDoc.data().role !== "affiliate"
){

alert("Akses khusus affiliate");

window.location.href="index.html";
return;

}

const container =
document.getElementById("komisiContainer");

container.innerHTML="";

let totalKomisi = 0;
let komisiCair = 0;
let komisiPending = 0;
let totalReferral = 0;

const snapshot = await getDocs(
query(
collection(db,"pesanan"),
where("affiliateUid","==",uid)
)
);

snapshot.forEach((docData)=>{

const data = docData.data();

const komisi =
Number(data.komisiAffiliate || 0);

totalKomisi += komisi;
totalReferral++;

if(
String(data.status).toLowerCase()
==="selesai"
){

komisiCair += komisi;

}else{

komisiPending += komisi;

}

container.innerHTML += `

<div class="dashboard-card">

<h3>
Rp ${komisi.toLocaleString("id-ID")}
</h3>

<p>
👤 ${data.namaPembeli || "-"}
</p>

<p>
📦 ${data.namaProduk || "-"}
</p>

<p>
<span class="
${String(data.status).toLowerCase()==='selesai'
? 'status-selesai'
: 'status-proses'}
">
${data.status}
</span>
</p>

<p>
📅 ${
data.createdAt?.seconds
?
new Date(
data.createdAt.seconds*1000
).toLocaleDateString("id-ID")
:
"-"
}
</p>

</div>

`;

});

document.getElementById("totalKomisi")
.innerText =
"Rp " +
totalKomisi.toLocaleString("id-ID");

document.getElementById("komisiCair")
.innerText =
"Rp " +
komisiCair.toLocaleString("id-ID");

document.getElementById("komisiPending")
.innerText =
"Rp " +
komisiPending.toLocaleString("id-ID");

document.getElementById("totalReferral")
.innerText =
totalReferral;

if(snapshot.empty){

container.innerHTML = `

<div class="dashboard-card">

<h3>
Belum Ada Komisi
</h3>

<p>
Komisi affiliate akan muncul otomatis setelah ada pembelian melalui link affiliate Anda.
</p>

</div>

`;

}

});

</script>

</body>
</html>
