<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wishlist Saya - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="products">

<div style="text-align:center;margin-bottom:30px;">

<h1>❤️ Wishlist Saya</h1>

<p id="totalWishlist">
0 Produk Disimpan
</p>

<div style="
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
">

<a
href="produk.html"
class="btn-primary">
🛍 Cari Produk
</a>

<button
onclick="hapusSemuaWishlist()"
class="btn-secondary">
🗑 Hapus Semua
</button>

</div>

</div>

<div
id="wishlistContainer"
class="product-grid">

<p>Memuat Wishlist...</p>

</div>

</section>

<script>

let wishlist =
JSON.parse(
localStorage.getItem("favorit")
) || [];

const container =
document.getElementById(
"wishlistContainer"
);

const totalWishlist =
document.getElementById(
"totalWishlist"
);

renderWishlist();

function renderWishlist(){

container.innerHTML = "";

totalWishlist.innerText =
wishlist.length +
" Produk Disimpan";

if(wishlist.length === 0){

container.innerHTML = `

<div class="dashboard-card">

<h3>
Wishlist Kosong
</h3>

<p>
Belum ada produk favorit.
</p>

<br>

<a
href="produk.html"
class="btn-primary">

Mulai Belanja

</a>

</div>

`;

return;

}

wishlist.forEach(
(produk,index)=>{

container.innerHTML += `

<div class="product-card">

<img
src="${
produk.gambar ||
'https://picsum.photos/400/300'
}"
alt="${
produk.namaProduk || 'Produk'
}">

<div class="product-info">

<span class="category">
${produk.kategori || "Produk"}
</span>

<h3>
${produk.namaProduk || "-"}
</h3>

<p class="price">
${produk.harga || "Rp 0"}
</p>

<div style="
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
">

<a
href="produk-detail.html?id=${produk.id}"
class="btn-primary">

Lihat Produk

</a>

<button
onclick="hapusDariWishlist(${index})"
class="btn-secondary">

❌ Hapus

</button>

</div>

</div>

</div>

`;

});

}

window.hapusDariWishlist =
function(index){

if(
!confirm(
"Hapus produk dari wishlist?"
)
){
return;
}

wishlist.splice(index,1);

localStorage.setItem(
"favorit",
JSON.stringify(wishlist)
);

renderWishlist();

};

window.hapusSemuaWishlist =
function(){

if(
!confirm(
"Hapus semua wishlist?"
)
){
return;
}

localStorage.removeItem(
"favorit"
);

wishlist = [];

renderWishlist();

};

</script>

</body>
</html>
