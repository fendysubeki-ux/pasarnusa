<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <title>Desa - PasarNusa</title>

  <!-- Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ── Banner Desa ─────────────────────────────────────── -->
  <section class="hero">
    <img
      id="bannerDesa"
      src="https://placehold.co/1200x400"
      alt="Banner desa"
      style="width:100%; height:260px; object-fit:cover; border-radius:20px;"
    >
  </section>

  <!-- ── Nama & Lokasi Desa ──────────────────────────────── -->
  <section class="dashboard">
    <h1 id="namaDesa">Memuat...</h1>
    <p id="lokasiDesa">Kabupaten</p>
  </section>

  <!-- ── Ringkasan Statistik ────────────────────────────── -->
  <section class="dashboard">
    <div class="dashboard-grid">
      <div class="dashboard-card">
        <h3 id="statUmkm">0</h3>
        <p>UMKM</p>
      </div>
      <div class="dashboard-card">
        <h3 id="statProduk">0</h3>
        <p>Produk</p>
      </div>
      <div class="dashboard-card">
        <h3 id="statUnggulan">0</h3>
        <p>Produk Unggulan</p>
      </div>
      <div class="dashboard-card">
        <h3 id="statKategori">0</h3>
        <p>Kategori</p>
      </div>
    </div>
  </section>

  <!-- ── Tentang Desa ────────────────────────────────────── -->
  <section class="dashboard">
    <h2>📖 Tentang Desa</h2>
    <div class="dashboard-card">
      <p id="deskripsiDesa">Memuat informasi desa...</p>
    </div>
  </section>

  <!-- ── Pencarian Produk ────────────────────────────────── -->
  <section class="dashboard">
    <h2>🔍 Cari Produk</h2>
    <input
      id="searchProduk"
      class="search-box"
      type="text"
      placeholder="Cari produk desa..."
      aria-label="Cari produk desa"
    >
  </section>

  <!-- ── Produk Unggulan ─────────────────────────────────── -->
  <section class="dashboard">
    <h2>⭐ Produk Unggulan</h2>
    <div id="produkUnggulanContainer" class="dashboard-grid">
      <div class="dashboard-card">Memuat produk unggulan...</div>
    </div>
  </section>

  <!-- ── Semua Produk ────────────────────────────────────── -->
  <section class="dashboard">
    <h2>🏪 Semua Produk Desa</h2>
    <div id="produkContainer" class="dashboard-grid">
      <div class="dashboard-card">Memuat produk...</div>
    </div>
  </section>

  <!-- ── Firebase + Logika Halaman ──────────────────────── -->
  <script type="module">
    import { initializeApp }   from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    // ── Konfigurasi Firebase ──────────────────────────────
    const firebaseConfig = {
      apiKey:            "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
      authDomain:        "pasarnusa-18aa0.firebaseapp.com",
      projectId:         "pasarnusa-18aa0",
      storageBucket:     "pasarnusa-18aa0.firebasestorage.app",
      messagingSenderId: "866998011671",
      appId:             "1:866998011671:web:5555115feb82741ab55952",
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    // ── Baca parameter ?desa= dari URL ───────────────────
    const namaDesa = new URLSearchParams(window.location.search).get("desa");

    // ── Referensi elemen DOM ──────────────────────────────
    const el = {
      namaDesa:         document.getElementById("namaDesa"),
      lokasiDesa:       document.getElementById("lokasiDesa"),
      deskripsiDesa:    document.getElementById("deskripsiDesa"),
      bannerDesa:       document.getElementById("bannerDesa"),
      statUmkm:         document.getElementById("statUmkm"),
      statProduk:       document.getElementById("statProduk"),
      statUnggulan:     document.getElementById("statUnggulan"),
      statKategori:     document.getElementById("statKategori"),
      searchProduk:     document.getElementById("searchProduk"),
      produkContainer:  document.getElementById("produkContainer"),
      unggulanContainer:document.getElementById("produkUnggulanContainer"),
    };

    // Semua produk milik desa ini, disimpan untuk pencarian
    let semuaProduk = [];

    // ── Placeholder fallback gambar ───────────────────────
    const PLACEHOLDER = "https://placehold.co/400x300";

    // ── Format harga ke Rupiah ────────────────────────────
    const formatRupiah = (angka) =>
      "Rp " + Number(angka || 0).toLocaleString("id-ID");

    // ── Card HTML produk (dipakai di dua tempat) ──────────
    function buatKartuProduk(item, isUnggulan = false) {
      const foto  = item.fotoProduk || item.gambar || PLACEHOLDER;
      const harga = formatRupiah(item.harga);
      const link  = `detail-produk.html?id=${item.id}`;

      return `
        <div class="dashboard-card">
          <img
            src="${foto}"
            alt="${item.namaProduk || 'Produk'}"
            loading="lazy"
            style="width:100%; height:180px; object-fit:cover; border-radius:15px;"
          >
          <h3>${isUnggulan ? "⭐ " : ""}${item.namaProduk || "-"}</h3>
          ${!isUnggulan ? `<p>🏪 ${item.namaToko || "-"}</p>` : ""}
          <p>💰 ${harga}</p>
          <a href="${link}" class="${isUnggulan ? "btn-secondary" : "btn-primary"}">
            ${isUnggulan ? "Lihat" : "Lihat Produk"}
          </a>
        </div>
      `;
    }

    // ── Muat data desa dari Firestore ─────────────────────
    async function loadDesa() {
      try {
        const desaSnap = await getDocs(collection(db, "desa"));

        // Cari dokumen desa yang cocok dengan nama di URL
        const desaDoc = desaSnap.docs
          .map(d => d.data())
          .find(d => d.nama === namaDesa);

        if (!desaDoc) {
          el.namaDesa.textContent    = "Desa tidak ditemukan";
          el.deskripsiDesa.textContent = "Data desa tidak tersedia.";
          return;
        }

        // Isi informasi utama desa
        el.namaDesa.textContent      = desaDoc.nama;
        el.lokasiDesa.textContent    = `${desaDoc.kecamatan}, ${desaDoc.kabupaten}`;
        el.deskripsiDesa.textContent = desaDoc.deskripsi || "-";
        el.bannerDesa.src            = desaDoc.banner || PLACEHOLDER;
        el.bannerDesa.alt            = `Banner ${desaDoc.nama}`;

        // Setelah info desa siap, muat produk
        await loadProduk();

      } catch (err) {
        console.error("Gagal memuat data desa:", err);
        el.namaDesa.textContent = "Terjadi kesalahan";
      }
    }

    // ── Muat semua produk milik desa ini ──────────────────
    async function loadProduk() {
      try {
        const snapshot = await getDocs(collection(db, "produk"));

        // Filter hanya produk yang berasal dari desa ini
        semuaProduk = snapshot.docs
          .filter(d => d.data().desa === namaDesa)
          .map(d => ({ id: d.id, ...d.data() }));

        // Hitung statistik
        const umkmUnik    = new Set(semuaProduk.map(p => p.uidUmkm).filter(Boolean));
        const kategoriUnik = new Set(semuaProduk.map(p => p.kategori).filter(Boolean));
        const unggulan     = semuaProduk.filter(p => p.unggulan === true);

        // Tampilkan statistik
        el.statUmkm.textContent     = umkmUnik.size;
        el.statProduk.textContent   = semuaProduk.length;
        el.statUnggulan.textContent = unggulan.length;
        el.statKategori.textContent = kategoriUnik.size;

        // Render grid produk
        renderProduk();
        renderProdukUnggulan(unggulan);

      } catch (err) {
        console.error("Gagal memuat produk:", err);
        el.produkContainer.innerHTML =
          `<div class="dashboard-card"><p>Gagal memuat produk. Coba muat ulang halaman.</p></div>`;
      }
    }

    // ── Render grid semua produk (dengan filter pencarian) ─
    function renderProduk() {
      const keyword = el.searchProduk.value.trim().toLowerCase();

      const hasil = keyword
        ? semuaProduk.filter(p =>
            (p.namaProduk || "").toLowerCase().includes(keyword)
          )
        : semuaProduk;

      if (hasil.length === 0) {
        el.produkContainer.innerHTML = `
          <div class="dashboard-card">
            <h3>Produk tidak ditemukan</h3>
            <p>${keyword ? `Tidak ada hasil untuk "<strong>${keyword}</strong>".` : "Produk desa belum tersedia."}</p>
          </div>
        `;
        return;
      }

      el.produkContainer.innerHTML = hasil.map(p => buatKartuProduk(p)).join("");
    }

    // ── Render grid produk unggulan ────────────────────────
    function renderProdukUnggulan(unggulan) {
      if (unggulan.length === 0) {
        el.unggulanContainer.innerHTML =
          `<div class="dashboard-card">Belum ada produk unggulan.</div>`;
        return;
      }

      el.unggulanContainer.innerHTML = unggulan.map(p => buatKartuProduk(p, true)).join("");
    }

    // ── Event: pencarian produk (debounce ringan 200ms) ────
    let debounceTimer;
    el.searchProduk.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderProduk, 200);
    });

    // ── Mulai muat halaman ─────────────────────────────────
    loadDesa();
  </script>

</body>
</html>
