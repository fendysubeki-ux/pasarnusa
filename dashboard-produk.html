<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produk Saya</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="my-products">

<h1>Produk Saya</h1>

<div
id="produkSaya"
class="product-grid">
</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain: "pasarnusa-18aa0.firebaseapp.com",
projectId: "pasarnusa-18aa0",
storageBucket: "pasarnusa-18aa0.firebasestorage.app",
messagingSenderId: "866998011671",
appId: "1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href =
"login.html";

}

});
const produkSaya =
document.getElementById("produkSaya");
await auth.authStateReady();
const snapshot =
await getDocs(
collection(db,"produk")
);

snapshot.forEach((doc)=>{

const produk = doc.data();

if(
auth.currentUser &&
produk.uid === auth.currentUser.uid
){

produkSaya.innerHTML += `



<div class="product-card">

<img src="${produk.gambar?.[0] || produk.gambar}">

<div class="product-info">

<span class="category">
${produk.kategori}
</span>

<h3>
${produk.namaProduk}
</h3>

<p class="price">
Rp ${Number(produk.harga)
.toLocaleString("id-ID")}
</p>

<p>
Stok: ${produk.stok}
</p>

<p>
Terjual: ${produk.terjual}
</p>
<div class="action-buttons">

<a
href="edit-produk.html?id=${doc.id}"
class="btn-secondary">

Edit

</a>

<button
onclick="hapusProduk('${doc.id}')"
class="delete-btn">

Hapus

</button>

</div>
</div>

</div>

`;

}

});
window.hapusProduk =
async(id)=>{

const yakin =
confirm(
"Yakin ingin menghapus produk ini?"
);

if(!yakin) return;

try{

await deleteDoc(
doc(db,"produk",id)
);

alert(
"Produk berhasil dihapus"
);

location.reload();

}catch(error){

alert(error.message);

}

};

</script>
</body>

</html>
