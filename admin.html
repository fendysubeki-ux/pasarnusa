<!DOCTYPE html>
<html>
<head>
<title>Dashboard Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Dashboard Admin PasarNusa</h1>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3 id="totalUmkm">0</h3>
<p>Total UMKM</p>
</div>

<div class="dashboard-card">
<h3 id="totalProduk">0</h3>
<p>Total Produk</p>
</div>

<div class="dashboard-card">
<h3 id="totalPesanan">0</h3>
<p>Total Pesanan</p>
</div>

</div>
<div class="dashboard-grid"
id="pencairanContainer">
</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain: "pasarnusa-18aa0.firebaseapp.com",
projectId: "pasarnusa-18aa0",
storageBucket: "pasarnusa-18aa0.firebasestorage.app",
messagingSenderId: "866998011671",
appId: "1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const umkm =
await getDocs(collection(db,"umkm"));

const produk =
await getDocs(collection(db,"produk"));

const pesanan =
await getDocs(collection(db,"pesanan"));

document.getElementById("totalUmkm").innerText =
umkm.size;

document.getElementById("totalProduk").innerText =
produk.size;

document.getElementById("totalPesanan").innerText =
pesanan.size;
const pencairan =
await getDocs(
collection(
db,
"pencairan_komisi"
)
);

const container =
document.getElementById(
"pencairanContainer"
);

pencairan.forEach((item)=>{

const data = item.data();

container.innerHTML += `

<div class="dashboard-card">

<h3>
Pencairan Komisi
</h3>

<p>
UID:
${data.uid}
</p>

<p>
Rp ${Number(
data.jumlah || 0
).toLocaleString("id-ID")}
</p>

<p>
${data.status}
</p>

<button
onclick="verifikasiPencairan(
'${item.id}'
)"
class="btn-primary">

Verifikasi

</button>

</div>

`;

});
window.verifikasiPencairan =
async(id)=>{

await updateDoc(
doc(
db,
"pencairan_komisi",
id
),
{
status:
"Disetujui"
}
);

alert(
"Pencairan disetujui"
);

location.reload();

};
</script>

</body>
</html>
