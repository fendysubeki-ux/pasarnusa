<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tambah Produk - PasarNusa</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="product-form">

<h1>Tambah Produk</h1>

<div class="form-card">

<input
type="text"
placeholder="Nama Produk">

<input
type="number"
placeholder="Harga Produk">

<input
type="number"
placeholder="Stok Produk">

<input
type="text"
placeholder="Kategori">

<label>Upload Foto Produk</label>

<input
type="file"
accept="image/*"
id="productImage">

<img
id="previewImage"
src=""
alt="Preview Produk"
style="display:none;">

<textarea
placeholder="Deskripsi Produk">
</textarea>

<button id="simpanProduk">
Simpan Produk
</button>

</div>

</section>
<script type="module" src="script.js"></script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
getAuth
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
  authDomain: "pasarnusa-18aa0.firebaseapp.com",
  projectId: "pasarnusa-18aa0",
  storageBucket: "pasarnusa-18aa0.firebasestorage.app",
  messagingSenderId: "866998011671",
  appId: "1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
document.getElementById("simpanProduk")
.addEventListener("click", async () => {
alert("Tombol Simpan diklik");
  const inputs =
  document.querySelectorAll(".form-card input");

  const textarea =
  document.querySelector(".form-card textarea");

  try {

await addDoc(collection(db,"produk"), {

namaProduk: inputs[0].value,
harga: inputs[1].value,
stok: inputs[2].value,
kategori: inputs[3].value,
deskripsi: textarea.value,

createdAt: new Date()

});

    alert("Produk berhasil disimpan");

  } catch(error){

    alert(error.message);
    console.log(error);

  }

});

</script>
</body>
</html>
