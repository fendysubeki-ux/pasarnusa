<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tambah Produk - PasarNusa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="product-form">

<h1>Tambah Produk</h1>

<div class="form-card">

<input
type="text"
id="namaProduk"
placeholder="Nama Produk">

<input
type="number"
id="hargaProduk"
placeholder="Harga Produk">

<input
type="number"
id="stokProduk"
placeholder="Stok Produk">

<input
type="text"
id="kategoriProduk"
placeholder="Kategori">

<textarea
id="deskripsiProduk"
placeholder="Deskripsi Produk">
</textarea>
<input
type="file"
id="productImage"
accept="image/*"
multiple>
<div id="previewContainer"></div>

<button id="simpanProduk">
Simpan Produk
</button>

</div>

</section>
<script type="module" src="script.js"></script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
  authDomain: "pasarnusa-18aa0.firebaseapp.com",
  projectId: "pasarnusa-18aa0",
  storageBucket: "pasarnusa-18aa0.firebasestorage.app",
  messagingSenderId: "866998011671",
  appId: "1:866998011671:web:5555115feb82741ab55952"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);
const imageInput =
document.getElementById("productImage");

const previewContainer =
document.getElementById("previewContainer");

if(imageInput && previewContainer){

imageInput.addEventListener("change",(e)=>{

previewContainer.innerHTML = "";

Array.from(e.target.files)
.forEach((file)=>{

const img =
document.createElement("img");

img.src =
URL.createObjectURL(file);

img.style.width = "100px";
img.style.height = "100px";
img.style.objectFit = "cover";
img.style.borderRadius = "12px";
img.style.margin = "5px";

previewContainer.appendChild(img);

});

});

}
document.getElementById("simpanProduk")
.addEventListener("click", async () => {

try {

const files =
document.getElementById(
"productImage"
).files;

if(files.length === 0){

alert("Pilih gambar produk");

return;

}
let imageUrls = [];

for(const file of files){

const storageRef =
ref(
storage,
"produk/" +
Date.now() +
"_" +
file.name
);

await uploadBytes(
storageRef,
file
);

const url =
await getDownloadURL(
storageRef
);

imageUrls.push(url);

}
if(!auth.currentUser){

alert("Silakan login terlebih dahulu");

return;

}
await addDoc(collection(db,"produk"), {
whatsapp:
localStorage.getItem("whatsapp"),
namaToko:
localStorage.getItem("namaUmkm"),
uid: auth.currentUser?.uid,
namaProduk:
document.getElementById("namaProduk").value,

harga:
Number(
document.getElementById("hargaProduk").value
),

stok:
Number(
document.getElementById("stokProduk").value
),

kategori:
document.getElementById("kategoriProduk").value,

deskripsi:
document.getElementById("deskripsiProduk").value,
gambar: imageUrls,
createdAt: new Date(),
terjual: 0

});

alert("Produk berhasil disimpan");

window.location.href =
"dashboard-produk.html";

} catch(error){

alert(error.message);

}

});

</script>
</body>
</html>
