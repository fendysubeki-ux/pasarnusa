<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tambah Produk - PasarNusa</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="product-form">

<h1>Tambah Produk</h1>

<div class="form-card">

<input
type="text"
placeholder="Nama Produk">

<input
type="number"
placeholder="Harga Produk">

<input
type="number"
placeholder="Stok Produk">

<input
type="text"
placeholder="Kategori">

<label>Upload Foto Produk</label>

<input
type="file"
accept="image/*"
id="productImage">

<img
id="previewImage"
src=""
alt="Preview Produk"
style="display:none;">

<textarea
placeholder="Deskripsi Produk">
</textarea>

<button id="simpanProduk">
Simpan Produk
</button>

</div>

</section>
<script type="module" src="script.js"></script>
</body>
</html>
