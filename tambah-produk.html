<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tambah Produk - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="product-form">

<h1>➕ Tambah Produk</h1>

<div class="form-card">

<input
type="text"
id="namaProduk"
placeholder="Nama Produk">

<input
type="number"
id="hargaProduk"
placeholder="Harga Produk">

<input
type="number"
id="stokProduk"
placeholder="Jumlah Stok">

<select id="kategoriProduk">

<option value="">
Pilih Kategori
</option>

<option value="Makanan">
Makanan
</option>

<option value="Minuman">
Minuman
</option>

<option value="Kerajinan">
Kerajinan
</option>

<option value="Fashion">
Fashion
</option>

<option value="Lainnya">
Lainnya
</option>

</select>

<textarea
id="deskripsiProduk"
placeholder="Deskripsi Produk">
</textarea>

<input
type="file"
id="productImage"
accept="image/*"
multiple>

<div id="previewContainer"></div>

<button
id="simpanProduk"
class="btn-primary">

Simpan Produk

</button>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
doc,
getDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_AUTH_DOMAIN",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_STORAGE_BUCKET",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

const storage = getStorage(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

}

const imageInput =
document.getElementById("productImage");

const previewContainer =
document.getElementById("previewContainer");

imageInput.addEventListener(
"change",
(e)=>{

previewContainer.innerHTML = "";

Array.from(e.target.files)
.forEach((file)=>{

const img =
document.createElement("img");

img.src =
URL.createObjectURL(file);

img.style.width = "100px";
img.style.height = "100px";
img.style.objectFit = "cover";
img.style.borderRadius = "12px";
img.style.margin = "5px";

previewContainer.appendChild(img);

});

});

document
.getElementById("simpanProduk")
.addEventListener(
"click",
async()=>{

const btn =
document.getElementById(
"simpanProduk"
);

try{

const nama =
document.getElementById(
"namaProduk"
).value.trim();

const harga =
document.getElementById(
"hargaProduk"
).value;

const stok =
document.getElementById(
"stokProduk"
).value;

const kategori =
document.getElementById(
"kategoriProduk"
).value;

const deskripsi =
document.getElementById(
"deskripsiProduk"
).value.trim();

if(
!nama ||
!harga ||
!stok ||
!kategori ||
!deskripsi
){

alert(
"Lengkapi semua data"
);

return;

}

const files =
imageInput.files;

if(files.length === 0){

alert(
"Pilih minimal 1 foto"
);

return;

}

if(files.length > 5){

alert(
"Maksimal 5 foto"
);

return;

}

for(const file of files){

if(
!file.type.startsWith(
"image/"
)
){

alert(
"File harus berupa gambar"
);

return;

}

if(
file.size >
2 * 1024 * 1024
){

alert(
"Ukuran foto maksimal 2 MB"
);

return;

}

}

btn.disabled = true;
btn.innerText = "Mengupload...";

const userDoc =
await getDoc(
doc(
db,
"users",
auth.currentUser.uid
)
);

const userData =
userDoc.data();

let imageUrls = [];

for(const file of files){

const storageRef =
ref(
storage,
"produk/" +
Date.now() +
"_" +
file.name
);

await uploadBytes(
storageRef,
file
);

const url =
await getDownloadURL(
storageRef
);

imageUrls.push(url);

}

await addDoc(
collection(
db,
"produk"
),
{

uid:
auth.currentUser.uid,

namaToko:
userData.namaUmkm,

whatsapp:
userData.whatsapp,

namaProduk:nama,

harga:Number(harga),

stok:Number(stok),

kategori:kategori,

deskripsi:deskripsi,

gambar:imageUrls,

rating:0,

totalReview:0,

terjual:0,

status:"Aktif",

createdAt:
serverTimestamp()

}
);

alert(
"Produk berhasil ditambahkan"
);

window.location.href =
"dashboard-produk.html";

}
catch(error){

console.error(error);

alert(
"Gagal menambahkan produk"
);

}
finally{

btn.disabled = false;
btn.innerText = "Simpan Produk";

}

});

</script>

</body>
</html>
