<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verifikasi Pembayaran - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>
<h1>💳 Verifikasi Pembayaran</h1>
<p>Periksa dan verifikasi pembayaran pelanggan</p>
</div>

<a
href="dashboard-umkm.html"
class="btn-secondary">
← Dashboard
</a>

</div>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3 id="totalMenunggu">0</h3>
<p>Menunggu Verifikasi</p>
</div>

<div class="dashboard-card">
<h3 id="totalDiproses">0</h3>
<p>Sedang Diproses</p>
</div>

<div class="dashboard-card">
<h3 id="totalDikirim">0</h3>
<p>Sudah Dikirim</p>
</div>

</div>

<input
type="text"
id="searchPesanan"
class="search-box"
placeholder="Cari nama pembeli...">

<div
id="pesananContainer"
class="dashboard-grid">

<div class="dashboard-card">
<p>Memuat data pembayaran...</p>
</div>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
addDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

}

const role =
localStorage.getItem("role");

if(role !== "umkm"){

window.location.href =
"index.html";

}

const uid =
auth.currentUser.uid;

const container =
document.getElementById(
"pesananContainer"
);

try{

const snapshot =
await getDocs(
collection(db,"pesanan")
);

container.innerHTML = "";

let totalMenunggu = 0;
let totalDiproses = 0;
let totalDikirim = 0;

snapshot.forEach((docSnap)=>{

const data =
docSnap.data();

const adaProdukSaya =
(data.items || [])
.some(
item => item.uid === uid
);

if(!adaProdukSaya){

return;

}

if(
data.status ===
"Menunggu Verifikasi"
){
totalMenunggu++;
}

if(
data.status ===
"Diproses"
){
totalDiproses++;
}

if(
data.status ===
"Dikirim"
){
totalDikirim++;
}

container.innerHTML += `

<div
class="dashboard-card pembayaran-item">

<h3>
${data.namaPembeli || "-"}
</h3>

<p>
📱 ${data.whatsapp || "-"}
</p>

<p>
📍 ${data.alamat || "-"}
</p>

<hr>

<p>
💰 Total:
<b>
Rp ${Number(
data.totalBayar || 0
).toLocaleString("id-ID")}
</b>
</p>

<p>
📦 Status:
<b>
${data.status || "-"}
</b>
</p>

${
data.buktiTransfer
?

`
<img
src="${data.buktiTransfer}"
style="
width:100%;
border-radius:12px;
margin-top:10px;
">

<br><br>

<a
href="${data.buktiTransfer}"
target="_blank"
class="btn-secondary">

Lihat Full

</a>
`

:

`
<p>
Belum upload bukti transfer
</p>
`

}

<br><br>

<button
onclick="verifikasiPesanan('${docSnap.id}','${data.uidPembeli}')"
class="btn-primary">

✅ Verifikasi

</button>

<button
onclick="ubahStatus('${docSnap.id}','${data.uidPembeli}','Dikirim')"
class="btn-secondary">

🚚 Dikirim

</button>

<button
onclick="ubahStatus('${docSnap.id}','${data.uidPembeli}','Selesai')"
class="btn-secondary">

✔️ Selesai

</button>

</div>

`;

});

document.getElementById(
"totalMenunggu"
).innerText =
totalMenunggu;

document.getElementById(
"totalDiproses"
).innerText =
totalDiproses;

document.getElementById(
"totalDikirim"
).innerText =
totalDikirim;

}catch(error){

console.error(error);

container.innerHTML = `
<div class="dashboard-card">
Gagal memuat data pembayaran
</div>
`;

}

window.verifikasiPesanan =
async(id,pembeli)=>{

await updateDoc(
doc(db,"pesanan",id),
{
status:"Diproses",
verifiedAt:new Date()
}
);

await addDoc(
collection(db,"notifikasi"),
{
uid:pembeli,
judul:"Pembayaran Diverifikasi",
pesan:"Pesanan Anda sedang diproses.",
dibaca:false,
createdAt:new Date()
}
);

alert(
"Pembayaran berhasil diverifikasi"
);

location.reload();

};

window.ubahStatus =
async(id,pembeli,status)=>{

await updateDoc(
doc(db,"pesanan",id),
{
status:status
}
);

await addDoc(
collection(db,"notifikasi"),
{
uid:pembeli,
judul:"Status Pesanan",
pesan:
"Status pesanan berubah menjadi " +
status,
dibaca:false,
createdAt:new Date()
}
);

alert(
"Status berhasil diperbarui"
);

location.reload();

};

document
.getElementById("searchPesanan")
.addEventListener(
"input",
(e)=>{

const keyword =
e.target.value.toLowerCase();

document
.querySelectorAll(
".pembayaran-item"
)
.forEach((item)=>{

item.style.display =

item.innerText
.toLowerCase()
.includes(keyword)

? "block"
: "none";

});

}
);

</script>

</body>
</html>
