<!DOCTYPE html><html lang="id">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verifikasi Pembayaran - PasarNusa</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><section class="dashboard"><div class="dashboard-header"><div><h1>💳 Verifikasi Pembayaran</h1><p>
Periksa bukti transfer dari pembeli.
</p></div><a href="dashboard.html" class="btn-secondary">
Kembali
</a></div><div class="dashboard-grid"><div class="dashboard-card">
<h3 id="totalMenunggu">0</h3>
<p>Menunggu Verifikasi</p>
</div><div class="dashboard-card">
<h3 id="totalDiproses">0</h3>
<p>Sedang Diproses</p>
</div><div class="dashboard-card">
<h3 id="totalDikirim">0</h3>
<p>Sudah Dikirim</p>
</div></div><input
type="text"
id="searchPesanan"
class="search-box"
placeholder="Cari nama pembeli...">

<div
id="pesananContainer"
class="dashboard-grid"><div class="dashboard-card">
<p>Memuat data...</p>
</div></div></section><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_PROJECT.appspot.com",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href =
"login.html";

}

const container =
document.getElementById(
"pesananContainer"
);

const snapshot =
await getDocs(
collection(db,"pesanan")
);

container.innerHTML = "";

let totalMenunggu = 0;
let totalDiproses = 0;
let totalDikirim = 0;

snapshot.forEach((item)=>{

const data = item.data();

if(data.uid !== auth.currentUser.uid){

return;

}

if(data.status === "Menunggu Verifikasi")
totalMenunggu++;

if(data.status === "Diproses")
totalDiproses++;

if(data.status === "Dikirim")
totalDikirim++;

container.innerHTML += `

<div class="dashboard-card pesanan-item">

<h3>
${data.namaPembeli || "-"}
</h3>

<p>
📱 ${data.whatsapp || "-"}
</p>

<p>
📍 ${data.alamat || "-"}
</p>

<hr>

<p>
💰 Total:
<b>
Rp ${Number(
data.totalBayar || 0
).toLocaleString("id-ID")}
</b>
</p>

<p>
📦 Status:
<b>
${data.status || "-"}
</b>
</p>

${
data.buktiTransfer
?
`
<img
src="${data.buktiTransfer}"
style="
width:100%;
border-radius:12px;
margin-top:10px;
">

<br><br>

<a
href="${data.buktiTransfer}"
target="_blank"
class="btn-secondary">

Lihat Full

</a>
`
:
`
<p>
Belum ada bukti transfer
</p>
`
}

<br><br>

<button
onclick="verifikasiPesanan('${item.id}','${data.uidPembeli}')"
class="btn-primary">

✅ Verifikasi

</button>

<button
onclick="ubahStatus('${item.id}','Dikirim')"
class="btn-secondary">

🚚 Dikirim

</button>

<button
onclick="ubahStatus('${item.id}','Selesai')"
class="btn-secondary">

✔️ Selesai

</button>

</div>

`;

});

document.getElementById(
"totalMenunggu"
).innerText =
totalMenunggu;

document.getElementById(
"totalDiproses"
).innerText =
totalDiproses;

document.getElementById(
"totalDikirim"
).innerText =
totalDikirim;

window.verifikasiPesanan =
async(id,pembeli)=>{

await updateDoc(
doc(db,"pesanan",id),
{
status:"Diproses"
}
);

await addDoc(
collection(db,"notifikasi"),
{
uid:pembeli,
judul:"Pembayaran Diverifikasi",
pesan:"Pesanan Anda sedang diproses.",
dibaca:false,
createdAt:new Date()
}
);

alert(
"Pembayaran berhasil diverifikasi"
);

location.reload();

};

window.ubahStatus =
async(id,status)=>{

await updateDoc(
doc(db,"pesanan",id),
{
status:status
}
);

alert(
"Status berhasil diperbarui"
);

location.reload();

};

document
.getElementById(
"searchPesanan"
)
.addEventListener(
"input",
(e)=>{

const keyword =
e.target.value.toLowerCase();

document
.querySelectorAll(
".pesanan-item"
)
.forEach((item)=>{

item.style.display =
item.innerText
.toLowerCase()
.includes(keyword)
?
"block"
:
"none";

});

}
);

</script></body>
</html>
