<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verifikasi Pembayaran - PasarNusa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="dashboard">

<div class="dashboard-header">

<div>
<h1>💳 Verifikasi Pembayaran</h1>
<p>Periksa dan verifikasi pembayaran pelanggan</p>
</div>

<a
href="dashboard-umkm.html"
class="btn-secondary">
← Dashboard
</a>

</div>

<div class="dashboard-grid">

<div class="dashboard-card">
<h3 id="totalMenunggu">0</h3>
<p>Menunggu Verifikasi</p>
</div>

<div class="dashboard-card">
<h3 id="totalDiproses">0</h3>
<p>Sedang Diproses</p>
</div>

<div class="dashboard-card">
<h3 id="totalDikirim">0</h3>
<p>Sudah Dikirim</p>
</div>

</div>

<input
type="text"
id="searchPesanan"
class="search-box"
placeholder="Cari nama pembeli...">

<div
id="pesananContainer"
class="dashboard-grid">

<div class="dashboard-card">
<p>Memuat data pembayaran...</p>
</div>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where,
doc,
updateDoc,
addDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDq9vebvgycrR27JMQ4Mlnf5JsgZu5KeQk",
authDomain:"pasarnusa-18aa0.firebaseapp.com",
projectId:"pasarnusa-18aa0",
storageBucket:"pasarnusa-18aa0.firebasestorage.app",
messagingSenderId:"866998011671",
appId:"1:866998011671:web:5555115feb82741ab55952"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

await auth.authStateReady();

if(!auth.currentUser){

window.location.href = "login.html";

}

const uid = auth.currentUser.uid;

const container =
document.getElementById(
"pesananContainer"
);

let semuaPesanan = [];

loadPesanan();

async function loadPesanan(){

container.innerHTML =
"<p>Memuat data...</p>";

const snapshot =
await getDocs(
collection(db,"pesanan")
);

semuaPesanan = [];

snapshot.forEach((docSnap)=>{

const data = docSnap.data();

const adaProdukSaya =
(data.items || []).some(
item => item.uid === uid
);

if(
!adaProdukSaya ||
!data.buktiTransfer
){
return;
}
semuaPesanan.push({
id:docSnap.id,
...data
});

});

renderPesanan(semuaPesanan);
const totalMenunggu =
semuaPesanan.filter(
item =>
item.status === "Menunggu Verifikasi"
).length;

const totalDiproses =
semuaPesanan.filter(
item =>
item.status === "Diproses"
).length;

const totalDikirim =
semuaPesanan.filter(
item =>
item.status === "Dikirim"
).length;

document.getElementById(
"totalMenunggu"
).innerText =
totalMenunggu;

document.getElementById(
"totalDiproses"
).innerText =
totalDiproses;

document.getElementById(
"totalDikirim"
).innerText =
totalDikirim;
}

function renderPesanan(data){

container.innerHTML = "";

if(data.length === 0){

container.innerHTML = `

<div class="dashboard-card">

<h3>
Tidak Ada Data
</h3>

<p>
Belum ada pembayaran masuk.
</p>

</div>

`;

return;

}

data.forEach((pesanan)=>{

container.innerHTML += `

<div class="dashboard-card pembayaran-item">

<h3>
${pesanan.namaPembeli || "-"}
</h3>

<p>
📱 ${pesanan.whatsapp || "-"}
</p>

<p>
💰 Rp ${Number(
pesanan.totalBayar || 0
).toLocaleString("id-ID")}
</p>

<p>
📦 ${pesanan.status || "-"}
</p>

${
pesanan.buktiTransfer
?
`
<img
src="${pesanan.buktiTransfer}"
style="
width:100%;
margin-top:10px;
border-radius:12px;
">
`
:
"<p>Belum ada bukti transfer</p>"
}

<br><br>

${
pesanan.status ===
"Menunggu Verifikasi"
?
`
<button
class="btn-primary"
onclick="verifikasiPesanan('${pesanan.id}','${pesanan.uidPembeli}')">

✅ Verifikasi

</button>
`
:
""
}

<button
class="btn-secondary"
onclick="ubahStatus('${pesanan.id}','${pesanan.uidPembeli}','Dikirim')">

🚚 Dikirim

</button>

<button
class="btn-secondary"
onclick="ubahStatus('${pesanan.id}','${pesanan.uidPembeli}','Selesai')">

✔️ Selesai

</button>

</div>

`;

});

}

window.verifikasiPesanan =
async(id,pembeli)=>{

if(
!confirm(
"Verifikasi pembayaran ini?"
)
){
return;
}

await updateDoc(
doc(db,"pesanan",id),
{
status:"Diproses",
statusPembayaran:"Lunas"
}
);

await addDoc(
collection(db,"notifikasi"),
{
uid:pembeli,
judul:"Pembayaran Diverifikasi",
pesan:"Pesanan Anda sedang diproses.",
dibaca:false,
createdAt:new Date()
}
);

alert("Berhasil");

location.reload();

};

window.ubahStatus =
async(id,pembeli,status)=>{

await updateDoc(
doc(db,"pesanan",id),
{
status:status
}
);

await addDoc(
collection(db,"notifikasi"),
{
uid:pembeli,
judul:"Status Pesanan",
pesan:
"Pesanan berubah menjadi " +
status,
dibaca:false,
createdAt:new Date()
}
);

alert("Status diperbarui");

location.reload();

};

document
.getElementById("searchPesanan")
.addEventListener(
"input",
(e)=>{

const keyword =
e.target.value.toLowerCase();

renderPesanan(

semuaPesanan.filter(item=>

(item.namaPembeli || "")
.toLowerCase()
.includes(keyword)

)

);

}
);

</script>

</body>
</html>
